# Publishes docs-site to GitHub Pages. Not active here: copy it to .github/workflows/docs.yml
# and set Settings > Pages > Source to "GitHub Actions" to turn it on.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs-site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Set DOCS_BASE_PATH: /supermux when serving from username.github.io/supermux instead of a custom domain.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
