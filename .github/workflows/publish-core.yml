# Publishes @supermux/core and then its supermux-core alias when a tag core-vX.Y.Z is pushed, with npm
# trusted publishing: no token is stored; npm gets a short-lived OIDC token from `id-token: write` and adds
# provenance on its own. Trusted publishing needs npm 11.5.1 or newer (Node 24 ships it) and a package
# that already exists: publish the first version of each package by hand (`npm publish --access public`),
# then on npmjs.com add a trusted publisher for it (GitHub, UstaLabs/supermux, publish-core.yml).
# The tag must be on main and equal the package version. A version with a `-` is a prerelease and
# goes out under the `next` tag. A rerun skips a package whose version is already published.
# The held `supermux` name (packages/supermux-placeholder) is published once by hand.
name: publish-core

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Like release.yml's classify job: a tag cut from a stray branch ships nothing.
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on origin/main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - name: Tag matches the package version
        run: test "core-v$(node -p "require('./packages/supermux-core/package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun run typecheck:core
      - run: bun test packages/supermux-core/tests
      - run: bun run build:core
      - name: Node e2e
        run: node --test "e2e/*.e2e.mjs"
        working-directory: packages/supermux-core
      - name: Publish @supermux/core
        run: bash scripts/publish-npm.sh packages/supermux-core
      - name: Publish the supermux-core alias
        run: bash scripts/publish-npm.sh packages/supermux-core-alias
