# .github/workflows/release.yml
# On every v* tag: native-arch binary builds (+ smoke), multi-arch docker
# image, GitHub Release with checksums, versions.json + pinned compose pushed
# to supermux-website (skipped if the WEBSITE_PUSH_TOKEN secret is absent).
# workflow_dispatch = dry run: builds + smokes everything, publishes nothing.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dryrun"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build binary
        run: scripts/build-binary.sh "dist/supermux-linux-${{ matrix.arch }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.commit }}"
      - name: Smoke test
        run: scripts/smoke-binary.sh "dist/supermux-linux-${{ matrix.arch }}" 18791 "${{ steps.ver.outputs.version }}"
      - name: Checksum
        run: cd dist && sha256sum "supermux-linux-${{ matrix.arch }}" > "supermux-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/supermux
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [build-binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            && gh release upload "${GITHUB_REF_NAME}" --clobber \
                 dist/supermux-linux-x64 dist/supermux-linux-x64.sha256 \
                 dist/supermux-linux-arm64 dist/supermux-linux-arm64.sha256 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --generate-notes \
                 dist/supermux-linux-x64 dist/supermux-linux-x64.sha256 \
                 dist/supermux-linux-arm64 dist/supermux-linux-arm64.sha256

  publish-website:
    if: github.ref_type == 'tag'
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check website token
        id: tok
        env:
          TOKEN: ${{ secrets.WEBSITE_PUSH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "have=1" >> "$GITHUB_OUTPUT"; else
            echo "::warning::WEBSITE_PUSH_TOKEN secret not set — skipping versions.json publish to supermux.dev"
            echo "have=0" >> "$GITHUB_OUTPUT"; fi
      - name: Publish versions.json + pinned compose to supermux-website
        if: steps.tok.outputs.have == '1'
        env:
          TOKEN: ${{ secrets.WEBSITE_PUSH_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          SHA_X64=$(cut -d' ' -f1 dist/supermux-linux-x64.sha256)
          SHA_ARM64=$(cut -d' ' -f1 dist/supermux-linux-arm64.sha256)
          git clone "https://x-access-token:${TOKEN}@github.com/UstaLabs/supermux-website.git" site
          bun scripts/generate-versions-json.ts "$V" "$SHA_X64" "$SHA_ARM64" > site/versions.json
          sed "s|__SUPERMUX_TAG__|v${V}|" .github/release-assets/docker-compose.release.yml > site/docker-compose.yml
          cd site
          git config user.name "supermux-release"
          git config user.email "release@supermux.dev"
          git add versions.json docker-compose.yml
          git commit -m "release: v${V} (versions.json + pinned compose)" || echo "nothing to commit"
          git push
