# .github/workflows/release.yml
# On every v* tag: native-arch binary builds (+ smoke), multi-arch docker
# image, GitHub Release with checksums, versions.json + pinned compose pushed
# to supermux-website (skipped if the WEBSITE_PUSH_TOKEN secret is absent).
# workflow_dispatch = dry run: builds + smokes everything, publishes nothing.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios_testflight_upload:
        description: "Sign + upload the iOS app to TestFlight on this dry run (default: iOS is only compile-validated, nothing is uploaded)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-binaries:
    strategy:
      fail-fast: false   # one arch failing must not cancel the other's evidence
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          # macOS native binary (Mach-O), Apple-Silicon only (macos-14). The
          # same build-binary.sh runs unchanged and smoke-binary.sh boots the
          # real broker, so this validates macOS at RUNTIME, not just compile.
          # Intel macOS is omitted on purpose: free Intel runners are scarce and
          # would stall releases — Intel Macs can use --docker / --source.
          - runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # build-binary.sh stages the web client with Gradle (`:web:stageForBroker`
      # compiles the Kotlin/Wasm Compose app) and hard-fails without a JDK on
      # PATH, so every matrix leg — macos-14 included — needs these two.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dryrun"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── the workspace-terminal backend, which the binary now EMBEDS ──────────
      # build-binary.sh compiles the pinned zmx + its framed helper and embeds
      # them, so this lane carries a Zig toolchain and a Ghostty checkout. Both
      # are cached on the PINS (a lockfile or patch change is the only thing that
      # can invalidate a compiled upstream), exactly like the ci.yml zmx lane.
      - name: Cache the zig toolchain and the zmx build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            build/zmx
          key: zmx-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/zmx/upstream.lock.json', 'vendor/zmx/patches/*.patch') }}
          restore-keys: zmx-release-${{ runner.os }}-${{ runner.arch }}-
      # The pin and the patch BEFORE anything is compiled from them: a release
      # must never embed a zmx that is not the one this repo reviewed.
      - name: Verify the zmx pin and patch
        run: bash scripts/build-zmx.sh --check-patches

      - name: Build binary
        env:
          MUX_ZIG_JOBS: "4"
        run: scripts/build-binary.sh "dist/supermux-${{ matrix.os }}-${{ matrix.arch }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.commit }}"
      - name: Smoke test
        run: scripts/smoke-binary.sh "dist/supermux-${{ matrix.os }}-${{ matrix.arch }}" 18791 "${{ steps.ver.outputs.version }}"
      - name: Compiled asset probe
        # Proves the COMPILED binary can materialize embedded runtime-assets out
        # of $bunfs (pty-helper + prompt files + the zmx bundle) for spawned
        # children — the exact class of the env.md ENAMETOOLONG landmine, and now
        # also of the Plan 3 gap where nothing materialized zmx at all and every
        # workspace terminal failed `backend-unavailable` in a binary that
        # otherwise smoked clean. The probe re-runs the broker's own manifest
        # verification and EXECs the materialized helper. Build a tiny probe
        # binary, run it, then rm it BEFORE the checksum/upload steps so the probe
        # never ships in the release artifacts (upload grabs dist/*).
        run: |
          bun build --compile scripts/asset-probe.ts --outfile dist/asset-probe
          ./dist/asset-probe
          rm -f dist/asset-probe
      - name: Checksum
        # macOS runners ship `shasum`, not `sha256sum`; both emit the same
        # "<hash>  <file>" format the installer + versions generator parse.
        run: |
          cd dist
          asset="supermux-${{ matrix.os }}-${{ matrix.arch }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  update-flow:
    # Hermetic update→swap→rollback e2e on REAL compiled binaries: builds two
    # versions, serves a local versions.json over HTTP, runs `supermux update`
    # then `supermux rollback`, asserting the on-disk version transitions and
    # reversibility. Independent (no `needs`) so it runs in parallel with the
    # other jobs as validation; runs on tag pushes AND workflow_dispatch dry runs
    # (no `if` gate). x64 only — one arch is enough to exercise the real cycle.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # test-update-flow.sh builds two real binaries with scripts/build-binary.sh,
      # which stages the Kotlin/Wasm web client via `:web:stageForBroker` and
      # hard-fails without a JDK 17+ on PATH — so this lane needs the toolchain too.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Update-flow e2e
        run: scripts/test-update-flow.sh

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/supermux
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terminal-packages:
    # The two published KMP packages, verified the way a STRANGER consumes them, on every
    # tag and every dry run. Nothing here is published anywhere public: the only repository
    # is <module>/build/test-repository on this runner. Plan 4 Task 6 is explicit that
    # verification must not upload Maven artifacts, and no credentials exist in this job.
    #
    # WHAT THIS DOES NOT CLAIM. `verifyNativeArtifactsForHost` is the gate for the targets
    # THIS runner can build (linux-x64 + the Android ABIs + wasm32). The all-targets release
    # gate (`verifyNativeArtifacts`) needs a tree assembled from a Linux build plus Mac-built
    # macos-*/ios-* artifacts — see apps/terminal-core/VERIFICATION.md §4 — which is a
    # deliberate two-host procedure, not something one job silently approximates. What the
    # artifacts contain is therefore stated by the ABI manifest printed below, which names
    # exactly which targets are inside, and by the publish guard that refuses release
    # coordinates for an incomplete tree.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Cache the zig toolchain and the terminal native tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
          key: terminal-native-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json') }}
          restore-keys: terminal-native-${{ runner.os }}-
      - name: Build the terminal engine (desktop + the shipped Android ABIs)
        env:
          ST_ZIG_JOBS: "4"
        run: |
          python3 - <<'PY' > /tmp/abis.txt
          import re
          text = open("apps/gradle.properties").read()
          spec = re.search(r"^supermux\.terminal\.androidAbis=(.*)$", text, re.M).group(1)
          print("\n".join(e.split("=", 1)[1].strip() for e in spec.split(",")))
          PY
          sdkmanager "ndk;$(python3 -c "import json,sys; print(json.load(open('apps/terminal-core/native/upstream.lock.json'))['targets']['android-arm64']['ndk'])")"
          for target in linux-x64 $(cat /tmp/abis.txt); do
            echo "::group::native/build.sh $target"
            bash apps/terminal-core/native/build.sh "$target"
            echo "::endgroup::"
          done
      - name: Build the WASM engine with the app
        run: bash apps/terminal-core/wasm/build.sh
      - name: Verify native artifact SHA/ABI and record what is inside
        working-directory: apps
        run: |
          ./gradlew :terminal-core:verifyNativeArtifactsForHost :terminal-core:generateAbiManifest --console=plain
          manifest=terminal-core/build/gradle/generated/packageMetadata/dev/supermux/terminal/abi-manifest.json
          {
            echo '### terminal-core ABI manifest'
            echo '```json'
            cat "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish both packages to the LOCAL test repository
        working-directory: apps
        run: |
          ./gradlew :terminal-core:publishAllPublicationsToLocalTestRepository --console=plain
          ./gradlew :terminal-compose:publishAllPublicationsToLocalTestRepository --console=plain
      - name: Licences are inside the published artifacts
        run: |
          set -eu
          jar="$(find apps/terminal-core/build/test-repository -name 'terminal-core-jvm-*.jar' ! -name '*-sources.jar' | head -1)"
          aar="$(find apps/terminal-core/build/test-repository -name 'terminal-core-android-*.aar' | head -1)"
          for f in "$jar" "$aar"; do
            [ -n "$f" ] || { echo "published artifact missing" >&2; exit 1; }
            for want in META-INF/dev.supermux.terminal/LICENSE META-INF/dev.supermux.terminal/THIRD-PARTY-NOTICES.md; do
              unzip -l "$f" | grep -q "$want" || { echo "$f does not carry $want" >&2; exit 1; }
            done
          done
      - name: Independent consumer check (JVM + browser + Compose surface)
        working-directory: apps
        run: |
          command -v google-chrome >/dev/null 2>&1 || bunx playwright install --with-deps chromium
          ./gradlew -p terminal-core/consumer-smoke jvmTest --console=plain
          ./gradlew -p terminal-core/consumer-smoke wasmJsBrowserTest --console=plain
          ./gradlew -p terminal-compose/consumer-smoke jvmTest --console=plain

  build-android:
    # Signed release APK for the native Android app (apps/android). Runs on tag
    # pushes AND workflow_dispatch dry runs (builds + uploads the artifact,
    # publishes nothing) — mirroring build-binaries. The signing key and Firebase
    # config come from repo secrets; when a secret is absent the build gracefully
    # falls back to the debug key / committed placeholder google-services.json, so
    # it still assembles (but push won't work and installs can't upgrade across
    # releases). Asset name is stable: supermux-android.apk.
    #
    # Versioning is AUTOMATED on CI (no manual versionCode bump):
    #   versionName = v* tag (e.g. 0.11.26) so the in-app banner matches the release
    #   versionCode = ANDROID_VERSION_CODE_FLOOR + GITHUB_RUN_NUMBER (strictly
    #     increasing; floor keeps CI above any historical local default, currently 32)
    # Those values are written to dist/android-client.env and consumed by
    # publish-website so versions.json matches the APK that was actually built.
    runs-on: ubuntu-latest
    env:
      # Keep above any versionCode ever shipped from apps/android/build.gradle.kts
      # defaults (currently 32). Raise only if a manual/local build ever exceeds it.
      ANDROID_VERSION_CODE_FLOOR: "1000"
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Resolve Android client version
        id: ver
        working-directory: .
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-dryrun.${GITHUB_RUN_NUMBER}"
          fi
          CODE=$(( ANDROID_VERSION_CODE_FLOOR + GITHUB_RUN_NUMBER ))
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android client versionName=$NAME versionCode=$CODE"
      - name: Firebase config
        env:
          GS: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" | base64 -d > android/google-services.json
            echo "Using real google-services.json from secret"
          else
            cp android/google-services.json.example android/google-services.json
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON not set — using placeholder Firebase config; push notifications will not work in this APK"
          fi
      - name: Signing config
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > android/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/keystore.properties
            echo "Release signing configured (keystore.properties written)"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — release APK will be debug-signed and NOT upgradable across releases"
          fi

      # ── The terminal engine's Android JNI libraries ──────────────────────────
      # `:terminal-core` now FAILS the build when one is missing, rather than warning: an APK
      # packaged without them installs, runs, and has a terminal that cannot open — AGP merges an
      # empty jniLibs directory without a word. The ABIs are the ones apps/gradle.properties
      # declares (`supermux.terminal.androidAbis`), which is the same line `abiFilters` reads.
      # Cached on the pins, exactly like the integration lane's zmx/wasm trees.
      - name: Cache the zig toolchain and the terminal native tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
          key: terminal-native-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json') }}
          restore-keys: terminal-native-${{ runner.os }}-
      - name: Install the pinned NDK
        working-directory: .
        run: |
          sdkmanager "ndk;$(python3 -c "import json,sys; print(json.load(open('apps/terminal-core/native/upstream.lock.json'))['targets']['android-arm64']['ndk'])")"
      - name: Build the terminal engine for Android
        working-directory: .
        env:
          ST_ZIG_JOBS: "4"
        run: |
          python3 - <<'PY' > /tmp/abis.txt
          import re
          text = open("apps/gradle.properties").read()
          spec = re.search(r"^supermux\.terminal\.androidAbis=(.*)$", text, re.M).group(1)
          print("\n".join(e.split("=", 1)[1].strip() for e in spec.split(",")))
          PY
          while read -r target; do
            [ -n "$target" ] || continue
            echo "::group::native/build.sh $target"
            bash apps/terminal-core/native/build.sh "$target"
            echo "::endgroup::"
          done < /tmp/abis.txt

      - name: Assemble release APK
        run: >
          ./gradlew :android:assembleRelease --console=plain --no-daemon
          -PsupermuxVersionCode=${{ steps.ver.outputs.versionCode }}
          -PsupermuxVersionName=${{ steps.ver.outputs.versionName }}
      - name: Stage APK + checksum + client version
        run: |
          mkdir -p ../dist
          cp android/build/outputs/apk/release/android-release.apk ../dist/supermux-android.apk
          {
            echo "CLIENT_ANDROID_VERSION=${{ steps.ver.outputs.versionName }}"
            echo "CLIENT_ANDROID_CODE=${{ steps.ver.outputs.versionCode }}"
          } > ../dist/android-client.env
          cd ../dist
          sha256sum supermux-android.apk > supermux-android.apk.sha256
          echo "Wrote android-client.env:"
          cat android-client.env
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-android
          path: dist/*
          if-no-files-found: error

  build-desktop-linux:
    # Linux .deb installer for the Compose Desktop client (apps/desktop), built with
    # jpackage (dpkg-deb/fakeroot are preinstalled on ubuntu-latest). Runs on tag pushes
    # AND workflow_dispatch dry runs (builds + uploads; publishes nothing) — like the
    # other build-* jobs. The app carries its OWN packageVersion (independent of the v*
    # tag), so the asset name is stable: supermux-linux.deb. Unsigned; the pinned JBR/JCEF
    # runtime is bundled so the CodeMirror editor works offline on first launch.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # stage-desktop-binaries.sh shells out to scripts/build-binary.sh, which runs
      # `:web:stageForBroker` — cache the Gradle build alongside the packaging build.
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2 # broker compile (scripts/build-binary.sh) during staging
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dryrun"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # ── native artifacts: the client engine AND the host backend ────────────
      # Two DIFFERENT native things, and a .deb needs both:
      #   * the CLIENT Ghostty JNI library, which the desktop app itself loads to draw a
      #     terminal. It rides inside the terminal-core jar, and :terminal-core only WARNS
      #     when a target's library is absent — so without this step jpackage produces an
      #     installer whose terminal cannot open, and nothing says a word. That is true
      #     whatever the host backend is: a desktop that connects to a REMOTE broker still
      #     draws with this library.
      #   * the HOST zmx bundle (staged below), which only matters when this desktop is
      #     also the host.
      - name: Cache the zig toolchain and the native build trees
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
            build/zmx
          key: desktop-native-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json', 'vendor/zmx/upstream.lock.json', 'vendor/zmx/patches/*.patch') }}
          restore-keys: desktop-native-${{ runner.os }}-
      - name: Verify the zmx pin and patch
        working-directory: .
        run: bash scripts/build-zmx.sh --check-patches
      - name: Build the client terminal engine (linux-x64)
        working-directory: .
        env:
          ST_ZIG_JOBS: "4"
        run: bash apps/terminal-core/native/build.sh linux-x64

      - name: Stage host helper binaries (broker + frpc + tmux + zmx)
        # Plan 3 Task 5 + Plan 4 Task 6: build the Bun broker, fetch frpc, and build the pinned
        # zmx bundle into apps/desktop/resources/linux-x64/ so jpackage bundles them into the
        # .deb. The script self-locates the repo root, so the `apps` working-directory default is
        # fine via the relative path. tmux has no static upstream release; supply one via
        # SUPERMUX_TMUX to bundle it, else the slot stays empty and the host falls back to a
        # system tmux on $PATH (agent sessions only — workspace terminals use the zmx bundle).
        env:
          MUX_ZIG_JOBS: "4"
        run: ../scripts/stage-desktop-binaries.sh linux-x64 "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.commit }}"
      - name: Assert the staged host backend
        working-directory: .
        run: |
          bash scripts/check-zmx-bundle.sh build/zmx/out-linux-x64 linux-x64
          for f in zmx mux-zmx-helper zmx-manifest.json; do
            [ -s "apps/desktop/resources/linux-x64/$f" ] || { echo "missing staged host helper: $f" >&2; exit 1; }
          done

      - name: Build .deb
        run: ./gradlew :desktop:packageDeb --console=plain --no-daemon
      - name: Assert the packaged client engine
        # The library has to be INSIDE the artifact a user installs, not merely on the build
        # machine. Read it back out of the jar in the jpackage image.
        working-directory: .
        run: |
          jar="$(find apps/desktop/build/compose/binaries/main/app -name 'terminal-core*.jar' | head -1)"
          [ -n "$jar" ] || { echo "no terminal-core jar in the application image" >&2; exit 1; }
          unzip -l "$jar" | grep -q 'dev/supermux/terminal/native/linux-x64/libsupermux_terminal_jni.so' \
            || { echo "packaged terminal-core jar carries NO linux-x64 JNI library: $jar" >&2; unzip -l "$jar" | head -40; exit 1; }
          unzip -l "$jar" | grep -q 'META-INF/dev.supermux.terminal/LICENSE' \
            || { echo "packaged terminal-core jar carries no licence files" >&2; exit 1; }
          echo "client engine + licences present in $jar"
      - name: Stage .deb + checksum
        run: |
          mkdir -p ../dist
          cp desktop/build/compose/binaries/main/deb/*.deb ../dist/supermux-linux.deb
          cd ../dist
          sha256sum supermux-linux.deb > supermux-linux.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-desktop-linux
          path: dist/*
          if-no-files-found: error

  build-terminal-jni-windows:
    # The Windows CLIENT terminal engine, cross-built ON LINUX.
    #
    # It cannot be built on the Windows runner: apps/terminal-core/native/upstream.lock.json pins
    # a Zig tarball per BUILD HOST and has no x86_64-windows entry, so the provisioner refuses
    # there rather than fetching an unpinned toolchain. Zig cross-compiles to x86_64-windows-gnu
    # from Linux perfectly well (this is how the committed windows-x64 tree was made), so the
    # honest arrangement is: build it where the pin exists, hand the artifact to the packaging
    # job. Same shape as the Mac-built dylibs copied into a Linux tree (VERIFICATION.md).
    #
    # NOT runtime-tested: nothing here runs a Windows binary. The manifest it emits says so
    # (`runtime_tested: false`), and so does this comment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache the zig toolchain and the terminal native tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
          key: terminal-native-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json') }}
          restore-keys: terminal-native-${{ runner.os }}-
      - name: Build the client terminal engine (windows-x64)
        env:
          ST_ZIG_JOBS: "4"
        run: bash apps/terminal-core/native/build.sh windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-native-windows-x64
          path: apps/terminal-core/build/native/windows-x64
          if-no-files-found: error

  build-desktop-windows:
    # Windows .msi installer and native host. jpackage's MSI backend needs the
    # WiX Toolset, which is preinstalled on windows-latest — jpackage CANNOT cross-build
    # MSI, so this is the only place it's produced. Same Gradle task + JDK 17 as the .deb.
    # Unsigned v1 (SmartScreen "unknown publisher" warning accepted). Stable asset name:
    # supermux-windows.msi.
    runs-on: windows-latest
    needs: build-terminal-jni-windows
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The client terminal engine, built by the Linux job above (no pinned Zig exists for a
      # Windows host). It lands exactly where :terminal-core:stageJvmNativeResources looks, so
      # the packaging below picks it up with no build-script change.
      - uses: actions/download-artifact@v4
        with:
          name: terminal-native-windows-x64
          path: apps/terminal-core/build/native/windows-x64
      # stage-desktop-binaries.sh shells out to scripts/build-binary.sh, which runs
      # `:web:stageForBroker` — cache the Gradle build alongside the packaging build.
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Bun's ConPTY/EOF behavior is a native-Windows release gate.
          bun-version: "1.3.14"
      - name: Install broker dependencies
        working-directory: .
        run: bun install
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dryrun"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test native Windows broker seams
        working-directory: .
        shell: bash
        run: >
          bun test
          tests/windows-staging.test.ts
          tests/release-workflow.test.ts
          src/core/local-endpoint.test.ts
          src/core/process/launcher.test.ts
          src/core/sessiond/protocol.test.ts
          src/core/sessiond/screen.test.ts
          src/core/sessiond/session-store.test.ts
      - name: Typecheck broker
        # Fresh installs currently have a documented TS 5.9/@types-bun baseline
        # outside the Windows work. Keep the report visible without making an
        # otherwise-valid MSI lane permanently red; focused tests/builds gate it.
        continue-on-error: true
        working-directory: .
        run: bun run typecheck
      - name: Test desktop native-host integration
        run: ./gradlew.bat :desktop:test --tests 'dev.supermux.desktop.host.*' --console=plain --no-daemon
      - name: Stage native host helpers
        # Git Bash provides sh/curl/tar; the canonical staging path compiles the
        # Windows x64 broker + sessiond and fetches the pinned frpc.exe.
        shell: bash
        run: ../scripts/stage-desktop-binaries.sh windows-x64 "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.commit }}"
      - name: Assert staged host helpers
        shell: pwsh
        run: |
          $broker = Get-Item desktop/resources/windows-x64/supermux-broker.exe
          $sessiond = Get-Item desktop/resources/windows-x64/mux-sessiond.exe
          $frpc = Get-Item desktop/resources/windows-x64/frpc.exe
          foreach ($helper in @($broker, $sessiond, $frpc)) {
            if ($helper.Length -le 0) { throw "empty host helper: $($helper.FullName)" }
          }
      - name: Build distributable image and .msi
        run: ./gradlew.bat :desktop:createDistributable :desktop:packageMsi --console=plain --no-daemon
      - name: Assert packaged host helpers
        shell: pwsh
        run: |
          $imageRoot = "desktop/build/compose/binaries/main/app"
          foreach ($name in @("supermux-broker.exe", "mux-sessiond.exe", "frpc.exe")) {
            $matches = @(Get-ChildItem $imageRoot -Recurse -File -Filter $name)
            if ($matches.Count -ne 1) {
              throw "expected one $name in application image, found $($matches.Count)"
            }
            if ($matches[0].Length -le 0) { throw "empty packaged host helper: $name" }
            Write-Host "$name $($matches[0].Length) $($matches[0].FullName)"
          }
      - name: Assert the packaged client engine
        # Windows keeps sessiond as its HOST backend and ships no zmx — but the desktop app is
        # also a CLIENT, and a client draws terminals with the Ghostty JNI library whatever the
        # host is. :terminal-core only warns when a target's library is missing, so without this
        # the MSI installs and its terminal silently cannot open.
        shell: pwsh
        run: |
          $jar = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -File -Filter 'terminal-core*.jar' | Select-Object -First 1
          if (-not $jar) { throw "no terminal-core jar in the application image" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
          } finally { $zip.Dispose() }
          foreach ($want in @(
            'dev/supermux/terminal/native/windows-x64/supermux_terminal_jni.dll',
            'META-INF/dev.supermux.terminal/LICENSE')) {
            if ($names -notcontains $want) { throw "packaged terminal-core jar is missing $want ($($jar.FullName))" }
          }
          Write-Host "client engine + licences present in $($jar.FullName)"

      - name: Stage .msi + checksum
        shell: bash
        run: |
          mkdir -p ../dist
          cp desktop/build/compose/binaries/main/msi/*.msi ../dist/supermux-windows.msi
          cd ../dist
          sha256sum supermux-windows.msi > supermux-windows.msi.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-desktop-windows
          path: dist/*
          if-no-files-found: error

  build-compose-desktop-macos:
    # THE macOS client: the Compose Multiplatform desktop app (apps/desktop / jpackage DMG),
    # the same family as the Linux .deb and Windows .msi. It ships as supermux-desktop-macos.dmg
    # ("Supermux Desktop.app", bundle id dev.supermux.desktop) — the asset name and the
    # `compose-desktop-macos` versions.json key predate the retirement of the native SwiftUI
    # Supermux.app and are kept stable so installed clients keep finding their updates.
    # Tag builds require Developer ID + notary credentials; dry runs without secrets upload an
    # explicitly unsigned DMG.
    runs-on: macos-26
    env:
      DEVELOPER_ID_APPLICATION: "Developer ID Application: AHMET HUSEYIN DOK (57L7J9XA89)"
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21 jpackage supplies --app-content, used to merge JBR's sibling JCEF
          # Frameworks/helpers into Contents/runtime before signing the app bundle.
          java-version: "21"
      # stage-desktop-binaries.sh shells out to scripts/build-binary.sh, which runs
      # `:web:stageForBroker` — cache the Gradle build alongside the packaging build.
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolve version
        id: ver
        working-directory: .
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dryrun"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # ── native artifacts: the client engine AND the host backend ────────────
      # macOS is the one target that must be built ON a Mac: zig 0.16's Mach-O linker ignores
      # -Wl,-exported_symbols_list, so a Linux-cross dylib exports all 587 internal Ghostty
      # symbols instead of the st_* surface (see terminal-core/VERIFICATION.md).
      - name: Cache the zig toolchain and the native build trees
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
            build/zmx
          key: desktop-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json', 'vendor/zmx/upstream.lock.json', 'vendor/zmx/patches/*.patch') }}
          restore-keys: desktop-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify the zmx pin and patch
        working-directory: .
        run: bash scripts/build-zmx.sh --check-patches
      - name: Build the client terminal engine (macos-arm64)
        working-directory: .
        env:
          ST_ZIG_JOBS: "4"
        run: bash apps/terminal-core/native/build.sh macos-arm64

      - name: Build portable tmux
        working-directory: .
        run: scripts/build-portable-tmux.sh "$RUNNER_TEMP/tmux"
      - name: Stage host helper binaries
        working-directory: .
        env:
          SUPERMUX_TMUX: ${{ runner.temp }}/tmux
          MUX_ZIG_JOBS: "4"
        run: scripts/stage-desktop-binaries.sh macos-arm64 "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.commit }}"
      - name: Assert the staged host backend
        working-directory: .
        run: |
          bash scripts/check-zmx-bundle.sh build/zmx/out-macos-arm64 macos-arm64
          for f in zmx mux-zmx-helper zmx-manifest.json; do
            [ -s "apps/desktop/resources/macos-arm64/$f" ] || { echo "missing staged host helper: $f" >&2; exit 1; }
          done
      - name: Check release credentials
        id: signing
        working-directory: .
        run: |
          have=1
          [ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ] || have=0
          [ -n "$MACOS_DEVELOPER_ID_P12_PASSWORD" ] || have=0
          [ -n "$APPLE_NOTARY_KEY_P8_BASE64" ] || have=0
          [ -n "$APPLE_NOTARY_KEY_ID" ] || have=0
          [ -n "$APPLE_NOTARY_ISSUER_ID" ] || have=0
          if [ "$have" = 0 ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::macOS signing/notarization secrets are required for tag releases (compose desktop)"
            exit 1
          fi
          if [ "$have" = 0 ]; then
            echo "::warning::macOS release secrets are absent; uploading an unsigned compose-desktop dry-run DMG"
          fi
          echo "have=$have" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID certificate
        if: steps.signing.outputs.have == '1'
        working-directory: .
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/supermux-compose-release.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id-compose.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Compose's signing preflight resolves the identity by common name (label),
          # not SHA-1 — opposite of raw codesign against a non-default keychain.
          security list-keychains -d user -s "$KEYCHAIN"
          echo "MACOS_COMPOSE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build signed Compose DMG
        if: steps.signing.outputs.have == '1'
        run: >
          ./gradlew :desktop:packageDmg --console=plain --no-daemon
          -PsmMacSignIdentity="${{ env.DEVELOPER_ID_APPLICATION }}"
          -PsmMacSignKeychain="${{ env.MACOS_COMPOSE_KEYCHAIN }}"
      - name: Build unsigned Compose DMG
        if: steps.signing.outputs.have != '1'
        run: ./gradlew :desktop:packageDmg --console=plain --no-daemon
      - name: Assert the packaged client engine
        # The DMG has to carry the Ghostty JNI dylib the app loads to draw a terminal, whether or
        # not this Mac is also the host. Signing does not put it there; the build above does.
        working-directory: .
        run: |
          jar="$(find apps/desktop/build/compose/binaries/main/app -name 'terminal-core*.jar' | head -1)"
          [ -n "$jar" ] || { echo "no terminal-core jar in the application image" >&2; exit 1; }
          unzip -l "$jar" | grep -q 'dev/supermux/terminal/native/macos-arm64/libsupermux_terminal_jni.dylib' \
            || { echo "packaged terminal-core jar carries NO macos-arm64 JNI library: $jar" >&2; unzip -l "$jar" | head -40; exit 1; }
          unzip -l "$jar" | grep -q 'META-INF/dev.supermux.terminal/LICENSE' \
            || { echo "packaged terminal-core jar carries no licence files" >&2; exit 1; }
          echo "client engine + licences present in $jar"

      - name: Stage DMG
        working-directory: .
        run: |
          mkdir -p dist
          SRC="$(find apps/desktop/build/compose/binaries/main/dmg -name '*.dmg' -type f | head -1)"
          test -n "$SRC" && test -f "$SRC"
          if [ "${{ steps.signing.outputs.have }}" = "1" ]; then
            DMG="dist/supermux-desktop-macos.dmg"
          else
            DMG="dist/supermux-desktop-macos-unsigned.dmg"
          fi
          cp "$SRC" "$DMG"
          echo "COMPOSE_MACOS_DMG=$DMG" >> "$GITHUB_ENV"
          echo "Staged $SRC -> $DMG ($(wc -c < "$DMG") bytes)"
      - name: Sign, notarize, and staple DMG
        if: steps.signing.outputs.have == '1'
        working-directory: .
        run: |
          # Compose signs the .app image when smMacSignIdentity is set, but not the
          # outer DMG — Gatekeeper needs a signature on the disk image itself.
          codesign --force --timestamp \
            --keychain "$MACOS_COMPOSE_KEYCHAIN" \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$COMPOSE_MACOS_DMG"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY"
          xcrun notarytool submit "$COMPOSE_MACOS_DMG" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$COMPOSE_MACOS_DMG"
          xcrun stapler validate "$COMPOSE_MACOS_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$COMPOSE_MACOS_DMG"
      - name: Checksum
        working-directory: .
        run: |
          cd dist
          shasum -a 256 "$(basename "$COMPOSE_MACOS_DMG")" > "$(basename "$COMPOSE_MACOS_DMG").sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-compose-desktop-macos
          path: dist/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always() && steps.signing.outputs.have == '1'
        working-directory: .
        run: security delete-keychain "$MACOS_COMPOSE_KEYCHAIN" || true

  build-ios-testflight:
    # Signed iOS app (with the embedded watch app + both notification extensions)
    # archived, exported as an App Store .ipa, and uploaded to TestFlight. The iOS app
    # bundles NO broker/tmux/frpc, so there's no bun/stage-desktop-binaries step here.
    #
    # Runs on tag pushes AND workflow_dispatch dry runs. Whether it uploads to TestFlight is
    # the `upload` flag computed below = signing secrets present AND (a v* tag OR a dry run
    # launched with the ios_testflight_upload input checked). What each path does:
    #   - upload=0 (plain dry run, or missing secrets) → build UNSIGNED to validate the
    #     archive compiles; export + upload are skipped (a dry run never surprises TestFlight).
    #   - upload=1 → import the Apple Distribution cert, install the four App Store provisioning
    #     profiles, archive, export the .ipa, and upload it to TestFlight via the ASC API key.
    # Absent secrets on a tag WARN (they do not fail the release) so binary/docker releases
    # keep shipping until the iOS signing material is configured.
    #
    # Uploading is only half the job — the assign-testflight job below attaches the build to the
    # tester group, without which it never shows up in anyone's TestFlight app.
    #
    # Build number: TestFlight requires CFBundleVersion to strictly increase across uploads,
    # so we override CURRENT_PROJECT_VERSION (hardcoded "52" in project.yml) with a value
    # derived from GITHUB_RUN_NUMBER plus TESTFLIGHT_BUILD_OFFSET. The offset guarantees the
    # first CI upload lands above the highest build uploaded from the old headless-Mac flow —
    # raise it if App Store Connect rejects a build as "already used / not higher".
    runs-on: macos-26
    outputs:
      upload: ${{ steps.signing.outputs.upload }}
      build: ${{ steps.ver.outputs.build }}
    env:
      TESTFLIGHT_BUILD_OFFSET: "1000"
      # Apple Distribution signing certificate (App Store), exported as a password-protected
      # .p12 and base64-encoded. This is a DIFFERENT cert from the Compose macOS job's Developer ID.
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      # The four App Store provisioning profiles (.mobileprovision), each base64-encoded.
      IOS_PP_APP_BASE64: ${{ secrets.IOS_PP_APP_BASE64 }}
      IOS_PP_WATCH_BASE64: ${{ secrets.IOS_PP_WATCH_BASE64 }}
      IOS_PP_PUSH_NSE_BASE64: ${{ secrets.IOS_PP_PUSH_NSE_BASE64 }}
      IOS_PP_NOTIF_CONTENT_BASE64: ${{ secrets.IOS_PP_NOTIF_CONTENT_BASE64 }}
      # App Store Connect API key used for the TestFlight upload. Dedicated key (App Manager
      # role) rather than the Compose macOS job's notary key, which may be notarization-scoped and would
      # 403 on an upload.
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Resolve build number
        id: ver
        run: |
          # The iOS app keeps its OWN MARKETING_VERSION (project.yml, currently "1.2"),
          # independent of the broker's v* release tag — same as the Android versionName.
          # Only the build number must be CI-unique and strictly increasing for TestFlight.
          echo "build=$(( TESTFLIGHT_BUILD_OFFSET + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"
      - name: Generate Xcode project
        working-directory: apps/iosApp
        run: xcodegen generate
      - name: Check App Store signing credentials
        id: signing
        run: |
          have=1
          for v in APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD \
                   IOS_PP_APP_BASE64 IOS_PP_WATCH_BASE64 IOS_PP_PUSH_NSE_BASE64 IOS_PP_NOTIF_CONTENT_BASE64 \
                   ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            [ -n "${!v}" ] || have=0
          done
          if [ "$have" = 0 ]; then
            echo "::warning::iOS App Store secrets are absent — building UNSIGNED (no TestFlight upload). Set them to enable the TestFlight lane."
          fi
          # Upload only when secrets exist AND this run is meant to publish: a v* tag, or a
          # workflow_dispatch where the operator ticked the ios_testflight_upload input.
          upload=0
          if [ "$have" = 1 ] && { [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ inputs.ios_testflight_upload }}" = "true" ]; }; then
            upload=1
          fi
          echo "have=$have" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      - name: Validate compile (unsigned)
        # Dry runs and secret-less tag builds stop here: a device build with signing off
        # proves the archive compiles without needing any Apple credentials.
        if: steps.signing.outputs.upload != '1'
        working-directory: apps/iosApp
        run: |
          xcodebuild \
            -scheme Supermux \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd-ios \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Import Apple Distribution certificate
        if: steps.signing.outputs.upload == '1'
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/supermux-ios-release.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/apple-distribution.p12"
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Keep the temp keychain in the search list alongside login so xcodebuild finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "IOS_RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Install provisioning profiles
        if: steps.signing.outputs.upload == '1'
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          install_pp() { printf '%s' "$1" | base64 --decode > "$PP_DIR/$(uuidgen).mobileprovision"; }
          install_pp "$IOS_PP_APP_BASE64"
          install_pp "$IOS_PP_WATCH_BASE64"
          install_pp "$IOS_PP_PUSH_NSE_BASE64"
          install_pp "$IOS_PP_NOTIF_CONTENT_BASE64"
      - name: Archive
        if: steps.signing.outputs.upload == '1'
        working-directory: apps/iosApp
        run: |
          xcodebuild \
            -scheme Supermux \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Supermux.xcarchive \
            -derivedDataPath build/dd-ios \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_RELEASE_KEYCHAIN" \
            archive
      - name: Export .ipa
        if: steps.signing.outputs.upload == '1'
        working-directory: apps/iosApp
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Supermux.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios-export \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_RELEASE_KEYCHAIN"
          mkdir -p ../../dist
          cp build/ios-export/*.ipa ../../dist/supermux-ios.ipa
      - name: Upload to TestFlight
        if: steps.signing.outputs.upload == '1'
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file dist/supermux-ios.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          rm -f "$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.upload == '1'
        with:
          name: supermux-ios
          path: dist/supermux-ios.ipa
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always() && steps.signing.outputs.upload == '1'
        run: security delete-keychain "$IOS_RELEASE_KEYCHAIN" || true

  assign-testflight:
    # `altool --upload-app` only hands the .ipa to App Store Connect. A build that belongs to no
    # beta group is NOT installable however VALID it looks — that gap silently stranded every CI
    # build between 1040 and 1061 on ASC while TestFlight kept showing the last manually attached
    # one. This job waits out PROCESSING and attaches the exact build number this run uploaded.
    # It runs on Linux (plain ASC REST, no Xcode) so the multi-minute wait costs 1x runner
    # minutes rather than macOS's 10x.
    needs: build-ios-testflight
    if: needs.build-ios-testflight.outputs.upload == '1'
    runs-on: ubuntu-latest
    env:
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      # Internal group the build is attached to; testers on it get the build with no beta review.
      TESTFLIGHT_GROUP: "Smoke Test"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Attach build to TestFlight group
        run: bun scripts/testflight-assign.ts "${{ needs.build-ios-testflight.outputs.build }}"

  release:
    if: github.ref_type == 'tag'
    # EVERY LANE THAT CAN SAY "THESE ARTIFACTS ARE WRONG" IS IN HERE. A verification job
    # that runs beside the release instead of before it verifies nothing: it goes red
    # while the assets upload anyway, and the only thing standing between a bad artifact
    # and a user is somebody noticing a tick. `terminal-packages` (the published KMP
    # packages as a stranger consumes them: native sha/ABI, the wasm built with the app,
    # licences inside the jar/AAR, all three consumer builds) and `update-flow` (the
    # update→swap→rollback e2e on the real compiled binaries this job is about to upload)
    # were both orphaned; they gate now. Neither carries an `if:`, so neither can be
    # SKIPPED into blocking a release — a skipped `needs` would take this job with it.
    #
    # `build-ios-testflight` is deliberately NOT here: it is a separate channel and it
    # warns rather than fails when the signing secrets are absent, so that binary and
    # docker releases keep shipping. Making it a prerequisite would invert that.
    needs:
      - build-binaries
      - update-flow
      - docker
      - terminal-packages
      - build-android
      - build-desktop-linux
      - build-desktop-windows
      - build-compose-desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: supermux-*
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/supermux-linux-x64
            dist/supermux-linux-x64.sha256
            dist/supermux-linux-arm64
            dist/supermux-linux-arm64.sha256
            dist/supermux-darwin-arm64
            dist/supermux-darwin-arm64.sha256
            dist/supermux-android.apk
            dist/supermux-android.apk.sha256
            dist/supermux-linux.deb
            dist/supermux-linux.deb.sha256
            dist/supermux-windows.msi
            dist/supermux-windows.msi.sha256
            dist/supermux-desktop-macos.dmg
            dist/supermux-desktop-macos.dmg.sha256
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes "${assets[@]}"
          fi

  publish-website:
    if: github.ref_type == 'tag'
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: supermux-*
          merge-multiple: true
      - name: Check website token
        id: tok
        env:
          TOKEN: ${{ secrets.WEBSITE_PUSH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "have=1" >> "$GITHUB_OUTPUT"; else
            echo "::warning::WEBSITE_PUSH_TOKEN secret not set — skipping versions.json publish to supermux.dev"
            echo "have=0" >> "$GITHUB_OUTPUT"; fi
      - name: Publish versions.json + pinned compose to supermux-website
        if: steps.tok.outputs.have == '1'
        env:
          TOKEN: ${{ secrets.WEBSITE_PUSH_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          SHA_LINUX_X64=$(cut -d' ' -f1 dist/supermux-linux-x64.sha256)
          SHA_LINUX_ARM64=$(cut -d' ' -f1 dist/supermux-linux-arm64.sha256)
          SHA_DARWIN_ARM64=$(cut -d' ' -f1 dist/supermux-darwin-arm64.sha256)
          SHA_ANDROID=$(cut -d' ' -f1 dist/supermux-android.apk.sha256)
          SHA_DESKTOP_LINUX=$(cut -d' ' -f1 dist/supermux-linux.deb.sha256 2>/dev/null || true)
          SHA_DESKTOP_WINDOWS=$(cut -d' ' -f1 dist/supermux-windows.msi.sha256 2>/dev/null || true)
          # compose-desktop-macos = the Compose Multiplatform "Supermux Desktop" DMG, the only Mac
          # client. (The key name is historical — it once sat beside a `desktop-macos` SwiftUI DMG —
          # and stays as-is because installed clients read it.)
          SHA_COMPOSE_DESKTOP_MACOS=$(cut -d' ' -f1 dist/supermux-desktop-macos.dmg.sha256 2>/dev/null || true)
          # Android: prefer the version CI baked into the APK (android-client.env from
          # build-android). Fall back to gradle defaults only if the env file is missing.
          if [ -f dist/android-client.env ]; then
            # shellcheck disable=SC1091
            . dist/android-client.env
          else
            echo "::warning::dist/android-client.env missing — falling back to apps/android/build.gradle.kts"
            CLIENT_ANDROID_VERSION=$(sed -n 's/.*defaultVersionName = "\([^"]*\)".*/\1/p' apps/android/build.gradle.kts | head -1)
            CLIENT_ANDROID_CODE=$(sed -n 's/.*defaultVersionCode = \([0-9]*\).*/\1/p' apps/android/build.gradle.kts | head -1)
          fi
          # Desktop / iOS marketing versions still live in source (independent of the v* tag).
          CLIENT_DESKTOP_VERSION=$(sed -n 's/.*packageVersion = "\([^"]*\)".*/\1/p' apps/desktop/build.gradle.kts | head -1)
          CLIENT_IOS_VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' apps/iosApp/project.yml | head -1)
          CLIENT_IOS_BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION: "\([^"]*\)".*/\1/p' apps/iosApp/project.yml | head -1)
          export CLIENT_ANDROID_VERSION CLIENT_ANDROID_CODE CLIENT_DESKTOP_VERSION CLIENT_IOS_VERSION CLIENT_IOS_BUILD
          echo "clients.android version=${CLIENT_ANDROID_VERSION} versionCode=${CLIENT_ANDROID_CODE}"
          git clone "https://x-access-token:${TOKEN}@github.com/AhmetHuseyinDOK/supermux-website.git" site
          bun scripts/generate-versions-json.ts "$V" "$SHA_LINUX_X64" "$SHA_LINUX_ARM64" "$SHA_DARWIN_ARM64" \
            "$SHA_ANDROID" "$SHA_DESKTOP_LINUX" "$SHA_DESKTOP_WINDOWS" \
            "$SHA_COMPOSE_DESKTOP_MACOS" > site/versions.json
          sed "s|__SUPERMUX_TAG__|v${V}|" .github/release-assets/docker-compose.release.yml > site/docker-compose.yml
          cd site
          git config user.name "supermux-release"
          git config user.email "release@supermux.dev"
          git add versions.json docker-compose.yml
          git commit -m "release: v${V} (versions.json + pinned compose)" || echo "nothing to commit"
          git push
