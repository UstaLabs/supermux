# Scratch, NOT for merge (#142 web-size research). Round 3: composeLean pre-opt wasm, one wasm-opt
# variant per job, at c0557d201. Runs only on pushes to this scratch branch.
name: size-probe-142
on:
  push:
    branches: [size-probe-142]
jobs:
  lean-sweep:
    strategy:
      fail-fast: false
      matrix:
        variant: [kgp, kgp+gfx, kgp+gfx+minrec, shrink-Os]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0557d2013f4250700f69086d77025e1fbeb41cc
      - run: sudo apt-get install -y brotli
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
          key: terminal-wasm-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json') }}
          restore-keys: terminal-wasm-${{ runner.os }}-
      - run: bash apps/terminal-core/wasm/build.sh
        env:
          ST_ZIG_JOBS: "4"
      - working-directory: apps
        run: ./gradlew :web:stageForBroker -Psupermux.composeLean=true --console=plain 2>&1 | tee ../stageForBroker.log
      - run: bash tools/size-probe-142/sweep.sh apps/web/build/compileSync/wasmJs/main/productionExecutable/kotlin/supermux-apps-web.wasm sweep-out "${{ matrix.variant }}"
      - if: always()
        run: mkdir -p sweep-out && cp stageForBroker.log sweep-out/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-sweep-${{ matrix.variant }}
          path: sweep-out
