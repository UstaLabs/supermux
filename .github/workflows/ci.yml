# .github/workflows/ci.yml — the gate that runs on ordinary work.
#
# release.yml only fires on v* tags, so until this file existed nothing ran on a
# push or a PR. Ten tests were failing across the repo at the time it was added,
# every one of them a test that had been correct when written and had silently
# drifted since (a renamed attachment kind, a provider card added to a screen, a
# withTimeout that broke under a virtual test clock). None were product bugs.
# That is the failure mode this workflow exists to stop: not bugs — rot.
#
# Shape:
#   push  → change-scoped. Only the lanes the diff can plausibly break, and only
#           lanes that are cheap (no emulator, no simulator, no packaging).
#   PR    → everything, unconditionally. Filters optimize the inner loop; the
#           merge gate stays complete.
#
# Two rules keep the filtering honest:
#   1. A `wire` change (the protocol seam shared by broker + Kotlin + Swift)
#      bypasses every filter. A TS-side protocol edit silently breaks the native
#      clients otherwise, which is exactly what teaches people to distrust path
#      filters.
#   2. A `shared` (KMP) change fans out to every client that consumes it.
#
# Deliberately NOT here — they belong in a PR-only / nightly workflow:
#   Android emulator, iOS simulator, packaged-app install smoke.
#
# The one exception to "no expensive lanes": the browser journey. Since the web
# client became a Kotlin/Wasm Compose app, scripts/test-broker.sh stages it with
# Gradle (~10 min cold, seconds warm), so the `ui` lane is no longer cheap — it
# carries a JDK + the Gradle cache. It stays because it is the ONLY thing that
# exercises the real web client at all, and it is gated on a `ts` OR `web` diff
# so unrelated pushes don't pay for it.
name: ci

on:
  push:
    paths-ignore: ["**.md", "docs/**", "assets/**", "LICENSE"]
  pull_request:
    branches: [main, dev]

# A push storm should leave one run standing, not six.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── which lanes does this diff need? ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.f.outputs.ts }}
      shared: ${{ steps.f.outputs.shared }}
      android: ${{ steps.f.outputs.android }}
      desktop: ${{ steps.f.outputs.desktop }}
      ios: ${{ steps.f.outputs.ios }}
      web: ${{ steps.f.outputs.web }}
      wire: ${{ steps.f.outputs.wire }}
      zmx: ${{ steps.f.outputs.zmx }}
      terminal: ${{ steps.f.outputs.terminal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ts:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'package.json'
              - 'bunfig.toml'
              - 'tsconfig.json'
            shared:
              - 'apps/shared/**'
              - 'apps/build.gradle.kts'
              - 'apps/settings.gradle.kts'
              - 'apps/gradle/**'
            android:
              - 'apps/android/**'
            # The browser client: :ui compiled to Kotlin/Wasm and staged into
            # src/channels/web/static. `apps/ui` and `apps/shared` are most of
            # what it compiles, and `apps/gradle` pins the toolchain, so any of
            # the four can change what the browser journey actually runs.
            web:
              - 'apps/web/**'
              - 'apps/ui/**'
              - 'apps/shared/**'
              - 'apps/gradle/**'
            desktop:
              - 'apps/desktop/**'
              - 'apps/ui/**'
            ios:
              - 'apps/iosApp/**'
              # The Kotlin half of the iOS app, which this lane could not see before. `apps/ios` is
              # the SupermuxKit framework module and ALL of `apps/ui` links into it — commonMain
              # most of all, not just the iOS actuals — so a change to either can break the iOS
              # build without touching a single Swift file. (`apps/shared` already reaches this
              # lane through the `wire` filter below.)
              - 'apps/ios/**'
              - 'apps/ui/**'
            # The POSIX workspace-terminal backend: the vendored zmx patch, the
            # Zig helper, the TypeScript that drives them, and the build script
            # that produces the binaries the suite refuses to run without.
            zmx:
              - 'vendor/zmx/**'
              - 'scripts/build-zmx.sh'
              - 'scripts/check-zmx-bundle.sh'
              - 'src/core/terminal/**'
              - 'tests/integration/zmx-workspace*'
              - 'apps/terminal-core/native/**'
            # The two published KMP packages: the engine, the shared Compose surface,
            # their native/wasm build inputs and the independent consumer builds.
            terminal:
              - 'apps/terminal-core/**'
              - 'apps/terminal-compose/**'
              - 'apps/gradle/**'
            # The protocol seam. Any touch here runs every lane — see rule 1.
            wire:
              - 'src/shared/**'
              - 'apps/shared/src/commonMain/kotlin/dev/supermux/proto/**'
              - '.github/workflows/ci.yml'

  # ── TypeScript: broker, channels, shim, relay, CLI ─────────────────────────
  ts:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.ts == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # --frozen-lockfile: a floating install made CI non-reproducible (a
      # different typescript resolution failing a file that compiles clean
      # locally), so bun.lock is committed at the root.
      - run: bun install --frozen-lockfile

      # --isolate gives each test file a fresh global. Without it, the
      # process-global `mock.module` in tests/spawn-opencode.test.ts leaks into
      # every file loaded after it and two unrelated tests fail. Do NOT swap this
      # for --parallel: it is ~3x faster but timing-sensitive tests flake under
      # the load, and a gate you learn to ignore is worse than no gate.
      - name: Test
        run: bun test --isolate

      # Blocking. This lane started out continue-on-error against 14 pre-existing
      # errors; those are fixed, so it gates now. Keep it that way — the errors it
      # was carrying (WebCrypto BufferSource variance, a const-tuple cast, a
      # generator element type widened across a closure) are all the kind that
      # compile fine and fail at runtime.
      - name: Typecheck
        run: bun run typecheck

  # ── zmx: the POSIX workspace-terminal backend, against real processes ──────
  # The `ts` lane runs this backend's unit tests against a fake helper. This one
  # builds the actual artifacts and runs tests/integration/zmx-workspace.test.ts,
  # which starts real zmx daemons and real shells in a private socket directory.
  #
  # MUX_ZMX_INTEGRATION=1 is the point of the lane. Without it a missing binary
  # is an unmet prerequisite and the suite skips — correct on a laptop, useless
  # here. With it, a missing artifact FAILS: a build step that silently stopped
  # producing the helper would otherwise turn this job green while testing
  # nothing at all.
  #
  # Two native builds (a patched zmx + ghostty-vt, and the wasm terminal engine
  # the assertions decode restores with) make this the slowest non-device lane
  # cold, so both zig caches are restored and the lane is path-filtered.
  zmx:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.zmx == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Keyed on the pins, not on the diff: a lockfile change is the only thing
      # that invalidates a compiled upstream.
      - name: Cache the zig toolchain and the native build trees
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            build/zmx
            apps/terminal-core/build
          key: zmx-${{ runner.os }}-${{ hashFiles('vendor/zmx/upstream.lock.json', 'apps/terminal-core/native/upstream.lock.json', 'vendor/zmx/patches/*.patch') }}
          restore-keys: zmx-${{ runner.os }}-

      # The pin and the patch, before anything is compiled from them. This is
      # the check vendor/zmx/README.md §5 said was not wired up anywhere.
      - name: Verify the zmx pin and patch
        run: bash scripts/build-zmx.sh --check-patches

      - name: Build the patched zmx and the broker helper
        run: bash scripts/build-zmx.sh
        env:
          MUX_ZIG_JOBS: "4"

      # The reference client engine the restoration assertions decode with: the
      # same supermux-terminal.wasm the browser client loads.
      - name: Build the reference terminal engine
        run: bash apps/terminal-core/wasm/build.sh

      - name: Integration suite, no skips
        run: bun test tests/integration/zmx-workspace.test.ts
        env:
          MUX_ZMX_INTEGRATION: "1"

      - name: Leave no daemons behind
        if: always()
        run: |
          # The suite cleans up after itself; this is the belt. Only sockets in
          # the private per-run directories the suite mints are touched.
          rm -rf "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"/supermux/zmx-it-* || true

  # ── The published terminal packages, consumed as a STRANGER would ──────────
  # `kotlin` compiles them as project dependencies, which is exactly the thing that
  # cannot catch a packaging bug: a project dependency has the native library on the
  # filesystem next to it whether or not the PUBLICATION carries one. Plan 1 shipped
  # the separate consumer builds for this reason and nothing ran them automatically.
  #
  # What this lane proves, in order:
  #   1. every native artifact THIS host can build matches its own manifest (sha256 +
  #      ABI), and the wasm module does too — the gate that stands between a stale
  #      build/native tree and a published jar;
  #   2. the packages publish to a LOCAL repository (never a public one: no
  #      credentials exist here and none are wanted — Plan 4 Task 6 says verification
  #      must not publish);
  #   3. a build that shares no project, source or classpath with supermux resolves
  #      them by coordinates and RUNS the engine — on the JVM out of the jar, and in
  #      a real browser out of the klib;
  #   4. the artifacts carry their licences.
  terminal-packages:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.terminal == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Only for the browser fallback below (bunx playwright), never for the packages
      # themselves — these two modules depend on nothing in the bun workspace.
      - uses: oven-sh/setup-bun@v2
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Cache the zig toolchain and the terminal native tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
          key: terminal-native-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json') }}
          restore-keys: terminal-native-${{ runner.os }}-

      # The engine, for every target this runner can produce. The Android ABIs come
      # from apps/gradle.properties — the same one line :android's abiFilters reads —
      # so the AAR claims an ABI if and only if the engine for it is inside.
      - name: Build the terminal engine
        env:
          ST_ZIG_JOBS: "4"
        run: |
          python3 - <<'PY' > /tmp/abis.txt
          import re
          text = open("apps/gradle.properties").read()
          spec = re.search(r"^supermux\.terminal\.androidAbis=(.*)$", text, re.M).group(1)
          print("\n".join(e.split("=", 1)[1].strip() for e in spec.split(",")))
          PY
          sdkmanager "ndk;$(python3 -c "import json,sys; print(json.load(open('apps/terminal-core/native/upstream.lock.json'))['targets']['android-arm64']['ndk'])")"
          for target in linux-x64 $(cat /tmp/abis.txt); do
            echo "::group::native/build.sh $target"
            bash apps/terminal-core/native/build.sh "$target"
            echo "::endgroup::"
          done
      # The browser engine, built WITH the app rather than assumed present: the wasm
      # consumer check decodes with the very module the web client loads.
      - name: Build the reference terminal engine (wasm)
        run: bash apps/terminal-core/wasm/build.sh

      # sha256 + ABI of every artifact, against the manifest each build wrote.
      - name: Verify native artifact SHA/ABI
        working-directory: apps
        run: ./gradlew :terminal-core:verifyNativeArtifactsForHost --console=plain

      # LOCAL repositories only. `publishAllPublicationsToLocalTestRepository` writes to
      # <module>/build/test-repository and has no network target at all.
      - name: Publish both packages to the local test repository
        working-directory: apps
        run: |
          ./gradlew :terminal-core:publishAllPublicationsToLocalTestRepository --console=plain
          ./gradlew :terminal-compose:publishAllPublicationsToLocalTestRepository --console=plain

      - name: Licences are inside the published artifacts
        run: |
          set -eu
          jar="$(find apps/terminal-core/build/test-repository -name 'terminal-core-jvm-*.jar' ! -name '*-sources.jar' | head -1)"
          aar="$(find apps/terminal-core/build/test-repository -name 'terminal-core-android-*.aar' | head -1)"
          for f in "$jar" "$aar"; do
            [ -n "$f" ] || { echo "published artifact missing" >&2; exit 1; }
            for want in META-INF/dev.supermux.terminal/LICENSE META-INF/dev.supermux.terminal/THIRD-PARTY-NOTICES.md; do
              unzip -l "$f" | grep -q "$want" || { echo "$f does not carry $want" >&2; exit 1; }
            done
            echo "licences present in $f"
          done

      # A stranger's build: its own settings.gradle.kts, no project dependency, and
      # `dev.supermux.terminal` served ONLY by the local repository.
      - name: Consumer check — JVM (engine runs out of the published jar)
        working-directory: apps
        run: ./gradlew -p terminal-core/consumer-smoke jvmTest --console=plain
      - name: Ensure a WasmGC browser is available
        run: |
          command -v google-chrome >/dev/null 2>&1 || bunx playwright install --with-deps chromium
      - name: Consumer check — browser (engine runs out of the published klib)
        working-directory: apps
        run: ./gradlew -p terminal-core/consumer-smoke wasmJsBrowserTest --console=plain
      - name: Consumer check — the Compose surface, with the engine transitively
        working-directory: apps
        run: ./gradlew -p terminal-compose/consumer-smoke jvmTest --console=plain

      - name: Upload consumer reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-consumer-reports
          path: |
            apps/terminal-core/consumer-smoke/build/reports/**
            apps/terminal-compose/consumer-smoke/build/reports/**
          retention-days: 7

  # ── Browser journey: real browser + broker + shim, all on throwaway state ──
  # NOT a cheap lane: `bun run test:ui` → scripts/test-broker.sh → Gradle
  # `:web:stageForBroker`, which compiles the Kotlin/Wasm Compose client. That is
  # ~10 min cold and seconds warm, so the JDK + Gradle cache below are
  # load-bearing, and the `if` gates it on a web OR ts diff.
  ui:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.ts == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure a Playwright browser is available
        run: command -v google-chrome >/dev/null 2>&1 || bunx playwright install --with-deps chromium
      - name: Core browser journey
        run: bun run test:ui
        env:
          MUX_TEST_KEEP_FIXTURE: "1"
      - name: Upload fixture logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-fixture-logs
          path: /tmp/supermux-test-broker.*/**/*.log
          retention-days: 7

  # ── Kotlin, host-side only: no emulator, no display server ─────────────────
  # apps/desktop already declares compose.desktop.uiTestJUnit4, so this lane runs
  # real Compose UI assertions (TestTag, node counts, assertDoesNotExist)
  # in-process on the JVM. UI coverage does not require a device.
  kotlin:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caching is load-bearing, not an optimization: a cold run of these tasks
      # measured 4m23s locally, which is too slow for a push lane.
      - uses: gradle/actions/setup-gradle@v4
      # compileSdk 37 (forced by Compose Multiplatform 1.12's androidx AAR metadata). android-37.0
      # is only published on the sdkmanager BETA channel today, hence --channel=1.
      - uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails on current runners: the
          # sdkmanager it installs has no `tools` package any more.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;36.0.0"

      # Skiko (Compose Desktop's renderer) needs an X display even for the
      # "headless" in-process UI tests — without one, SessionDetailTest dies with
      # IllegalStateException at InteropContainer.skiko.kt. Passes on a developer
      # machine, fails on a bare runner.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # :shared and :desktop always run together — :desktop depends on :shared,
      # so splitting them buys nothing and pays the Gradle startup cost twice.
      # BLOCKING since cluster G8: the screens are in :ui (0 duplicate basenames / 0 conceptual
      # twins), so a new split screen is a build failure rather than a warning nobody reads.
      - name: KMP sharing guardrail
        run: bash scripts/check-no-duplicate-kt.sh

      # Cluster H6 made Compose the only iOS shell, and the native macOS SwiftUI app that kept the
      # old screens alive was retired after it. Nothing in Xcode stops a SwiftUI screen being
      # re-added under the iOS target's source directory and silently compiled into the phone app
      # again — this does.
      - name: iOS shell cutover guardrail
        run: bash scripts/check-ios-shell-cutover.sh

      - name: Shared + desktop (JVM, incl. Compose Desktop UI tests)
        working-directory: apps
        run: xvfb-run -a ./gradlew :shared:jvmTest :ui:jvmTest :desktop:test --build-cache --console=plain

      # apps/android/google-services.json is gitignored (the real one carries the
      # app's API key), and without it :android:processDebugGoogleServices fails
      # before a single test runs. The committed .example is a valid stand-in for
      # unit tests, which never reach Firebase.
      - name: Stage Firebase config for unit tests
        run: cp apps/android/google-services.json.example apps/android/google-services.json

      - name: Android unit tests (host-side)
        working-directory: apps
        run: ./gradlew :android:testDebugUnitTest --build-cache --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            apps/*/build/reports/tests/**
            apps/*/build/test-results/**
          retention-days: 7

  # ── Android device journey: the app driven on a real emulator ───────────────
  # PR only. An emulator boot plus an APK build is 8–12 minutes: a reasonable
  # merge gate, far too slow for the push loop. The host-side Android unit tests
  # in `kotlin` already cover pushes.
  #
  # This is the lane that proves what no host-side test can — that pairing works,
  # that the WebSocket reaches a real broker, and that the reply renders. It runs
  # the same journey the browser lane runs, against the same hermetic fixture.
  #
  # Verified locally end to end (5m28s) before being wired in. Every earlier
  # failure traced to emulator health, not the flow, so the emulator options
  # below are load-bearing rather than cargo-culted.
  android-journey:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # compileSdk 37 (forced by Compose Multiplatform 1.12's androidx AAR metadata). android-37.0
      # is only published on the sdkmanager BETA channel today, hence --channel=1.
      - uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails on current runners: the
          # sdkmanager it installs has no `tools` package any more.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;36.0.0"
      - run: bun install --frozen-lockfile

      # The runner user is not in the kvm group by default. Without hardware
      # acceleration the AVD falls back to software rendering, and a software
      # emulator is exactly what made every local run ANR on system UI.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Stage Firebase config
        run: cp apps/android/google-services.json.example apps/android/google-services.json

      # ── The terminal engine's Android JNI libraries ──────────────────────────
      # `:terminal-core` now FAILS the build when one is missing, rather than warning: an APK
      # packaged without them installs, runs, and has a terminal that cannot open — AGP merges an
      # empty jniLibs directory without a word. The ABIs are the ones apps/gradle.properties
      # declares (`supermux.terminal.androidAbis`), which is the same line `abiFilters` reads.
      # Cached on the pins, exactly like the integration lane's zmx/wasm trees.
      - name: Cache the zig toolchain and the terminal native tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            apps/terminal-core/build
          key: terminal-native-${{ runner.os }}-${{ hashFiles('apps/terminal-core/native/upstream.lock.json') }}
          restore-keys: terminal-native-${{ runner.os }}-
      - name: Install the pinned NDK
        run: |
          sdkmanager "ndk;$(python3 -c "import json,sys; print(json.load(open('apps/terminal-core/native/upstream.lock.json'))['targets']['android-arm64']['ndk'])")"
      - name: Build the terminal engine for Android
        env:
          ST_ZIG_JOBS: "4"
        run: |
          python3 - <<'PY' > /tmp/abis.txt
          import re
          text = open("apps/gradle.properties").read()
          spec = re.search(r"^supermux\.terminal\.androidAbis=(.*)$", text, re.M).group(1)
          print("\n".join(e.split("=", 1)[1].strip() for e in spec.split(",")))
          PY
          while read -r target; do
            [ -n "$target" ] || continue
            echo "::group::native/build.sh $target"
            bash apps/terminal-core/native/build.sh "$target"
            echo "::endgroup::"
          done < /tmp/abis.txt

      - name: Build debug APK
        working-directory: apps
        run: ./gradlew :android:assembleDebug --build-cache --console=plain

      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # A fresh runner emulator has no prior install, so the reinstall path
          # this opts into never actually triggers there.
          script: MUX_TEST_FORCE_REINSTALL=1 scripts/test-android.sh

      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: |
            ~/.maestro/tests/**
            /tmp/maestro-failure/**
            /tmp/supermux-test-broker.*/**/*.log
          retention-days: 7

  # ── iOS: unit tests on a simulator ──────────────────────────────────────────
  # PR only and path-filtered. macOS runners are free on a public repo but the
  # scarce resource is capacity, not money: this job builds the Kotlin
  # Shared.framework for iOS before Xcode can compile anything, so it is the most
  # expensive lane by a distance.
  #
  # iOS had 29 XCTest files and NOTHING ran them — release.yml only compile-checks
  # the app, and a compile check cannot tell you a parser broke. This runs them.
  #
  # Not here yet: the Maestro journey on a simulator. The flow is already written
  # against shared test ids so it will point at a simulator unchanged, and a
  # simulator can reach the fixture on 127.0.0.1 directly (no 10.0.2.2 hop). It
  # goes in once this lane is proven, rather than debugging both at once on the
  # slowest runner we have.
  ios-tests:
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.ios == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.wire == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/iosApp
        run: xcodegen generate

      # The Supermux scheme's test action runs SupermuxTests. Signing is off: a
      # simulator build needs no identity, and requiring one would make this lane
      # depend on secrets a fork does not have.
      - name: Run SupermuxTests on a simulator
        working-directory: apps/iosApp
        run: |
          set -o pipefail
          # No `-sdk`: it would force the EMBEDDED watchOS app and the two extensions onto the
          # iOS simulator SDK, and the watch app then compiles its watch-only AppIcon for iPhone
          # ("did not have any applicable content") and fails the build.
          #
          # Ad-hoc signing (`CODE_SIGN_IDENTITY=-`) rather than CODE_SIGNING_ALLOWED=NO: the app
          # declares an App Group, and an unsigned build has no entitlements, so it CRASHES at
          # launch when the container URL comes back nil. Ad-hoc keeps the entitlement without
          # needing an identity a fork does not have.
          #
          # No -skipPackagePluginValidation / -skipMacroValidation: those existed for SwiftTerm's
          # build-tool plugin, and the app has no SwiftPM dependencies left (Plan 4 replaced the
          # Swift-vended terminal with the shared Compose renderer).
          xcodebuild \
            -scheme Supermux \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath build/dd-ios-test \
            -resultBundlePath build/ios-tests.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            test

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: apps/iosApp/build/ios-tests.xcresult
          retention-days: 7
