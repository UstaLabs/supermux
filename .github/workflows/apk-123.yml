# Scratch: two TEST-ONLY debug APKs for #123's Fold cold-start before/after the i18n catalog.
# applicationId gets the suffix .i18nprobe so they install beside the real app. Never merge.
name: apk-123
on:
  push:
    branches: [apk-123]
jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i18nprobe-warm-before-67e8399de, sha: 67e8399dea500cba957b286394f2344d7d67e8f8 }
          - { name: i18nprobe-warm-after-0cc0188a0, sha: 0cc0188a07e60406ade9077f8ed9049a3e7634cf }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - run: git log -1 --format='%H %s'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;36.0.0"
      - run: bun install --frozen-lockfile
      - run: cp apps/android/google-services.json.example apps/android/google-services.json
      - name: Suffix the debug applicationId with .i18nprobe
        run: |
          python3 - <<'PY2'
          import json, re
          g = "apps/android/build.gradle.kts"
          s = open(g).read()
          s2 = s.replace('getByName("debug") {', 'getByName("debug") {\n            applicationIdSuffix = ".i18nprobe"', 1)
          assert s2 != s, "debug block not found"
          open(g, "w").write(s2)
          j = "apps/android/google-services.json"
          d = json.load(open(j))
          c = json.loads(json.dumps(d["client"][0]))
          c["client_info"]["android_client_info"]["package_name"] = "dev.supermux.android.i18nprobe"
          d["client"].append(c)
          json.dump(d, open(j, "w"), indent=2)
          PY2
          git diff --stat
      - run: sdkmanager "ndk;$(python3 -c "import json; print(json.load(open('apps/terminal-core/native/upstream.lock.json'))['targets']['android-arm64']['ndk'])")"
      - name: Build the terminal engine for Android
        env:
          ST_ZIG_JOBS: "4"
        run: |
          python3 - <<'PY' > /tmp/abis.txt
          import re
          text = open("apps/gradle.properties").read()
          spec = re.search(r"^supermux\.terminal\.androidAbis=(.*)$", text, re.M).group(1)
          print("\n".join(e.split("=", 1)[1].strip() for e in spec.split(",")))
          PY
          while read -r target; do
            [ -n "$target" ] || continue
            bash apps/terminal-core/native/build.sh "$target"
          done < /tmp/abis.txt
      - working-directory: apps
        run: ./gradlew :android:assembleDebug --console=plain -Peditor.allowMissingAndroidNative=true
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: apps/android/build/outputs/apk/debug/*.apk
