# .github/workflows/editor-syntax-natives.yml
# The native editor's grammars (apps/editor-syntax, M5): ONE Mac build of every target, handed
# to every release job that packages an app. editor-syntax/native/build.sh is Mac-only by design
# (the README's pipeline: Xcode clang for the ASan/UBSan differential tests of every grammar, the
# Apple and Android targets, zig cross builds for Linux, Windows and wasm32), so the honest
# arrangement is the same as the Windows terminal engine's: build where the toolchain is pinned,
# pass the artifact on. The artifact holds build/natives (every library + manifest.json) and
# build/gen/<lang>/<lang>.sesz (the code-only grammars' tables, which :editor-syntax:stageTables
# checks against that manifest).
#
# The Linux and Windows libraries are cross-compiled here and LOAD-TESTED on their own OS by
# release.yml's build-desktop-linux / build-desktop-windows (:editor-syntax:jvmResourceLoadTest).
#
# WHY THIS IS ITS OWN WORKFLOW. A cold build is ~35 minutes, and every packaging job in a release
# waits on it — it was the head of the release's critical path. Its output is a pure function of
# the pinned inputs hashed into the output cache key below, and those change every few weeks, not
# every release. But a cache saved by a TAG run is scoped to that tag: the next tag can never read
# it. Only a cache saved on the DEFAULT branch is visible to every tag. So this workflow also runs
# on main — when its inputs change (to build and save), and weekly (a ~1 minute cache hit that
# keeps the entry from GitHub's 7-day eviction) — and a release then restores in about a minute.
#
# A hit skips the build and its sanitizer/difftest gates: they passed for these exact inputs on
# the run that saved the entry, and a cache entry is only ever saved by a run that passed them.
name: editor-syntax-natives

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/editor-syntax/native/**"
      - "apps/editor-syntax/tools/**"
      - "apps/terminal-core/native/upstream.lock.json"
      - ".github/workflows/editor-syntax-natives.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/editor-syntax
    steps:
      - uses: actions/checkout@v4
      # Everything build.sh reads: the grammar + upstream pins, the bridge sources and headers,
      # the build/fetch/wasm scripts, the table tools, the zig pin it shares with the terminal
      # engine, and this recipe.
      - name: Restore the built natives
        id: out
        uses: actions/cache@v4
        with:
          path: |
            apps/editor-syntax/build/natives
            apps/editor-syntax/build/gen/*/*.sesz
          key: editor-syntax-natives-v1-${{ hashFiles('apps/editor-syntax/native/**', 'apps/editor-syntax/tools/**', 'apps/terminal-core/native/upstream.lock.json', '.github/workflows/editor-syntax-natives.yml') }}
      - uses: actions/setup-java@v4
        if: steps.out.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: steps.out.outputs.cache-hit != 'true'
        with:
          packages: platform-tools
      - name: Install the pinned zig and NDK
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          # zig from ziglang.org, sha256-checked against the terminal engine's host pins (the same
          # 0.16.0 editor-syntax requires), never whatever brew has today.
          read -r url sha < <(python3 - <<'PY'
          import json
          lock = json.load(open("../terminal-core/native/upstream.lock.json"))["zig"]
          want = json.load(open("native/upstream.lock.json"))["zig"]["version"]
          assert lock["version"] == want, f"terminal-core pins zig {lock['version']}, editor-syntax needs {want}"
          h = lock["hosts"]["aarch64-macos"]
          print(h["url"], h["sha256"])
          PY
          )
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "$sha  /tmp/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig"
          echo "$(ls -d "$HOME"/.local/zig/zig-aarch64-macos-*)" >> "$GITHUB_PATH"
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      # Shared with ci.yml's ios-tests lane (same key, same paths). Skipped on an output hit: its
      # post-job save would otherwise store the sesz-only build/gen the output cache restored.
      - name: Cache the grammar sources and generated tables
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/editor-syntax/build/src
            apps/editor-syntax/build/gen
          key: editor-syntax-${{ hashFiles('apps/editor-syntax/native/*.lock.json', 'apps/editor-syntax/tools/**', 'apps/editor-syntax/native/src/**') }}
      - name: Fetch, generate and build every target
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          bash native/fetch.sh
          bash native/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: editor-syntax-natives
          path: |
            apps/editor-syntax/build/natives
            apps/editor-syntax/build/gen/*/*.sesz
          if-no-files-found: error
