<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>{{PRODUCT_NAME}}</title>
</head>
<body>
  <script>
    (function(){var m=localStorage.getItem('color-mode');if(m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})()
  </script>
  <div id="app">
    <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#0b0b0b">
      <div style="width:28px;height:28px;border:3px solid #333;border-top-color:#888;border-radius:50%;animation:spin .7s linear infinite"></div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
