[versions]
# 2.4.10, NOT 2.4.20: SKIE 0.10.14 (the newest release) refuses to configure against 2.4.20
# ("SKIE 0.10.14 does not support Kotlin 2.4.20"), and disabling SKIE would strip the Swift-friendly
# API :ios ships. 2.4.10 is the newest Kotlin SKIE accepts and it configures fine against AGP 9.3.1
# / Gradle 9.7.0. Raise together with `skie` once SKIE ships 2.4.20 support.
kotlin = "2.4.10"
coroutines = "1.9.0"
serialization = "1.7.3"
ktor = "3.5.0"
androidSecurity = "1.1.0-alpha06"
# AGP 9.x is forced by Compose Multiplatform 1.12's androidx artifacts (minAgpVersion 9.1.0).
# AGP 9.3.x needs Gradle >= 9.5.0 (wrapper is 9.7.0); JDK 17 is still fine.
agp = "9.3.1"
androidMinSdk = "26"
# compileSdk 37 is forced by Compose Multiplatform 1.12's androidx artifacts (their AAR metadata
# sets minCompileSdk=37 / minAndroidGradlePluginVersion=9.1.0). targetSdk deliberately stays at 36:
# compiling against newer APIs is safe, opting into 37's behaviour changes is a separate decision.
androidCompileSdk = "37"
androidTargetSdk = "36"
# 2026.09.00, not 2026.06.00: the older BOM pins androidx.compose 1.11.3, which clashes with the
# 1.12.x artifacts Compose Multiplatform 1.12.0 resolves for the Android target.
composeBom = "2026.09.00"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
coreSplashscreen = "1.0.1"
skie = "0.10.14"
zxingEmbedded = "4.3.0"
zxingCore = "3.4.1"
datastore = "1.1.1"
firebaseBom = "33.7.0"
# 4.5.0, not 4.4.2: the older plugin uses the variant API AGP 9 removed.
googleServices = "4.5.0"
# 1.12.0: sized #cmp_a11y_root (the 0x0 accessibility-root bug), web input fixes, font fallback.
composeMultiplatform = "1.12.0"
# Compose Hot Reload. 1.2.x requires Compose Multiplatform 1.10.0+ and Kotlin 2.1.20+ (we're on
# 1.12.0 / 2.4.10), and a JetBrains Runtime whose target is Java 21 or earlier (:desktop is 17).
composeHotReload = "1.2.0"
# Navigation 3 (Compose Multiplatform / JetBrains fork). Stable 1.1.1 works on desktop JVM.
# Desktop pilot: full-pane workspace overlays (Settings / Usage / Archived / AppUpdate).
navigation3 = "1.1.1"
# androidx navigation-event, the dispatcher Compose Multiplatform's BackHandler listens on. Only
# :ui's jvmTest names it (to fire a real back gesture at a shared screen); production pulls the
# same artifact transitively through ui-backhandler.
navigationEvent = "1.1.0"  # CMP 1.12.0's ui module requires navigationevent-compose 1.1.0.
# JBR API facade (Maven Central, Apache-2.0). Compiles against any JDK; at run time
# JBR.getWindowDecorations() returns the real service under the pinned JetBrains Runtime used by
# :desktop:run, :desktop:hotRun, and packaged apps; it remains a safe null facade in stock-JDK tests.
jbrApi = "1.10.1"
# Direct JetBrains JCEF API matched to the pinned JBR 21 / Chromium 137 runtime bundled by
# :desktop's native-distribution tasks. Keep this coordinate and the JBR pin in
# desktop/build.gradle.kts in lockstep: JCEF's Java/native ABI is a compatibility unit.
jcef = "137.0.17-gf354b0e-chromium-137.0.7151.104-api-1.20-253-b13"
markdown = "0.7.6"
kotlinxBrowser = "0.5.0"
# 3.5.0: its Kotlin/Native klibs are abi_version 2.4.0, which the 2.3.21 compiler refused; the
# Kotlin 2.4.10 toolchain reads them, so the 3.4.0 ABI pin is lifted.
coil = "3.5.0"
# Compose Media Player — inline video in the desktop chat stream. MIT (vlcj, the obvious
# alternative, is GPLv3 and would relicense the app). Per-platform native backends compiled into
# the jar: AVPlayer on macOS, Media Foundation on Windows, GStreamer on Linux — no system install.
# Frames are painted into a Compose Canvas, NOT a heavyweight AWT child, so it composes inside the
# message list (see ModalPresence.kt for why that matters).
# 0.11.4: built with Kotlin 2.4.x, which the 2.3.21 compiler rejected — the 0.10.0 pin is lifted
# along with the Kotlin bump.
composeMediaPlayer = "0.11.4"
atomicfu = "0.29.0"

[libraries]
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# JVM-only test deps: a tiny local WS server to replay RFB fixtures at VncClient.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidSecurity" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-animation = { module = "androidx.compose.animation:animation" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
# Pure-Java QR encoder/decoder (no Android, no network) for the desktop first-run host wizard's
# pairing QR (Plan 3 Task 3). Distinct from zxing-android-embedded above, which is Android-only.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbrApi" }
jcef = { module = "org.jetbrains.intellij.deps.jcef:jcef", version.ref = "jcef" }
# GFM markdown parser (multiplatform). Used by the Android + desktop chat renderers; iOS uses its
# own native MarkdownView, so Kotlin/Native dead-code-strips this from the Apple framework.
markdown = { module = "org.jetbrains:markdown", version.ref = "markdown" }
# Kotlin/Wasm dropped kotlinx.browser + org.w3c + org.khronos.webgl from the stdlib; this is where they live now.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
# Async image loading for inline markdown images (Android). ktor3 backend matches our ktor client.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
compose-media-player = { module = "io.github.kdroidfilter:composemediaplayer", version.ref = "composeMediaPlayer" }
# JetBrains multiplatform Navigation 3 UI (pulls navigation3-runtime transitively).
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
jetbrains-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationEvent" }

[plugins]
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
