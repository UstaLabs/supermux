kotlin.code.style=official
# Modest heap: this build compiles a handful of test files on a shared, loaded host.
org.gradle.jvmargs=-Xmx1536m
kotlin.daemon.jvmargs=-Xmx1536m
# Configure the Apple targets on this Linux host too (their tasks are disabled here and run on a
# Mac) — exactly what a real KMP consumer does.
kotlin.native.ignoreDisabledTargets=true
