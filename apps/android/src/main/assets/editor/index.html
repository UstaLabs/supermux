<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #282c34; overflow: hidden; }
    /* position:fixed + inset:0 sizes to the viewport regardless of body height —
       avoids the WebView height:100%/100vh -> 0 collapse. */
    #editor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    .cm-editor { height: 100%; }
    .cm-scroller { -webkit-overflow-scrolling: touch; }
    .cm-diff-expand { position: absolute; z-index: 20; left: 50%; transform: translateX(-50%);
      border: 1px solid #4b5263; border-radius: 6px; padding: 3px 9px; color: #abb2bf;
      background: rgba(40,44,52,.94); font: 600 11px/1.2 system-ui,sans-serif; cursor: pointer; }
    .cm-diff-expand-up { top: 4px; }
    .cm-diff-expand-down { bottom: 4px; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="cm6.js"></script>
</body>
</html>
