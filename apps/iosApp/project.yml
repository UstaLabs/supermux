# XcodeGen project for the supermux iOS client.
#   xcodegen generate  (the .xcodeproj is gitignored)
# Kotlin frameworks: each app target's pre-build phase runs
# `./gradlew --no-daemon :<module>:embedAndSignAppleFrameworkForXcode` (apps/ is the gradle root),
# which builds the framework into <module>/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME) and
# embeds+signs it into the .app's Frameworks/ (JetBrains direct-integration flow).
#
# The iOS app builds `:ios` → SupermuxKit.framework, which re-exports :ui and :shared and is the
# ONE Kotlin framework it links. The watch app still builds `:shared` → Shared.
name: Supermux
options:
  bundleIdPrefix: dev.supermux
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "57L7J9XA89"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "88"
    # Gradle pre-build phase needs filesystem access outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  # App Store distribution signing is Release-only so Debug/simulator builds stay automatic.
  # Manual + identity at project level; the profile is set only on the app target below.
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      # SDK-qualified key is required — it overrides Xcode's built-in
      # CODE_SIGN_IDENTITY[sdk=iphoneos*]=iPhone Developer default, which otherwise wins.
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"

# No `packages:` block: the app has NO SwiftPM dependencies. SwiftTerm was the only one, and
# Plan 4 replaced the Swift-vended terminal with the shared Compose renderer (`:terminal-compose`
# + `:terminal-core`), which arrives inside SupermuxKit.framework like the rest of the shell.

targets:
  Supermux:
    type: application
    platform: iOS
    sources:
      # This directory holds ONLY what the Compose shell still needs from Swift: the app
      # delegate + bridge, push, speech/audio, the QR scanner, the pairing env seed and the
      # watch provisioner. The SwiftUI shell it used to hold is gone (Compose is the only shell
      # on every platform; the native macOS app was retired), and so is the Swift terminal host —
      # the terminal is the shared Compose renderer now.
      - path: Supermux
        excludes:
          - "EditorWeb/**"
      # Bundled CodeMirror 6 editor assets (index.html + cm6.js) as a folder
      # reference so the directory structure is preserved in the .app bundle
      # (Bundle.main … subdirectory: "EditorWeb"). Loaded by the WKWebView editor.
      - path: Supermux/EditorWeb
        type: folder
        buildPhase: resources
      # Shared with the watch app: relay wire-format + transport logic, compiled into the
      # iOS app so BrokerRelay (phone side) and SupermuxTests can use them.
      - path: SupermuxWatch/Watch/RelayEnvelope.swift
      - path: SupermuxWatch/Watch/BrokerTransport.swift
      - path: SupermuxWatch/Watch/WatchSessionStatus.swift
    dependencies:
      # Bundle the watch app inside the iOS app for paired install / TestFlight.
      - target: SupermuxWatch
        embed: true
      # Notification Service Extension (decrypts sealed pushes on-device). Embedded
      # in the app bundle under PlugIns/.
      - target: SupermuxPushNSE
        embed: true
      # Notification Content Extension: the custom expanded (long-press) view. iOS-only.
      - target: SupermuxNotifContent
        embed: true
    info:
      path: Supermux/Info.plist
      properties:
        CFBundleDisplayName: supermux
        # Track the build-number/version settings so OTA installs actually supersede each other
        # (XcodeGen's default Info.plist otherwise hardcodes CFBundleVersion=1).
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: dev.supermux.connect
            CFBundleURLSchemes:
              - supermux
        UILaunchScreen: {}
        # iPad: panes can move to windows of their own (a second WindowGroup, see IosWindows.kt).
        # SwiftUI's App lifecycle supplies the scene delegate; only the flag is ours.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Required by Compose Multiplatform's iOS runtime, which refuses to start without it
        # (`PlistSanityCheck`). Without the key CoreAnimation caps an app at 60 fps on a ProMotion
        # iPhone, so every scroll in the shared shell would run at half the display's rate — the
        # runtime treats that as a misconfiguration rather than a preference, and throws at launch.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: supermux scans the pairing QR code printed by your broker.
        NSMicrophoneUsageDescription: supermux records voice messages you send to your agents.
        NSSpeechRecognitionUsageDescription: supermux uses on-device speech recognition to turn your voice into editable text.
        NSLocalNetworkUsageDescription: Supermux connects to the broker server running on your own computer when you reach it by its LAN address (for example 192.168.1.50). It does not scan or collect information about other devices on your network.
        ITSAppUsesNonExemptEncryption: false
        # Dev builds connect to a self-hosted broker (LAN / Tailscale, often plain http).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermux.app
        # APNs (aps-environment) + shared Keychain access group so the NSE can read
        # the same push keypair this app generates.
        CODE_SIGN_ENTITLEMENTS: Supermux/Supermux.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The phone app links exactly ONE Kotlin framework. SupermuxKit re-exports :shared (and
        # :ui), so every symbol Shared used to provide is still here — but linking Shared AS WELL
        # would embed the :shared klib twice: two Kotlin runtimes, two copies of every object, and
        # state that silently does not agree with itself. The watch app is a separate binary and
        # keeps its own Shared.framework; so do the notification extensions.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SupermuxKit
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Supermux App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
    preBuildScripts:
      - name: Build Kotlin SupermuxKit.framework (embed and sign)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ -f "$HOME/ios-build-env.sh" ]; then
            . "$HOME/ios-build-env.sh"
          fi
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)}"
          cd "$SRCROOT/.."
          # --no-daemon: the embed step runs codesign; a detached Gradle daemon
          # loses the calling session's keychain access (errSecInternalComponent)
          # when signing headlessly over SSH. Running in-session keeps codesign working.
          #
          # This task also copies :ui's compose-resources (the Geist fonts) into the app bundle —
          # which is why the `:ios` module applies the org.jetbrains.compose plugin even though it
          # declares no resources of its own. Without the plugin there is no such hook, the fonts
          # never reach the bundle, and every screen falls back to the system face SILENTLY.
          #
          # :ios:syncEditorWeb refreshes Supermux/EditorWeb from apps/android/src/main/assets/editor
          # (the ONE source of truth for the CodeMirror bundle — desktop copies from there too).
          # It runs BEFORE the resources phase, so the .app can never ship a stale cm6.js again.
          ./gradlew --no-daemon :ios:syncEditorWeb :ios:embedAndSignAppleFrameworkForXcode

  SupermuxWatch:
    type: application
    platform: watchOS
    sources:
      - path: SupermuxWatch
    info:
      path: SupermuxWatch/Info.plist
      properties:
        CFBundleDisplayName: Supermux
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.supermux.app
        NSSpeechRecognitionUsageDescription: Supermux turns your dictated voice into messages for your agents.
        # The broker is self-hosted, often plain http/ws (LAN / Tailscale) — allow it
        # (mirrors the iOS app). Without this, watchOS ATS blocks the ws:// connection.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermux.app.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Supermux Watch App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=watchos*]": "Apple Distribution"

  SupermuxPushNSE:
    # Notification Service Extension: intercepts `mutable-content` pushes and decrypts
    # the sealed blob on-device before display. Shares PushCrypto.swift + PushKeypair.swift
    # with the app (compiled into both) and the push Keychain access group.
    type: app-extension
    platform: iOS
    sources:
      - path: SupermuxPushNSE/NotificationService.swift
      # Shared sources — compiled into BOTH the app and this extension. The NSE loads
      # the keypair from the shared Keychain group and opens the blob with the same code.
      - path: Supermux/Push/PushCrypto.swift
      - path: Supermux/Push/PushKeypair.swift
      - path: Supermux/Push/PushGroupState.swift
    info:
      path: SupermuxPushNSE/Info.plist
      properties:
        CFBundleDisplayName: SupermuxPushNSE
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermux.app.push-nse
        CODE_SIGN_ENTITLEMENTS: SupermuxPushNSE/SupermuxPushNSE.entitlements
        # App extensions must declare they don't use the (extension-unsafe) UIKit APIs.
        APPLICATION_EXTENSION_API_ONLY: "YES"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Supermux Push NSE App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"

  SupermuxNotifContent:
    # Notification Content Extension: draws the custom expanded (long-press) view — a mini
    # transcript of the chat's recent messages.
    # Reads everything from the notification userInfo the NSE sets (no App Group / network).
    type: app-extension
    platform: iOS
    sources:
      - path: SupermuxNotifContent
    info:
      path: SupermuxNotifContent/Info.plist
      properties:
        CFBundleDisplayName: SupermuxNotifContent
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: supermux.chat
            UNNotificationExtensionInitialContentSizeRatio: 0.7
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermux.app.notif-content
        APPLICATION_EXTENSION_API_ONLY: "YES"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Supermux Notif Content App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"

  SupermuxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SupermuxTests
    dependencies:
      - target: Supermux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        # Compiled INTO the app's module, so they resolve the same `import SupermuxKit`.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

schemes:
  SupermuxWatch:
    build:
      targets:
        SupermuxWatch: all
    run:
      config: Debug
  Supermux:
    build:
      targets:
        Supermux: all
        SupermuxTests: [test]
    test:
      config: Debug
      targets:
        - SupermuxTests
    run:
      config: Debug
    archive:
      config: Release
