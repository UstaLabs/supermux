# XcodeGen project for the supermux iOS client.
#   xcodegen generate  (the .xcodeproj is gitignored)
# Kotlin framework: the app target's pre-build phase runs
# `./gradlew --no-daemon :shared:embedAndSignAppleFrameworkForXcode` (apps/ is the gradle root),
# which builds Shared.framework into shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
# and embeds+signs it into Supermux.app/Frameworks (JetBrains direct-integration flow).
name: Supermux
options:
  bundleIdPrefix: dev.supermux
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "13"
    # Gradle pre-build phase needs filesystem access outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.13.0"

targets:
  Supermux:
    type: application
    platform: iOS
    sources:
      - path: Supermux
        excludes:
          - "EditorWeb/**"
      # Bundled CodeMirror 6 editor assets (index.html + cm6.js) as a folder
      # reference so the directory structure is preserved in the .app bundle
      # (Bundle.main … subdirectory: "EditorWeb"). Loaded by the WKWebView editor.
      - path: Supermux/EditorWeb
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    info:
      path: Supermux/Info.plist
      properties:
        CFBundleDisplayName: supermux
        # Track the build-number/version settings so OTA installs actually supersede each other
        # (XcodeGen's default Info.plist otherwise hardcodes CFBundleVersion=1).
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: dev.supermux.connect
            CFBundleURLSchemes:
              - supermux
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: supermux scans the pairing QR code printed by your broker.
        NSMicrophoneUsageDescription: supermux records voice messages you send to your agents.
        ITSAppUsesNonExemptEncryption: false
        # Dev builds connect to a self-hosted broker (LAN / Tailscale, often plain http).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermux.ios
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    preBuildScripts:
      - name: Build Kotlin Shared.framework (embed and sign)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          source ~/ios-build-env.sh 2>/dev/null || true
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)}"
          cd "$SRCROOT/.."
          # --no-daemon: the embed step runs codesign; a detached Gradle daemon
          # loses the calling session's keychain access (errSecInternalComponent)
          # when signing headlessly over SSH. Running in-session keeps codesign working.
          ./gradlew --no-daemon :shared:embedAndSignAppleFrameworkForXcode

  SupermuxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SupermuxTests
    dependencies:
      - target: Supermux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

schemes:
  Supermux:
    build:
      targets:
        Supermux: all
        SupermuxTests: [test]
    test:
      config: Debug
      targets:
        - SupermuxTests
    run:
      config: Debug
    archive:
      config: Release
