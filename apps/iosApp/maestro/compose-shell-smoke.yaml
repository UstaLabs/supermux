# The Compose shell boots and the shared root is really on screen (cluster H2).
#
# Run:  maestro --udid <simulator-udid> test apps/iosApp/maestro/compose-shell-smoke.yaml
#
# What this is FOR: proving that `SupermuxApp` — the shared Compose root — is what the iOS app
# renders, not the SwiftUI shell it replaces, and that it is interactive rather than a first frame
# that happens to paint. The intro is the ideal subject because it is unmistakably shared code (the
# same pager Android shows), it needs no broker, and every page transition is driven by the Compose
# gesture/animation stack — so if Compose were mounted but not receiving touches, this fails.
#
# Assertions are on TEXT, deliberately, not on testTags: Compose's `testTag` becomes an
# accessibility identifier on Android through `testTagsAsResourceId`, but on iOS the shared screens
# expose their labels as accessibility TEXT, which is what Maestro reads here.
appId: dev.supermux.app
---
# A fresh launch, so the run is not sensitive to whatever the previous one left behind. `clearState`
# would also drop the pairing, which is exactly what we want for the intro.
- launchApp:
    clearState: true

# Page 1 — the shared intro's first page. If the SwiftUI shell were still the root this would be
# `OnboardingView`, which has none of this copy.
- assertVisible: "AFK."
- assertVisible: "Still shipping."
- assertVisible: "See what it does"

# Paging is a Compose gesture + animation. One tap and two swipes carry the pager across all four
# pages, which proves the composition is live and handling input rather than a static first frame.
#
# The assertion after the tap is that page ONE is gone. That is deliberately a negative: it holds
# whatever the second page happens to say, so the test cannot rot when that copy is edited, while
# still failing loudly if the tap did nothing — which is exactly the failure mode a mounted-but-
# inert Compose surface produces.
- tapOn: "See what it does"
- assertNotVisible: "AFK."

- swipe:
    direction: LEFT
- swipe:
    direction: LEFT

# The last page is the connect page — the shared pairing entry point (PairingState) that every
# later cluster builds on. These are its own controls, so reaching them means the whole intro ran
# inside Compose and ended somewhere usable.
- assertVisible: "Scan pairing code"
- assertVisible: "Manual entry"
