<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #282c34; overflow: hidden; }
    /* position:fixed + inset:0 sizes to the viewport regardless of body height —
       avoids the WebView height:100%/100vh -> 0 collapse. */
    #editor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    .cm-editor { height: 100%; }
    .cm-scroller { -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="cm6.js"></script>
</body>
</html>
