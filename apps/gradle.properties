kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g
# Allow configuring Apple (iOS) targets on non-macOS hosts (e.g. this Linux
# broker host + Linux CI). Their compile/link tasks are disabled here and run
# on a Mac (Spec 2); the JVM target builds + tests everywhere.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true

# AGP 9 turns its own built-in Kotlin support AND its new DSL on by default. Both collide with the
# `org.jetbrains.kotlin.android` plugin :android applies (KGP refuses to apply against the new DSL,
# and built-in Kotlin duplicates it). Keep the explicit KGP + legacy DSL for now.
# TODO(before AGP 10): drop `org.jetbrains.kotlin.android` from :android and migrate to AGP's
# built-in Kotlin (https://kotl.in/gradle/agp-built-in-kotlin), then delete both lines.
android.builtInKotlin=false
android.newDsl=false
# NOTE: `com.android.library` + `org.jetbrains.kotlin.multiplatform` in one module (:shared, :ui)
# is deprecated in AGP 9 (the `android.enableLegacyVariantApi` escape hatch was REMOVED in 9.0, so
# there is nothing to set). TODO(before AGP 10): migrate both modules to the
# `com.android.kotlin.multiplatform.library` plugin and its `androidLibrary {}` block.
# The Kotlin COMPILE daemon (separate JVM from Gradle's) inherits org.gradle.jvmargs unless told
# otherwise. Kotlin 2.4's Kotlin/Wasm backend needs materially more heap than 2.3 did for
# :web:compileProductionExecutableKotlinWasmJs: at 2g it does not fail, it GC-thrashes (measured:
# old gen pinned at 99.9%, 1723 full GCs / 4176s of GC and still not done after 80 minutes).
kotlin.daemon.jvmargs=-Xmx6g

# ── The Android ABIs the terminal engine ships ──────────────────────────────────────────────────
#
# ONE source of truth, read by BOTH sides of a pair that must never drift:
#   • `:terminal-core` stages `libsupermux_terminal_jni.so` into jniLibs for each entry, and FAILS
#     the build if one of them was never built (native/build.sh <target>).
#   • `:android` sets `abiFilters` to exactly these, so the APK claims support for an ABI if and
#     only if the engine for it is inside.
#
# Format: `<abi>=<native/build.sh target>`, comma-separated.
#
# arm64-v8a + x86_64 only, DELIBERATELY. The engine (`native/build.sh`) has no armeabi-v7a or x86
# target, and the terminal library it replaced in Plan 4 shipped all four — so this is a real,
# chosen reduction in claimed support, not bookkeeping. At minSdk 26 a 32-bit-only Android device
# is effectively extinct, every emulator image this repo's scripts and CI use is x86_64 or
# arm64-v8a, and nothing publishes a 32-bit variant (one universal APK, no splits/ABI flavours).
# A 32-bit device now gets "not compatible" at install time instead of an app whose terminal
# cannot open. Adding an ABI means adding it HERE and to native/build.sh, together.
supermux.terminal.androidAbis=arm64-v8a=android-arm64,x86_64=android-x64
