      '<span class="sp"></span><span class="gb cl">' + G.close + '</span></div>';
  }
  // the device menu: Responsive, then each shelf's presets with their sizes
  function deviceMenu() {
    var row = function (id, name, size) {
      return '<div class="mr" data-id="' + id + '"><span class="ck">' + G.check + '</span><span class="nm">' + esc(name) + '</span>' +
        (size ? '<span class="sz">' + size + '</span>' : '') + '</div>';
    };
    var h = row('', 'Responsive', null);
    ['Phones', 'Tablets', 'Desktops'].forEach(function (g) {
      h += '<div class="mg">' + g + '</div>';
      PRESETS.forEach(function (p) { if (p[4] === g) h += row(p[0], p[1], p[2] + ' × ' + p[3]); });
    });
    return h;
  }

  function compose() {
    var s = this.surface;
    s.classList.add('sm-row2');
    this.chat = K.finishedChat(K.session('claude'));
    s.appendChild(this.chat.el);
    var pane = el('section', 'sm-pane sm-browser sm-device');
    pane.appendChild(el('div', 'sm-tabs', UI.tabs(G.globe, 'Acme Outdoor')));
    var sheet = pane.appendChild(el('div', 'sm-sheet'));
    sheet.appendChild(el('div', 'sm-bbar',
      '<span class="gb">' + G.back + '</span><span class="gb off">' + G.fwd + '</span><span class="gb">' + G.restart + '</span>' +
      '<span class="addr"><i></i>localhost:5173</span>' +
      '<span class="gb">' + G.target + '</span><span class="gb dev">' + G.phone + '</span><span class="gb">' + G.ext + '</span><span class="gb">' + G.more + '</span>'));
    sheet.appendChild(el('div', 'sm-bline'));
    this.dbar = sheet.appendChild(el('div', 'sm-dbar', deviceBar()));
    var vp = this.vp = sheet.appendChild(el('div', 'sm-viewport'));
    this.dframe = vp.appendChild(el('div', 'sm-dframe'));
    this.page = this.dframe.appendChild(el('div', 'sm-page',
      '<h1>Acme Outdoor</h1><span class="srch">Search products</span>' +
      '<div class="grid"><span>Merino socks</span><span>Trail running shoes</span><span>Rain shell</span><span>Down vest</span></div>' +
      '<h2>Cart</h2><p>Your cart is empty.</p>'));
    this.menu = pane.appendChild(el('div', 'sm-dmenu', deviceMenu()));
    s.appendChild(pane);
    this.pane = pane;
  }
  function ready() { this.chat.stick(); }

  // device mode on with [id]: the bar shows it, and the stage draws the page at its size fitted to the pane
  // (DeviceMode.scaleIn: never above 100 %, 34 dp of margin), centred, in a hairline with 1 dp inside it
  function setDevice(id) {
    var p = preset(id), w = p[2], h = p[3];
    this.vp.classList.add('dev');
    this.dbar.classList.add('on');
    this.dbar.querySelector('.dp b').textContent = p[1];
    this.dbar.querySelector('.sf.w').textContent = w;
    this.dbar.querySelector('.sf.h').textContent = h;
    var vw = this.vp.offsetWidth, vh = this.vp.offsetHeight;
    var k = Math.max(0.1, Math.min(1, (vw - 34) / w, (vh - 34) / h));
    this.dbar.querySelector('.fit b').textContent = 'Fit ' + Math.floor(k * 100 + 1e-4) + '%';
    var fw = w * k + 4, fh = h * k + 4, f = this.dframe.style;
    f.width = fw + 'px'; f.height = fh + 'px';
    f.left = Math.round((vw - fw) / 2) + 'px'; f.top = Math.round((vh - fh) / 2) + 'px';
    var ps = this.page.style;
    ps.width = w + 'px'; ps.height = h + 'px'; ps.transform = 'scale(' + k + ')';
    [].forEach.call(this.menu.querySelectorAll('.mr'), function (r) { r.classList.toggle('chosen', r.getAttribute('data-id') === id); });
    this.device = id;
  }
  function openMenu() {
    var a = this.boxIn(this.dbar.querySelector('.dp'), this.pane);
    this.menu.style.left = a.x + 'px'; this.menu.style.top = (a.y + a.h) + 'px';
    this.menu.classList.add('on');
  }
  function closeMenu() {
    this.menu.classList.remove('on');
    [].forEach.call(this.menu.querySelectorAll('.mr.hov'), function (r) { r.classList.remove('hov'); });
  }

  function steps() {
    var self = this, q = function (sel) { return self.surface.querySelector(sel); };
    var row = function (id) { return q('.sm-dmenu .mr[data-id="' + id + '"]'); };
    var R = {};
    // the pane's parts, measured unzoomed before the run; the stage and device bar where device mode puts them
    function measure() {
      var br = self.box(self.pane), bar = self.box(q('.sm-bbar')), vp = self.box(self.vp);
      R.bar = { x: br.x + br.w * 0.35, y: 0, w: br.w * 0.65, h: 130 };
      R.stage = { x: br.x, y: vp.y + 35, w: br.w, h: vp.h - 35 };
      R.menu = { x: br.x, y: bar.y - 10, w: br.w * 0.62, h: 590 };
    }
    return [
      [10, function () { measure(); }],
      [500, function () { self.cam(R.bar); }],
      [800, function () { self.pointAt(q('.sm-bbar .dev')); }],
      [800, function () {
        self.click();
        q('.sm-bbar .dev').classList.add('on');
        self.setDevice(FIRST);
      }],
      [1000, function () { self.cam(R.stage); self.pointAt(self.vp, 0.86, 0.5); }],
      [2000, function () { self.cam(R.menu); }],
      [700, function () { self.pointAt(q('.sm-dbar .dp'), 0.45); }],
      [800, function () { self.click(); self.openMenu(); }],
      [700, function () { self.pointAt(row(NEXT), 0.4); }],
      [550, function () { row(NEXT).classList.add('hov'); }],
      [600, function () { self.click(); self.closeMenu(); self.setDevice(NEXT); }],
      [900, function () { self.cam(R.stage); self.pointAt(self.vp, 0.86, 0.5); }],
      [2200, function () { self.cam(null); }]
    ];
  }
  var DeviceScene = K.extend(compose, steps, { ready: ready, setDevice: setDevice, openMenu: openMenu, closeMenu: closeMenu });
  window.SupermuxDeviceScene = DeviceScene;
  K.define('device', DeviceScene);
})();

</script>
<script>// app/cards-scene.js
// An agent's HTML card in the chat (#104), played over the kit: the recorded Claude Code chat from app/replay-data.js
// asks for its test results as a card; the card arrives under the reply (ui/chat/HtmlCard.kt HtmlCardView: its title,
// then its page, no frame of its own); a click on its button answers as the user, labelled "from <card>"
// (ui/chat/Timeline.kt UserMessage). Used by the site and by the app's What's new (#90).
//   <div data-scene="cards"></div>
(function () {
  'use strict';
  var UI = window.SupermuxUI, K = window.SupermuxSceneKit;
  if (!UI || !K) return;
  var el = UI.el, esc = UI.esc, H = K.H;

  var ASK = 'Show the test results as a card';
  var REPLY = 'Here they are. The change isn\'t committed yet.';
  var CARD = 'Search box tests';
  // the four checks the recorded reply lists, as the card's rows
  var CHECKS = ['The box appears above the grid', 'Matching rules, plus an empty grid when nothing matches', 'Clearing the box shows all products again', 'Adding a filtered product to the cart still works'];

  function compose() {
    var s = this.surface;
    this.chat = K.finishedChat(K.session('claude'));
    this.chat.el.style.flex = '1';
    s.style.display = 'flex';
    s.appendChild(this.chat.el);
    this.ph = this.chat.el.querySelector('.sm-composer .ph');
  }
  function ready() { this.chat.stick(); }
  function card() {
    return el('div', 'sm-hcard',
      '<div class="ht">' + esc(CARD) + '</div>' +
      '<div class="pg"><div class="sum"><b>10 of 10 pass</b> · run with Bun against a stand-in for React</div>' +
      CHECKS.map(function (c) { return '<div class="rw"><i>✓</i>' + esc(c) + '</div>'; }).join('') +
      '<div class="bt"><span class="pr go">Commit it</span><span>Not yet</span></div></div>');
  }
  function steps() {
    var self = this, R = {};
    function measure() {
      R.composer = { x: 0, y: H - 260, w: 1120, h: 260 };
      R.chat = { x: 120, y: H - 560, w: 880, h: 560 };
    }
    return [
      [10, measure],
      [500, function () { self.cam(R.composer); self.pointAt(self.ph, 0.2); }],
      [800, function () { self.click(); self.type(self.ph, ASK); }],
      [1600, function () {
        self.press(['↵']);
        self.ph.textContent = 'Ask anything · @ to add files · / for commands';
        self.chat.anchor = null;
        self.chat.user({ text: ASK });
        self.chat.stick();
      }],
      [700, function () { self.release(); self.cam(R.chat); }],
      [700, function () {
        self.chat.asst({ text: REPLY, clock: '20:12' });
        self.chat.stick();
      }],
      [600, function () {
        self.chat.anchor = null;
        self.chat.add(self.cardEl = card());
        self.chat.stick();
        self.later(30, function () { self.cardEl.classList.add('in'); });
      }],
      [1400, function () { self.pointAt(self.cardEl.querySelector('.go')); }],
      [800, function () {
        self.click();
        var go = self.cardEl.querySelector('.go'); go.classList.add('press');
        self.later(160, function () { go.classList.remove('press'); });
      }],
      [300, function () {
        self.chat.anchor = null;
        self.chat.add(el('div', 'sm-user', '<div><small class="from">from ' + esc(CARD) + '</small>Commit it</div>'));
        self.chat.stick();
      }],
      [2400, function () { self.cam(null); }]
    ];
  }
  var CardsScene = K.extend(compose, steps, { ready: ready });
  window.SupermuxCardsScene = CardsScene;
  K.define('cards', CardsScene);
})();

</script>
<script>// app/offline-scene.js
// Chats open at once, even offline (#121), played over the kit: the sidebar and one chat, the host unreachable.
// The connection strip sits above the list ("Offline · showing saved chats", Retry) and above the composer
// ("Offline · messages send when you're back"), as shell/ConnectionStrip.kt draws it (SessionListScreen.kt puts it
// under the new-session card, ChatPanel.kt just above the composer). The pointer opens a chat with unread replies:
// it opens from the saved copy at once, already placed at its first unread message under the "2 new messages" line
// (chat/ChatPanel.kt NewMessagesLine, no scroll animation). The host comes back: "Connecting…", then the strips are
// gone; the line fades once the new messages have been on screen. The chats are the recorded ones in
// app/replay-data.js; the two new replies after the line are this scene's. Used by the site and by What's new (#90).
//   <div data-scene="offline"></div>
(function () {
  'use strict';
  var UI = window.SupermuxUI, K = window.SupermuxSceneKit, REPLAY = window.SUPERMUX_REPLAY;
  if (!UI || !K || !REPLAY) return;
  var el = UI.el, esc = UI.esc, H = K.H;

  // the two replies that came in while the window was closed (the recorded chat ends at 20:09)
  var NEW = [
    { text: 'The background check finished: all 10 still pass on a clean copy of the branch.', clock: '20:14' },
    { text: 'Nothing else is waiting on me. Say the word and I\'ll commit it.', clock: '20:15' }
  ];
  var TEXT = { list: 'Offline · showing saved chats', chat: 'Offline · messages send when you\'re back', connecting: 'Connecting…' };

  // ConnectionStrip(inChat): a warning dot while offline, an 11dp spinner while connecting; Retry only above the list
  function strip(inChat) {
    var s = el('div', 'sm-conn' + (inChat ? ' in' : ''), '<span class="dot"></span><span class="spin"></span><span class="tx"></span>' + (inChat ? '' : '<span class="retry">Retry</span>'));
    return s;
  }
  function setStrip(s, banner) {
    s.classList.toggle('connecting', banner === 'connecting');
    s.classList.toggle('none', banner === 'none');
    s.querySelector('.tx').textContent = banner === 'connecting' ? TEXT.connecting : s.classList.contains('in') ? TEXT.chat : TEXT.list;
  }
  function chatPane(key) {
    var p = K.finishedChat(K.session(key));
    p.strip = strip(true);
    p.box.insertBefore(p.strip, p.box.querySelector('.sm-dock'));
    return p;
  }

  function compose() {
    var s = this.surface, byKey = {};
    s.classList.add('sm-offline');
    REPLAY.sessions.forEach(function (x) { byKey[x.key] = x; });
    var base = REPLAY.sidebar.groups;
    // the list by project: the recorded chats first (their final titles), then the workspace's others
    this.groups = [
      { project: base[0].project, archived: base[0].archived, rows: [
        { key: 'claude', title: 'Add Product Name Search', age: '1m', branch: byKey.claude.branch, unread: true },
        { key: 'antigravity', title: byKey.antigravity.title0, age: '9m', branch: byKey.antigravity.branch }
      ].concat(base[0].rows.slice(0, 2)) },
      { project: base[1].project, archived: base[1].archived, rows: [
        { key: 'codex', title: 'Add Refunds Endpoint', age: '8m', branch: byKey.codex.branch, active: true },
        { key: 'grok', title: 'Request log middleware', age: '9m', branch: byKey.grok.branch }
      ].concat(base[1].rows.slice(0, 2)) }
    ];
    var side = this.side = new UI.Sidebar(REPLAY.sessions, { view: 'project', agents: [], groups: this.groups });
    s.appendChild(side.el);
    // the strip under the new-session card, above the list
    this.listStrip = strip(false);
    var list = side.el.querySelector('.sm-list');
    list.insertBefore(this.listStrip, list.querySelector('.sm-new').nextSibling);
    var rows = side.el.querySelectorAll('.sm-wrow');
    this.rowFor = {};
    var i = 0, self = this;
    this.groups.forEach(function (g) { g.rows.forEach(function (r) { if (r.key) self.rowFor[r.key] = rows[i]; i++; }); });

    this.work = s.appendChild(el('div', 'sm-work'));
    this.from = chatPane('codex');
    this.to = chatPane('claude');
    this.work.appendChild(this.from.el);
    // the chat being opened: its saved copy, the line above its first unread reply, the replies after it
    this.line = this.to.list.appendChild(el('div', 'sm-newline', '<i></i><span>' + esc(NEW.length + ' new messages') + '</span><i></i>'));
    NEW.forEach(function (m) { self.to.asst(m); });
    setStrip(this.listStrip, 'offline');
    setStrip(this.from.strip, 'offline');
    setStrip(this.to.strip, 'offline');
    this.start = [760, 470];
  }
  function ready() { this.from.stick(); }
  // the chat opens in place: its first unread message near the top (ChatPanel openAt, offset 0 under the 12dp
  // content padding), or its end when everything new fits
  function open() {
    var to = this.to, chat = to.chat;
    this.work.replaceChild(to.el, this.from.el);
    UI.fitTabs(to.el);
    chat.scrollTop = this.line.offsetTop - 12;
    var row = this.rowFor.claude, was = this.rowFor.codex;
    was.classList.remove('sel');
    row.classList.remove('unread');
    row.classList.add('sel');
    row.querySelector('.sm-mark').outerHTML = UI.mark('idle');
    this.groups[0].rows[0].unread = false;
    this.side.count(this.groups[0]);
  }
  function steps() {
    var self = this, R = {};
    function measure() {
      var side = self.box(self.side.el);
      R.list = { x: 0, y: 0, w: 640, h: 440 };
      // the chat's lower half, a slice of the list still beside it
      R.chat = { x: side.w - 200, y: H - 560, w: K.W - side.w + 200, h: 560 };
    }
    return [
      [10, measure],
      // the window is up at once from the saved copy, offline
      [700, function () { self.cam(R.list); }],
      [1100, function () { self.pointAt(self.rowFor.claude.querySelector('b'), 0.35); }],
      [900, function () { self.click(); }],
      // opened at once, placed at the line
      [140, function () { self.open(); }],
      [500, function () { self.cam(R.chat); self.pointAt(self.to.el.querySelector('.sm-composer .ph'), 0.25); }],
      // the host is back: "Connecting…", then nothing
      [2400, function () { setStrip(self.listStrip, 'connecting'); setStrip(self.to.strip, 'connecting'); self.cam(null); }],
      [1300, function () { setStrip(self.listStrip, 'none'); setStrip(self.to.strip, 'none'); }],
      // the new messages have been on screen: the line fades
      [700, function () { self.line.classList.add('seen'); }],
      [2000, function () { self.cam(null); }]
    ];
  }
  var OfflineScene = K.extend(compose, steps, { ready: ready, open: open });
  window.SupermuxOfflineScene = OfflineScene;
  K.define('offline', OfflineScene);
})();

</script>
<script>// app/resume-scene.js
// A usage limit, waited out (#92), played over the kit: the recorded Claude Code chat from app/replay-data.js, open as
// the Agent Miso, runs out of usage mid-task. The broker says so in the chat (src/main.ts, the "waiting" account
// event), the Agent row reads "Waiting · resumes 21:00" (ui/session/AgentsBlock.kt agentRowStatus) and the strip
// docks above the composer (ui/accounts/LimitWait.kt LimitWaitStrip). The clock runs on to the reset; the session
// carries on by itself: the strip goes, the broker says it resumed and hands the agent its continuation
// (src/core/accounts/limit-wait.ts resumeAfterLimit), and the recorded run goes on. Used by the site and by the
// app's What's new (#90).
//   <div data-scene="resume"></div>
(function () {
  'use strict';
  var UI = window.SupermuxUI, K = window.SupermuxSceneKit, REPLAY = window.SUPERMUX_REPLAY;
  if (!UI || !K) return;
  var el = UI.el, esc = UI.esc, H = K.H;

  // Icons.Outlined.HourglassBottom (compose.materialIconsExtended)
  var HOURGLASS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 22l-.01-6L14 12l3.99-4.01L18 2H6v6l4 4-4 3.99V22h12zM8 7.5V4h8v3.5l-4 4-4-4z"/></svg>';
  var ACCOUNT = 'Work Max';
  var HIT = 20 * 60 + 8, RESET = 21 * 60;      // the recording's 20:08; Claude's limit resets on the hour
  function hm(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  var AT = hm(RESET);
  // the broker's notices (src/main.ts "waiting", limit-wait.ts resumeAfterLimit) and the continuation it delivers
  var LIMIT_NOTICE = 'Usage limit reached — resumes automatically on ' + ACCOUNT + ' at ' + AT;
  var RESUMED_NOTICE = 'Resumed on ' + ACCOUNT + ' — the usage limit reset';
  var CONTINUE = 'Continue from where you stopped. Your previous turn hit a usage limit, which has now reset.';
  var REPLY = 'Picking up where I stopped: the search box is in `src/App.jsx` now, and the check passes.';
  // the recording: shown up to the Read it was on when the limit hit (event 15); after the reset, its Edit and check
  var CUT = 15;
  // the Agents zone as the hero's demo host had it (app/agents-data.js), the recorded chat open as Miso
  var AGENTS = window.SUPERMUX_HERO_AGENTS || [
    { name: 'Miso', rig: 'miso', age: '19m' },
    { name: 'Sage', rig: 'hoot', age: '4m', unread: true, preview: 'Verdict: safe to merge. The commit is now on the branch, and the fix is correct: it verifies the signature against …' },
    { name: 'Nova', rig: 'fox', age: '19m', asleep: true, preview: 'Standup: acme-store — the Acme storefront app (package.json + src,' }
  ];

  // LimitWait.kt limitWaitDetail: "in 52 min · on Work Max", "any moment now" under a minute
  function detail(left) {
    var w = left <= 0 ? 'any moment now' : left < 60 ? 'in ' + left + ' min' : 'in ' + Math.floor(left / 60) + ' h ' + (left % 60) + ' min';
    return w + ' · on ' + ACCOUNT;
  }
  function strip() {
    return el('div', 'sm-lwait',
      '<div class="in"><span class="hg">' + HOURGLASS + '</span>' +
      '<div class="tx"><div class="t">Usage limit reached. Resumes automatically at ' + AT + '</div><div class="d"></div></div>' +
      '<span class="a">Cancel</span><span class="a now">Resume now</span></div>');
  }

  function compose() {
    var s = this.surface;
    var session = this.session = K.session('claude');
    this.rest = session.events.slice(CUT + 1);
    session.events = session.events.slice(0, CUT + 1);
    var chat = this.chat = K.finishedChat(session);
    chat.setTitle('Miso');
    var agents = JSON.parse(JSON.stringify(AGENTS)).map(function (a, i) {
      if (i === 0) { a.active = true; a.working = true; a.unread = false; a.asleep = false; }
      return a;
    });
    var side = this.side = new UI.Sidebar([], { view: 'project', agents: agents, groups: JSON.parse(JSON.stringify(REPLAY.sidebar.groups)) });
    this.row = side.agentBlock.rows[agents[0].key || agents[0].name].el;
    s.appendChild(side.el);
    var work = s.appendChild(el('div', 'sm-work'));
    work.appendChild(chat.el);
    // ChatPanel: the strip sits in the composer's column, right above it
    var dock = chat.el.querySelector('.sm-dock');
    this.strip = dock.insertBefore(strip(), dock.firstChild);
    this.setDetail(RESET - HIT);
    this.start = [880, 700];
  }
  function ready() {
    var frame = this.keys.parentNode;
    if (this.clock && this.clock.parentNode) this.clock.parentNode.removeChild(this.clock);
    this.clock = frame.appendChild(el('div', 'sm-rclock'));
    this.chat.instant = false;
    this.chat.setWorking(true);
    this.chat.stick();
  }
  function setDetail(left) { this.strip.querySelector('.d').textContent = detail(left); }
  // the Agent row (AgentsBlock.kt): working… in primary, the wait in warning, else its last line
  function agent(state, preview) {
    var r = this.row;
    r.classList.toggle('working', state === 'working');
    r.classList.toggle('lwait', state === 'wait');
    r.querySelector('time').textContent = 'now';
    r.querySelector('.pv').textContent = state === 'working' ? 'working…' : state === 'wait' ? 'Waiting · resumes ' + AT : preview;
    if (r._av) r._av.set(state === 'working' ? 'working' : 'idle');
  }
  function showClock(t) {
    this.clock.textContent = t;
    this.clock.classList.toggle('on', !this.instant);
  }
  function steps() {
    var self = this, chat = this.chat, R = {};
    function measure() {
      var p = self.box(chat.el), sb = self.box(self.side.el);
      R.chat = { x: p.x, y: H - 360, w: p.w, h: 360 };
      R.side = { x: 0, y: 40, w: sb.w + 260, h: 330 };
    }
    var edit = this.rest[0], check = this.rest[1], git = this.rest[2];
    // the clock runs from the limit to the reset: minutes fly, the last seconds tick
    function run() {
      var m = HIT;
      (function minute() {
        self.showClock(hm(m));
        self.setDetail(RESET - m);
        if (m < RESET - 1) { var fast = m < RESET - 7; m = Math.min(RESET - 1, m + (fast ? 3 : 1)); self.later(fast ? 50 : 160, minute); }
        else {
          var sec = 57;
          (function tick() {
            self.showClock(hm(RESET - 1) + ':' + sec);
            self.setDetail(0);
            if (++sec < 60) self.later(500, tick); else self.later(500, function () { self.showClock(AT + ':00'); });
          })();
        }
      })();
    }
    return [
      [10, measure],
      // the limit: the turn stops, the broker says when it carries on, the row and the strip say it too
      [700, function () { self.cam(R.chat); }],
      [1100, function () {
        chat.instant = self.instant;
        chat.setWorking(false);
        chat.asst({ text: LIMIT_NOTICE, clock: hm(HIT) });
        self.strip.classList.add('on');
        self.agent('wait');
        chat.stick();
      }],
      [700, function () { self.pointAt(self.strip.querySelector('.t'), 0.6, 0.6); }],
      [1700, function () { self.cam(R.side); self.pointAt(self.row.querySelector('.pv'), 0.75, 0.9); }],
      [2000, function () { self.cam(null); self.place(880, 700); }],
      // nobody touches it: the clock runs on to the reset
      [900, function () { run(); }],
      // the reset: the strip goes, the broker says so and hands the agent its continuation
      [3700, function () {
        self.clock.classList.remove('on');
        self.strip.classList.remove('on');
        chat.anchor = null;
        chat.asst({ text: RESUMED_NOTICE, clock: AT });
        chat.user({ text: CONTINUE });
        chat.setWorking(true);
        self.agent('working');
        self.cam(R.chat);
      }],
      [900, function () { chat.tool(edit); }],
      [700, function () { chat.toolEnd(edit); chat.tool(check); }],
      [900, function () { chat.toolEnd(check); chat.git(git); }],
      [700, function () {
        chat.asst({ text: REPLY, clock: hm(RESET + 1) });
        chat.setWorking(false);
        self.agent('idle', REPLY.replace(/`/g, ''));
      }],
      [1400, function () { self.cam(R.side); }],
      [1800, function () { self.cam(null); }]
    ];
  }
  var ResumeScene = K.extend(compose, steps, { ready: ready, setDetail: setDetail, agent: agent, showClock: showClock });
  window.SupermuxResumeScene = ResumeScene;
  K.define('resume', ResumeScene);
})();

<script>// app/restart-scene.js
// Restart to update (#113), played over the kit: the app window from app/replay-data.js (its sidebar in the status
// view, the recorded Claude Code chat beside it). The update has downloaded in the background, so the sidebar's
// update card says "Update ready" (ui/update/AppUpdate.kt UpdateCardBody, RESTART_CAPTION); the pointer presses
// "Restart to update"; the window closes and the installer opens it again; the sessions, which carried on in the
// broker, show their state again; the notice says "Updated to v… · all sessions reconnected" (announceUpdate, drawn
// as the desktop's snackbar, ui/platform/FlowNotices.kt NoticeOverlay); and What's new's card takes the update
// card's slot (ui/whatsnew/WhatsNewCard.kt). Desktop only. Used by the site and by the app's What's new (#90).
//   <div data-scene="restart"></div>, or new SupermuxRestartScene(surface, { mac: true }).play()
(function () {
  'use strict';
  var UI = window.SupermuxUI, K = window.SupermuxSceneKit, REPLAY = window.SUPERMUX_REPLAY;
  if (!UI || !K || !REPLAY) return;
  var el = UI.el, esc = UI.esc, H = K.H;

  // the version and chapter count come from the host (data-version / data-chapters): the edition that plays this
  // scene is the release it names. Without them (a page that doesn't say), the card names no count.
  var VERSION = '', CHAPTERS = 0;
  // the edition's chapters on a desktop (WhatsNewOffer.chapters: its manifest's chapters for this platform)

  var RESTART_CAPTION = 'Restart to update: supermux closes, installs it and opens again. Your sessions carry on.';
  // Icons.Outlined.Redeem and Icons.Default.Close, the card's two glyphs
  var REDEEM = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>';
  // the sessions working when the restart is pressed: they carry on in the broker and are working again after it
  var WORKING = ['codex', 'grok'];

  // UpdateCardBody with a downloaded release and an updater that restarts to update
  function updateCard() {
    return el('div', 'sm-ucard',
      '<div class="bx"><div class="hd">' + REDEEM + '<span class="t">Update ready</span><span class="x">' + UI.ic('close') + '</span></div>' +
      '<div class="bd"><div class="v">v' + esc(VERSION) + ' is downloaded.</div><div class="c">' + esc(RESTART_CAPTION) + '</div>' +
      '<div class="bt"><span class="ol">What\'s new</span><span class="go">Restart to update</span></div></div></div>');
  }
  // WhatsNewCardBody: the same slot and shape, one solid button across
  function whatsNewCard(mac) {
    var place = mac ? 'on this Mac' : 'on this computer';
    return el('div', 'sm-ucard',
      '<div class="bx"><div class="hd">' + REDEEM + '<span class="t">Updated to v' + esc(VERSION) + '</span><span class="x">' + UI.ic('close') + '</span></div>' +
      '<div class="n">' + (CHAPTERS ? CHAPTERS + (CHAPTERS === 1 ? ' new thing' : ' new things') + ' you can do ' + place + '.' : 'See what you can do now.') + '</div>' +
      '<div class="bt one"><span class="go">Explore what\'s new</span></div></div>');
  }

  function compose() {
    VERSION = this.opts.version || VERSION; CHAPTERS = this.opts.chapters || CHAPTERS;
    var s = this.surface;
    s.classList.add('sm-restart');
    var sessions = REPLAY.sessions.map(function (x) { return JSON.parse(JSON.stringify(x)); });
    // the window: what quits and opens again
    var win = this.win = s.appendChild(el('div', 'sm-rwin'));
    this.side = new UI.Sidebar(sessions, Object.assign({}, REPLAY.sidebar, { agents: [] }));
    win.appendChild(this.side.el);
    var work = win.appendChild(el('div', 'sm-work'));
    this.chat = K.finishedChat(K.session('claude'));
    work.appendChild(this.chat.el);
    // the card slot: on the footer rail, above the host row (shell/SupermuxApp.kt: WhatsNewSlot, then AppUpdateCard)
    var foot = this.side.el.querySelector('.sm-host');
    this.slot = this.side.el.insertBefore(el('div', 'sm-uslot'), foot);
    this.ucard = this.slot.appendChild(updateCard());
    this.wcard = this.slot.insertBefore(whatsNewCard(this.opts.mac !== false), this.ucard);
    this.setWorking(true);
    // the desktop's snackbar host, over the whole window's bottom edge
    this.notice = s.appendChild(el('div', 'sm-notice', '<span>Updated to v' + esc(VERSION) + ' · all sessions reconnected</span>'));
    this.start = [640, 520];
  }
  function ready() { this.chat.stick(); }
  // the Active group's marks: the working sessions spin, or every one is a quiet ring
  function setWorking(on) {
    var side = this.side;
    ['claude', 'codex', 'grok', 'antigravity'].forEach(function (k) { side.kid(k, on && WORKING.indexOf(k) >= 0); });
    side.primary(null, on);
  }
  function steps() {
    var self = this, R = {};
    function go() { return self.ucard.querySelector('.go'); }
    // Regions are measured once, unzoomed, before the run; the card's region is where both cards sit.
    function measure() {
      var side = self.box(self.side.el);
      R.card = { x: 0, y: H - 400, w: side.w + 260, h: 400 };
      R.list = { x: 0, y: 40, w: side.w + 380, h: 420 };
      R.notice = { x: 0, y: H - 500, w: 870, h: 500 };
    }
    return [
      [10, measure],
      // the update has downloaded in the background: the card comes up on the footer rail
      [400, function () { self.ucard.classList.add('in'); }],
      [500, function () { self.cam(R.card); }],
      [1300, function () { self.pointAt(go(), 0.5, 0.55); }],
      [900, function () {
        self.click();
        go().classList.add('press');
        self.later(160, function () { go().classList.remove('press'); });
      }],
      // supermux quits: the window goes
      [300, function () { self.win.classList.add('off'); self.cursor.classList.add('off'); }],
      [450, function () {
        self.cam(null, true);
        self.ucard.classList.remove('in');
        self.setWorking(false);
        self.chat.stick();
      }],
      // ... the installer runs, and opens it again: the sessions are there, not yet heard from
      [1100, function () { self.win.classList.remove('off'); }],
      [700, function () { self.cam(R.list); self.place(560, 600); self.cursor.classList.remove('off'); }],
      // connected: the sessions that carried on through the restart are working again
      [900, function () {
        WORKING.forEach(function (k, i) { self.later(i * 260, function () { self.side.kid(k, true); }); });
        self.side.primary(null, true);
      }],
      [1000, function () { self.notice.classList.add('on'); self.cam(R.notice); }],
      // What's new's card, in the update card's slot
      [1500, function () { self.wcard.classList.add('in'); self.cam(R.card); }],
      [1300, function () { self.pointAt(self.wcard.querySelector('.go'), 0.5, 0.6); }],
      // a snackbar's short duration
      [1200, function () { self.notice.classList.remove('on'); }],
      [500, function () { self.cam(null); }]
    ];
  }
  var RestartScene = K.extend(compose, steps, { ready: ready, setWorking: setWorking });
  window.SupermuxRestartScene = RestartScene;
  K.define('restart', RestartScene);
})();

</script>

    ['7999bec7-2664-478a-a966-26ae82a1069f', 'acme-store', 'mux/cart-item-count', 'Cart item count', 'today', 610 * MB, 'In use by a running chat'],
    ['e5a20d93-4c17-4b8f-a3e6-0d9b7c51f2a8', 'billing-api', 'mux/request-logging', 'Request log middleware', 'yesterday', 540 * MB, '3 changed files'],
    ['b7294745-0348-4208-bf26-e9d3dc64d022', 'acme-store', 'mux/product-grid-styles', null, '2 months ago', 420 * MB, null]
  ];
  var TOTAL = { bytes: 12.64 * GB, folders: 23, clean: 14 };
  var PICKS = [2, 4];

  function navHtml(selected, onMachine) {
    return '<div class="ss-cards">' + MACHINES.map(function (m, i) {
      return '<div class="ss-card' + (onMachine && i === 0 ? ' on' : '') + '">' + m.glyph + '<div class="tx"><b>' + esc(m.name) +
        '</b><span><i></i>Running</span></div>' + G.chev + '</div>';
    }).join('') + '</div>' + RAIL.map(function (r) {
      return '<div class="ss-nav' + (r[0] === selected ? ' on' : '') + '">' + r[1] + '<span>' + esc(r[0]) + '</span></div>';
    }).join('');
  }

  /* KitRow and its controls (settings/kit/KitRows.kt, KitControls.kt) */
  function row(label, desc, trailing, cls) {
    return '<div class="kr' + (cls ? ' ' + cls : '') + '"><div class="in"><div class="lb"><div class="l">' + esc(label) + '</div>' +
      (desc ? '<div class="d">' + esc(desc) + '</div>' : '') + '</div><div class="tr">' + (trailing || '') + '</div></div><div class="hl"></div></div>';
  }
  function options(list, on) {
    return '<div class="ko">' + list.map(function (o) { return '<span' + (o === on ? ' class="on"' : '') + ' data-o="' + esc(o) + '">' + esc(o) + '</span>'; }).join('') + '</div>';
  }
  var TOGGLE_ON = '<span class="ktg on"><i></i></span>';
  function ghost(text, cls) { return '<span class="kgb' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</span>'; }

  // the release the scene is shown for, from its host (data-version); the App version row and its What's new link name it
  var VERSION = '';
  function generalPage() {
    // GeneralPage.kt LookRows + "This app" (AppUpdateRows, CacheRow); desktop opens dark, its Theme shows Dark
    return '<div class="col">' +
      '<div class="ttl">General</div><div class="scope">' + G.laptop + '<span>Only this computer</span></div><div class="sp14"></div>' +
      row('Theme', null, options(['System', 'Light', 'Dark'], 'Dark'), 'theme') +
      row('Language', 'Follows your device unless you pick one.', options(['System', 'English', 'Türkçe'], 'System')) +
      row('Text size', 'Scales all text in the app.', '<span class="kv">100%</span><span class="ksl"><i></i><b style="width:25%"></b><u style="left:25%"></u></span>') +
      row('Show replies as they\'re written', 'Off: a reply appears once the agent has finished it.', TOGGLE_ON) +
      row('Chat detail', 'How much of each tool call a chat shows.', options(['Low', 'Medium', 'High'], 'Medium')) +
      row('Terminal colours', 'Programs that pick their own colours keep them.', options(['Match app', 'Dark', 'Light'], 'Match app')) +
      '<div class="ksh">This app</div>' +
      row('App version', 'supermux ' + esc(VERSION) + ' · up to date', ghost('Check for updates'), 'nodiv') +
      (VERSION ? '<div class="kafter"><span class="kta">What\'s new in v' + esc(VERSION) + '</span></div>' : '') +
      row('Download updates in the background', 'A new version downloads quietly, then asks before restarting. Off: you choose when to download.', TOGGLE_ON) +
      row('Cached images and files', '214 MB, kept so they open instantly and offline.', ghost('Clear')) +
      '</div>';
  }

  function worktreesPage() {
    return '<div class="ss-scroll"><div class="col wide">' +
      '<span class="kta back">' + G.back + esc(HERE) + '</span><div class="ttl">Chat worktrees</div><div class="sp14"></div>' +
      '<div class="wt-sum"><span class="s">' + bytes(TOTAL.bytes) + ' in ' + folders(TOTAL.folders) + ' · ' + TOTAL.clean + ' have no changes</span>' +
      '<span class="u">Updated just now · </span><span class="kta">Refresh</span></div>' +
      '<div class="wt-sel"><span class="kta">Select the ' + TOTAL.clean + ' without changes</span><span class="dim clr">Clear</span><span class="sp"></span>' +
      '<span class="srt"><span class="f">Sort</span><span class="o on">Size</span><span class="f">·</span><span class="o">Last used</span></span></div>' +
      '<div class="wt-list">' + TREES.map(function (t, i) {
        var locked = t[6];
        return '<div class="wt-row' + (locked ? ' locked' : '') + (i === TREES.length - 1 ? ' last' : '') + '">' +
          '<div class="cbx"><span class="kcb">' + G.check + '</span></div><div class="tx">' +
          '<div class="a"><span class="f">' + esc(t[0]) + '</span><span class="b">' + bytes(t[5]) + '</span></div>' +
          '<div class="m">' + esc(t[1]) + ' · <code>' + esc(t[2]) + '</code></div>' +
          '<div class="m">' + (t[3] ? '“' + esc(t[3]) + '”' : '<span class="fa">No chat</span>') + ' · Last used ' + esc(t[4]) + ' · ' +
          (locked ? '<span class="w">' + esc(locked) + '</span>' : 'No changes') + '</div></div></div>';
      }).join('') + '</div></div></div>' +
      '<div class="wt-bar"><div class="hl"></div><div class="in"><span class="dim">Clear</span><span class="sp"></span>' + ghost('Delete', 'danger') + '</div></div>';
  }

  function compose() {
    VERSION = this.opts.version || VERSION;
    var s = this.surface, mac = this.opts.mac !== false;
    s.classList.add('sm-set');
    var rail = s.appendChild(el('div', 'ss-rail'));
    rail.appendChild(el('div', 'ss-head', '<span class="bk">' + G.back + '</span><b>Settings</b>'));
    this.field = rail.appendChild(el('div', 'ss-search', G.search + '<span class="q"></span><span class="x">' + G.close + '</span><span class="k">' + (mac ? '⌘F' : 'Ctrl+F') + '</span>'));
    this.list = rail.appendChild(el('div', 'ss-list'));
    var detail = this.detail = s.appendChild(el('div', 'ss-detail'));
    this.general = detail.appendChild(el('div', 'ss-page on', generalPage()));
    this.trees = detail.appendChild(el('div', 'ss-page wt', worktreesPage()));
    this.keyNames = mac ? ['⌘', 'F'] : ['Ctrl', 'F'];
    this.picked = [];
    this.setQuery('');
    this.showNav('General', false);
  }
  function showNav(selected, onMachine) { this.list.innerHTML = navHtml(selected, onMachine); }
  // the field and the rail under it: the rows while it is empty, the results while there is a query
  function setQuery(q, caret) {
    var f = this.field;
    f.classList.toggle('has', !!q);
    f.querySelector('.q').innerHTML = q ? esc(q) + (caret ? '<span class="caret"></span>' : '') : (caret ? '<span class="caret"></span>' : '') + '<span class="ph">Search settings</span>';
    if (!q) return;
    var groups = search(q);
    this.list.innerHTML = groups.length ? '<div class="ss-results">' + groups.map(function (g) {
      return '<div class="gh">' + esc(g.page === 'Machine' ? HERE : g.page) + '</div>' + g.hits.map(function (e) {
        return '<div class="hit" data-l="' + esc(e[1] || e[0]) + '"><span>' + highlight(e[1] || e[0], q) + '</span>' + (e[1] ? '' : '<small>Page</small>') + '</div>';
      }).join('');
    }).join('') + '</div>' : '<div class="ss-none">No settings match “' + esc(q) + '”.</div>';
  }
  function typeQuery(text) {
    var self = this, i = 0;
    if (this.instant) { this.setQuery(text, false); return; }
    (function tick() { self.setQuery(text.slice(0, ++i), true); if (i < text.length) self.later(70, tick); })();
  }
  // a worktree's checkbox: the row on the wash, and the bar at the bottom with what Delete takes
  function pick(i) {
    var r = this.trees.querySelectorAll('.wt-row')[i];
    r.classList.add('on');
    this.picked.push(i);
    var n = this.picked.length, sum = 0;
    this.picked.forEach(function (k) { sum += TREES[k][5]; });
    this.trees.querySelector('.wt-bar .kgb').textContent = 'Delete ' + folders(n) + ' · ' + bytes(sum);
    this.trees.querySelector('.wt-bar').classList.add('on');
    this.trees.querySelector('.wt-sel .clr').classList.add('on');
  }
  function hover(node) {
    this.surface.querySelectorAll('.hov').forEach(function (h) { h.classList.remove('hov'); });
    if (node) node.classList.add('hov');
  }

  function steps() {
    var self = this, R = {}, q = function (sel) { return self.surface.querySelector(sel); };
    var rows = function () { return self.trees.querySelectorAll('.wt-row'); };
    function measure() {
      var th = self.box(q('.kr.theme')), d = self.box(self.detail);
      R.rail = { x: 0, y: 0, w: 772, h: 524 };
      R.theme = { x: th.x - 60, y: th.y - 150, w: 772, h: 524 };
      R.list = { x: d.x - 14, y: 28, w: 772, h: 524 };
      R.bar = { x: d.x - 14, y: 760 - 524, w: 772, h: 524 };
    }
    return [
      [10, measure],
      [500, function () { self.cam(R.rail); self.pointAt(self.field, 0.45); }],
      // ⌘F: the hub's shortcut focuses the search wherever focus is inside Settings
      [900, function () { self.press(self.keyNames); self.setQuery('', true); }],
      [500, function () { self.release(); self.typeQuery('theme'); }],
      [900, function () { self.pointAt(q('.ss-results .hit'), 0.25); }],
      [500, function () { self.hover(q('.ss-results .hit')); }],
      // a result: its page at its row; a wide rail goes back to its rows. The page scrolls to the row and flashes it.
      [400, function () {
        self.click(); self.hover(null);
        self.setQuery('');
        self.showNav('General', false);
        self.cam(R.theme);
        var t = q('.kr.theme'); t.classList.add('lit');
        self.later(1500, function () { t.classList.remove('lit'); });
      }],
      [900, function () { self.pointAt(q('.kr.theme [data-o="Light"]')); }],
      // choosing here repaints the app (General: SettingsKeys.APPEARANCE through UiPrefs)
      [800, function () {
        self.click();
        q('.kr.theme .ko .on').classList.remove('on');
        q('.kr.theme [data-o="Light"]').classList.add('on');
        self.surface.classList.add('light');
      }],
      [1300, function () { self.cam(R.rail); self.pointAt(self.field, 0.45); }],
      [800, function () { self.click(); self.setQuery('', true); }],
      [300, function () { self.typeQuery('worktrees'); }],
      [1000, function () { self.pointAt(q('.ss-results .hit'), 0.3); }],
      [500, function () { self.hover(q('.ss-results .hit')); }],
      // Chat worktrees is the machine page's sub-page: the machine's card is the rail's selection
      [400, function () {
        self.click(); self.hover(null);
        self.setQuery('');
        self.showNav(null, true);
        self.general.classList.remove('on');
        self.trees.classList.add('on');
        self.cam(R.list);
      }],
      [1000, function () { self.pointAt(rows()[PICKS[0]].querySelector('.kcb')); }],
      [400, function () { self.hover(rows()[PICKS[0]]); }],
      [400, function () { self.click(); self.pick(PICKS[0]); }],
      [800, function () { self.pointAt(rows()[PICKS[1]].querySelector('.kcb')); }],
      [400, function () { self.hover(rows()[PICKS[1]]); }],
      [400, function () { self.click(); self.pick(PICKS[1]); }],
      [700, function () { self.hover(null); self.cam(R.bar); self.pointAt(q('.wt-bar .kgb'), 0.6); }],
      [600, function () { self.hover(q('.wt-bar .kgb')); }],
      [2200, function () { self.hover(null); self.cam(null); }]
    ];
  }
  var SettingsScene = K.extend(compose, steps, { showNav: showNav, setQuery: setQuery, typeQuery: typeQuery, pick: pick, hover: hover, start: [700, 470] });
  window.SupermuxSettingsScene = SettingsScene;
  K.define('settings', SettingsScene);
})();

</script>
