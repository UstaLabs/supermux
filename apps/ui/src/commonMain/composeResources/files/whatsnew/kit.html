<style>/* app/app.css */
/* The supermux desktop app (v0.17.5), rebuilt in HTML. Every value comes from the app's source:
   palette apps/shared/.../ui/Theme.kt, roles ui/theme/SupermuxTheme.kt, type ui/theme/Type.kt
   (desktop scale), spacing ui/theme/Tokens.kt, and the composables named beside each block.
   Sizes are CSS px = dp. Colours are the hex the app's own OKLCH conversion produces. */

.sm-app {
  --bg: #080A07;
  --fg: #EAECE6;            /* onSurface */
  --fg-var: #969A8E;        /* onSurfaceVariant */
  --primary: #4BBAA7;
  --error: #FF6F6B;
  --success: #53BE70;
  --warning: #EBB25F;
  --outline: #272A25;
  --outline-var: #171915;
  --sc-lowest: #040503;
  --sc-low: #0B0D09;        /* chat panel, tab strip */
  --sc: #10120F;            /* surfaceContainer */
  --sc-high: #161814;       /* sidebar */
  --sc-highest: #1E201C;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --code: "JetBrains Mono", "Geist Mono", ui-monospace, monospace;
  position: relative;
  display: flex;
  overflow: hidden;
  color: var(--fg);
  background: var(--sc-low);
  font: 400 14px/20px var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  cursor: default;
}
.sm-app svg { display: block; fill: currentColor; flex: none; }
/* desktop: the frame every pane's sheet sits in, the sidebar's tone (PaneHost) */
.sm-app:not(.phone) { background: var(--sc-high); }
.sm-app .ib { display: grid; place-items: center; flex: none; color: var(--fg-var); }

/* ── sidebar (SessionListScreen, AgentsBlock, WorkspaceRow, PathGroupHeader) ───────── */
/* Texts that set only a size keep the type scale's 20dp line (bodyLarge), as in the app. */
.sm-side { width: 320px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--sc-high); }
.sm-list { flex: 1; min-height: 0; overflow: hidden; padding-bottom: 8px; }
/* SidebarBandToggle: a 44dp band, the MenuOpen toggle (17dp) centred over the rail's 52dp column */
.sm-band { flex: none; height: 44px; display: flex; align-items: center; }
.sm-band .ib { width: 52px; height: 34px; }
.sm-band .ib svg { width: 17px; height: 17px; }
.sm-new { margin: 4px 12px 4px; padding: 12px; gap: 12px; display: flex; align-items: center; border-radius: 12px; background: var(--sc); }
.sm-new-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklab, var(--primary) 12%, transparent); color: var(--primary); }
.sm-new-icon svg { width: 18px; height: 18px; }
.sm-new div b { display: block; font-size: 14px; line-height: 20px; font-weight: 500; }
/* NewSessionListRow: two plain Texts, each on the type scale's 20dp line, no spacer between them */
.sm-new div span { display: block; font-size: 11px; line-height: 20px; color: var(--fg-var); }
/* the Agents and Workspaces headers: a title, then 28dp icon buttons */
.sm-shead { display: flex; align-items: center; padding: 10px 4px 4px 14px; font-size: 11px; line-height: 14px; font-weight: 500; color: var(--fg-var); }
.sm-shead .h { flex: 1; }
.sm-shead .wait { margin-right: 4px; font: 400 11px/14px var(--mono); color: var(--primary); }
.sm-shead .ib { width: 28px; height: 28px; }
.sm-shead .ib svg { width: 15px; height: 15px; }
.sm-shead .ib.add svg { width: 16px; height: 16px; }
.sm-shead .ib.on { color: var(--primary); }
.sm-agents { padding-bottom: 6px; }
.sm-agent { display: flex; align-items: center; box-sizing: border-box; min-height: 44px; margin: 0 8px; padding: 5px 10px 5px 6px; border-radius: 7px; }
.sm-agent.on { background: color-mix(in oklab, var(--fg) 8%, transparent); }
.sm-agent .av { width: 30px; height: 30px; flex: none; }
.sm-agent .av svg { display: block; overflow: visible; }
.sm-agent .tx { flex: 1; min-width: 0; margin-left: 10px; }
.sm-agent .t { display: flex; align-items: center; height: 20px; }
.sm-agent .t b { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; font-weight: 500; color: color-mix(in oklab, var(--fg) 88%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-agent.on .t b, .sm-agent.unread .t b { font-weight: 600; color: var(--fg); }
.sm-agent time { margin-left: 6px; font: 400 10.5px/20px var(--mono); color: color-mix(in oklab, var(--fg-var) 60%, transparent); }
.sm-agent time:empty { display: none; }
.sm-agent .dot { width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--primary); flex: none; }
.sm-agent:not(.unread) .dot { display: none; }
.sm-agent .pv { margin-top: 1px; font-size: 11.5px; line-height: 20px; color: color-mix(in oklab, var(--fg-var) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-agent.unread .pv { color: color-mix(in oklab, var(--fg) 75%, transparent); }
.sm-agent.working .pv { color: var(--primary); }
/* the status view's section labels ("Active", "Everything else") */
.sm-slabel { display: flex; align-items: center; padding: 14px 18px 4px 16px; font-size: 10.5px; line-height: 14px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: color-mix(in oklab, var(--fg-var) 70%, transparent); }
.sm-slabel span:first-child { flex: 1; }
.sm-slabel .n { font: 400 10.5px/14px var(--mono); letter-spacing: 0; }
.sm-slabel.acc { color: var(--primary); }
/* a project: arrow, folder, name, the workspace count (the menu only shows on hover) */
.sm-proj { display: flex; align-items: center; min-height: 30px; padding: 6px 18px 2px 6px; box-sizing: border-box; color: color-mix(in oklab, var(--fg-var) 70%, transparent); }
.sm-proj > svg, .sm-proj .fo svg { width: 14px; height: 14px; }
.sm-proj .fo { width: 14px; height: 14px; margin-left: 2px; }
.sm-proj .nm { flex: 1; min-width: 0; margin-left: 9px; font-size: 12.5px; line-height: 20px; font-weight: 500; color: color-mix(in oklab, var(--fg) 85%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-proj .n { margin-left: 26px; font: 400 10.5px/20px var(--mono); }
.sm-proj .n.new { font: 500 10.5px/20px var(--sans); color: color-mix(in oklab, var(--fg) 75%, transparent); }
/* a workspace: the status mark, the name and the time, then the branch in mono */
.sm-wrow { display: flex; align-items: flex-start; margin: 1px 8px; padding: 6px 10px 6px 14px; border-radius: 7px; }
.sm-wrow.sel { background: color-mix(in oklab, var(--fg) 7.5%, transparent); }
.sm-wrow > .sm-mark { margin-top: 3px; }
.sm-wrow .tx { flex: 1; min-width: 0; margin-left: 9px; }
.sm-wrow .t { display: flex; align-items: center; }
.sm-wrow .t b { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; font-weight: 400; color: var(--fg-var); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-wrow.sel .t b, .sm-wrow.unread .t b { font-weight: 600; color: var(--fg); }
.sm-wrow time { margin-left: 8px; font: 400 10.5px/20px var(--mono); color: color-mix(in oklab, var(--fg-var) 60%, transparent); }
.sm-wrow .br { margin-top: 1px; font: 400 10.5px/20px var(--mono); color: color-mix(in oklab, var(--fg-var) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-mark { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
.sm-ring { width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; border: 1.25px solid color-mix(in oklab, var(--fg-var) 35%, transparent); }
.sm-eye { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 1.25px solid color-mix(in oklab, var(--fg) 55%, transparent); display: grid; place-items: center; }
.sm-eye::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }
/* a multi-agent workspace lists its chats underneath: a hairline guide, the same mark, smaller type */
.sm-kids { padding: 0 8px 0 20px; }
.sm-kid { display: flex; align-items: center; min-height: 26px; padding: 0 8px; font-size: 12px; line-height: 20px; color: var(--fg-var); white-space: nowrap; overflow: hidden; }
.sm-kid .g { align-self: stretch; width: 1px; margin-right: 10px; background: color-mix(in oklab, var(--fg-var) 15%, transparent); flex: none; }
.sm-kid .sm-mark { margin-right: 7px; }
.sm-kid span:last-child { overflow: hidden; text-overflow: ellipsis; }
/* "Archived · N": the archive glyph in the status-mark column */
.sm-arch { display: flex; align-items: center; min-height: 30px; margin: 1px 8px; padding: 0 10px 0 14px; font-size: 12.5px; line-height: 20px; color: color-mix(in oklab, var(--fg-var) 60%, transparent); }
.sm-arch svg { width: 14px; height: 14px; flex: none; }
.sm-arch span:first-of-type { flex: 1; margin-left: 9px; }
.sm-arch .n { font: 400 10.5px/20px var(--mono); }

.sm-host { flex: none; display: flex; align-items: center; gap: 0; margin: 0 6px 6px; padding: 4px; border-radius: 10px; background: var(--sc-low); }
.sm-host .pill { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 500; }
/* the host's identity dot (FleetModel.hostDotArgb, dark): the recording's host hashes to slot 5, hue 150 */
.sm-host .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: oklch(0.74 0.135 150); }
.sm-host .pill svg { width: 16px; height: 16px; color: var(--fg-var); }
.sm-host .sp { flex: 1; }
.sm-host .ib { width: 30px; height: 30px; }
.sm-host .ib svg { width: 15px; height: 15px; }

/* the app's CircularProgressIndicator: an arc that turns */
.sm-spin { width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 1.75px solid color-mix(in oklab, var(--primary) 18%, transparent); border-top-color: var(--primary); border-right-color: var(--primary); animation: sm-turn .9s linear infinite; }
@keyframes sm-turn { to { transform: rotate(360deg); } }

/* ── workspace: the layout tree (PaneHost, GroupHost) ───────────────── */
/* half of every gutter around the tree, half around each pane: 6dp at the frame's edges and
   between two panes; each pane is its 32dp tab strip over a sheet with 10dp corners */
.sm-work { position: relative; flex: 1; min-width: 0; display: grid; padding: 0 3px; }
.sm-work.split-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

.sm-pane { --sheet: var(--sc-low); position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--sc-low); }
.sm-app:not(.phone) .sm-pane:not(.phone) { padding: 0 3px; background: transparent; }
.sm-sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 6px; border-radius: 0 10px 10px 10px; overflow: hidden; background: var(--sheet); }
/* PaneTabStrip: the active tab is 28dp tall from the strip's 4dp inset, 9dp top corners, with an 8dp
   concave flare into the sheet on its far side; a lone tab takes 200dp (the strip's share, 112–200dp) */
.sm-tabs { flex: none; height: 32px; display: flex; align-items: stretch; }
.sm-tab { position: relative; flex: none; width: 200px; box-sizing: border-box; margin-top: 4px; display: flex; align-items: center; padding: 0 6px 0 11px; border-radius: 9px 9px 0 0; background: var(--sheet); color: var(--fg); font: 500 12px/20px var(--sans); white-space: nowrap; }
.sm-tab::after { content: ""; position: absolute; left: 100%; bottom: 0; width: 8px; height: 8px; background: radial-gradient(circle at 100% 0, transparent 7.5px, var(--sheet) 8px); }
.sm-tab .ic { width: 16px; height: 16px; margin-right: 7px; flex: none; display: grid; place-items: center; color: var(--fg); }
.sm-tab .ic svg { width: 15px; height: 15px; }
/* a chat's tab wears its agent's mark at 14dp, untiled (#EDEDED; Claude's own orange) */
.sm-tab .ic.ag { color: #EDEDED; }
.sm-tab .ic.ag svg { width: 14px; height: 14px; }
.sm-tab .ti { flex: 1; min-width: 0; overflow: hidden; }
.sm-tab .ti.clip { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); }
.sm-tab .pv { width: 16px; height: 16px; margin-left: 4px; flex: none; display: grid; place-items: center; color: var(--fg-var); }
.sm-tab .pv svg { width: 12px; height: 12px; }
.sm-tab .x { width: 16px; height: 16px; margin-left: 6px; flex: none; display: grid; place-items: center; color: var(--fg-var); }
.sm-tab .x svg { width: 11px; height: 11px; }
.sm-tabs .add { width: 36px; margin-top: 4px; display: grid; place-items: center; color: var(--fg-var); }
.sm-tabs .add svg { width: 16px; height: 16px; }

/* ChatPanel header: one 44dp line, the project crumb then the session, its live status after it */
.sm-crumb { position: relative; z-index: 1; flex: none; height: 44px; display: flex; align-items: center; padding: 0 8px 0 16px; font-size: 13px; line-height: 20px; white-space: nowrap; }
.sm-crumb::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 28px; pointer-events: none;
  background: linear-gradient(var(--sheet) 0%, color-mix(in oklab, var(--sheet) 72%, transparent) 45%, color-mix(in oklab, var(--sheet) 28%, transparent) 75%, transparent); }
.sm-crumb .fold svg { width: 14px; height: 14px; color: var(--fg-var); }
.sm-crumb .dir { margin-left: 6px; color: var(--fg-var); overflow: hidden; text-overflow: ellipsis; }
.sm-crumb .sl { padding: 0 7px; color: var(--outline); }
.sm-crumb .ti { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.sm-crumb .busy { display: none; align-items: center; margin-left: 8px; font: 400 11px/14px var(--mono); color: var(--fg-var); }
.sm-crumb .busy i { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); flex: none; }
.sm-crumb .busy .w { margin-left: 6px; }
.sm-pane.working .sm-crumb .busy { display: flex; }
.sm-crumb .sp { flex: 1; min-width: 8px; }
.sm-crumb .ib { width: 32px; height: 32px; }
.sm-crumb .ib svg { width: 17px; height: 17px; }
.sm-crumb .ib:last-child { width: 48px; height: 48px; }
.sm-crumb .ib:last-child svg { width: 18px; height: 18px; }
.sm-pane.n560 .sm-crumb .fold, .sm-pane.n560 .sm-crumb .dir, .sm-pane.n560 .sm-crumb .sl { display: none; }
.sm-pane.n460 .sm-crumb .busy .w { display: none; }

/* transcript (Timeline) */
.sm-chat { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; position: relative; }
.sm-chat-in { max-width: 860px; margin: 0 auto; padding: 12px 16px 12px; }
.sm-chat-in > * { animation: sm-in .26s ease-out both; }
@keyframes sm-in { from { opacity: 0; } }
.sm-user { display: flex; justify-content: flex-end; padding: 8px 0; }
.sm-user div { max-width: 75%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: color-mix(in oklab, var(--sc) 92%, transparent); border: 1px solid var(--outline-var); font-size: 13px; line-height: 18px; white-space: pre-wrap; }
.sm-asst { padding: 8px 0 0; font-size: 14px; line-height: 20px; }
.sm-asst p { margin: 0 0 8px; }
.sm-asst ul, .sm-asst ol { margin: 0 0 8px; padding: 0 0 0 30px; list-style: none; }
.sm-asst ol { counter-reset: sm-ol; }
.sm-asst li { position: relative; margin: 0 0 4px; }
.sm-asst li > ul { margin: 4px 0 0; }
.sm-asst li li::before { background: transparent; border: 1px solid var(--primary); width: 3px; height: 3px; }
.sm-asst ul > li::before { content: ""; position: absolute; left: -12px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--primary); }
.sm-asst ol > li { counter-increment: sm-ol; }
.sm-asst ol > li::before { content: counter(sm-ol) "."; position: absolute; left: -22px; width: 18px; text-align: right; color: var(--primary); }
.sm-asst strong { font-weight: 600; }
.sm-asst code { font: 400 0.9em/1 var(--mono); background: color-mix(in oklab, var(--fg) 8%, transparent); }
.sm-asst a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.sm-asst pre { position: relative; margin: 4px 0 10px; padding: 6px 36px 6px 20px; border-left: 2px solid color-mix(in oklab, var(--primary) 45%, transparent); font: 400 12px/18px var(--code); font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; white-space: pre; overflow: hidden; }
/* a GFM table (MarkdownTable): a 1dp outlineVariant grid with 8dp corners, the header row on
   surfaceContainerLow in SemiBold, 12×8dp cells in bodyMedium (13/18; 14/20 on a phone) */
.sm-mdtable { margin: 4px 0 10px; overflow-x: auto; scrollbar-width: none; }
.sm-mdtable::-webkit-scrollbar { display: none; }
.sm-mdtable table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--outline-var); border-radius: 8px; font: 400 13px/18px var(--sans); }
.sm-mdtable th, .sm-mdtable td { padding: 8px 12px; text-align: left; vertical-align: top; border: 0 solid var(--outline-var); border-width: 0 1px 1px 0; }
.sm-mdtable th { font-weight: 600; background: var(--sc-low); }
.sm-mdtable th:first-child { border-top-left-radius: 7px; }
.sm-mdtable th:last-child { border-top-right-radius: 7px; }
.sm-mdtable tr > :last-child { border-right-width: 0; }
.sm-mdtable tbody tr:last-child > * { border-bottom-width: 0; }
.sm-mdtable th > div, .sm-mdtable td > div { width: max-content; max-width: 280px; }
.sm-pane.phone .sm-mdtable table { font-size: 14px; line-height: 20px; }
.sm-asst pre svg { position: absolute; right: 6px; top: 6px; width: 16px; height: 16px; color: var(--fg-var); }
/* a think, drawn without its text: ReasoningCard's spinner row (a 12dp spinner, "Thinking…" in labelMedium) */
.sm-think { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--fg-var); font-size: 11px; line-height: 16px; font-weight: 500; }
.sm-think .sp { width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--fg-var); border-right-color: var(--fg-var); animation: sm-turn .9s linear infinite; flex: none; }
.sm-pane.phone .sm-think { font-size: 12px; }
/* the reply while it is written has no time and copy row yet */
.sm-asst.live { padding-bottom: 8px; }
.sm-meta { display: flex; align-items: center; gap: 2px; margin-top: 4px; padding-bottom: 8px; }
.sm-meta span { font: 500 11px/14px var(--mono); color: color-mix(in oklab, var(--fg-var) 55%, transparent); margin-right: 4px; }
.sm-meta i { width: 28px; height: 28px; display: grid; place-items: center; color: color-mix(in oklab, var(--fg-var) 65%, transparent); }
.sm-meta i svg { width: 14px; height: 14px; }

/* ── ToolCallGroup (ToolCall.kt, uiarc's neutral dark tokens): a 16dp card, a 40dp head of ringed
   marks + "Using/Used N tools", the calls underneath while the run is live ──────────────────── */
.sm-tg { --tc-fg: #F2F2F2; --tc-surface: #191919; --tc-muted: #242424; --tc-border: #2B2B2B; --tc-text2: #B4B4B4; --tc-text3: #8C8C8C;
  margin: 4px 0; border-radius: 16px; background: var(--tc-surface); border: 1px solid var(--tc-border); overflow: hidden; letter-spacing: -.14px; }
.sm-tg-h { display: flex; align-items: center; min-height: 40px; margin: 3px; padding: 0 12px; border-radius: 12px; cursor: pointer; }
.sm-tg-h .mk { display: flex; align-items: center; flex: none; }
.sm-tg-h .mk i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--tc-surface); box-shadow: 0 0 0 1px var(--tc-border), 0 0 0 2px var(--tc-surface); color: var(--tc-fg); margin-left: -4px; }
.sm-tg-h .mk i:first-child { margin-left: -2px; }
.sm-tg-h .mk i svg { width: 12px; height: 12px; }
.sm-tg-h .mk em { margin-left: 6px; font-style: normal; font-size: 12px; color: var(--tc-text3); }
.sm-tg-h .tt { flex: 1; min-width: 0; margin-left: 10px; font-size: 14px; line-height: 20px; color: var(--tc-text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-tg-h .mt { margin-left: 10px; font-size: 12px; line-height: 16.8px; color: var(--tc-text3); }
.sm-tg-h .mt.bad { color: color-mix(in srgb, #FF736D 85%, var(--tc-text2)); }
.sm-tg-h .mt:empty { display: none; }
.sm-tg .cv { margin-left: 10px; width: 16px; height: 16px; flex: none; color: var(--tc-text3); transition: transform .5s cubic-bezier(.22, 1, .36, 1); }
.sm-tg .cv svg { width: 16px; height: 16px; }
.sm-tg.open > .sm-tg-h .cv { transform: rotate(180deg); }
.sm-tg-w { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.22, 1, .36, 1); }
.sm-tg.open > .sm-tg-w { grid-template-rows: 1fr; }
.sm-tg-b { min-height: 0; overflow: hidden; }
.sm-tg.still .sm-tg-w, .sm-tg.still .cv { transition: none; }
.sm-tg.open .sm-tg-b { border-top: 1px solid var(--tc-border); margin-top: 1px; padding: 3px; }
.sm-call { display: flex; align-items: center; min-height: 40px; padding: 6px 12px; box-sizing: border-box; border-radius: 12px; }
.sm-call .g { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--tc-fg); }
.sm-call .g svg { width: 16px; height: 16px; }
.sm-call .tt { flex: 1; min-width: 0; margin-left: 10px; font-size: 14px; line-height: 20px; color: var(--tc-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-call .tt.mono { font: 400 12.5px/20px var(--mono); letter-spacing: 0; }
.sm-call .st { width: 16px; height: 16px; flex: none; margin-left: 10px; display: grid; place-items: center; }
.sm-call .sum { flex: none; margin-left: 10px; font-size: 12px; line-height: 16.8px; color: var(--tc-text3); white-space: nowrap; }
.sm-pane.n460 .sm-call .sum { display: none; }
.sm-call.plan .tt { color: var(--tc-text2); }
.sm-call.plan .g { color: var(--tc-text3); }
.lt { width: 88%; height: 88%; border-radius: 24%; display: grid; place-items: center; background: var(--tc-fg); color: var(--tc-surface); font-size: 56%; font-weight: 700; line-height: 1; font-style: normal; }
.sm-tg-h .mk i .lt { width: 10.5px; height: 10.5px; font-size: 6.7px; }
.sm-call .g .lt { width: 14px; height: 14px; font-size: 9px; }
.sm-call .st svg { width: 16px; height: 16px; fill: none; }
.sm-call .st .spin { width: 14px; height: 14px; stroke: var(--tc-text3); stroke-width: 1.4; stroke-linecap: round; animation: sm-turn .8s linear infinite; }
.sm-call .st .ok { stroke: #4CD676; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sm-draw .3s .04s cubic-bezier(.22, 1, .36, 1) forwards; }
.sm-call .st .bad { stroke: #FF736D; stroke-width: 2; stroke-linecap: round; }
@keyframes sm-draw { to { stroke-dashoffset: 0; } }
/* the text shimmer: a muted base and a 4.4em band of the full colour sweeping in 1.8s, resting .6s */
@property --sm-sh { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
.shim { --c: var(--tc-text2); --b: color-mix(in srgb, var(--tc-text3) 88%, var(--c));
  color: transparent; -webkit-background-clip: text; background-clip: text; animation: sm-shim 2.4s linear infinite;
  background-image: linear-gradient(90deg, var(--b) 0, var(--b) calc(var(--sm-sh) - 2.2em), color-mix(in srgb, var(--b), var(--c)) calc(var(--sm-sh) - 1.1em), color-mix(in srgb, var(--b) 10%, var(--c)) calc(var(--sm-sh) - .44em), var(--c) var(--sm-sh), color-mix(in srgb, var(--b) 10%, var(--c)) calc(var(--sm-sh) + .44em), color-mix(in srgb, var(--b), var(--c)) calc(var(--sm-sh) + 1.1em), var(--b) calc(var(--sm-sh) + 2.2em), var(--b) 100%); }
.sm-call.run .tt { --c: var(--tc-fg); }

   bar 38dp, 26dp address pill (7dp corners) with the preview dot, 16dp one-stroke glyphs (settings/kit/KitGlyphs.kt),
   the pick strip (28dp, accent 12%), the hover box (2dp accent border, 10% fill, label above), the comment panel
   (chrome, hairline, 10dp padding), the 18dp pin and the 36dp send bar. Used by app/browser-scene.js. */
[data-scene="browser"] { position: relative; overflow: hidden; }
.sm-browser .sm-sheet { background: var(--sc-low); }
.sm-bbar { flex: none; height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 8px; }
.sm-bbar .gb { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--fg-var); flex: none; transition: background .15s, color .15s; }
.sm-bbar .gb.off { color: color-mix(in oklab, var(--fg-var) 45%, transparent); }
.sm-bbar .gb.on { color: var(--primary); background: color-mix(in oklab, var(--fg) 6%, transparent); }
.sm-bbar .gb.press { background: color-mix(in oklab, var(--fg) 10%, transparent); }
.sm-bbar svg.kg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sm-bbar .addr { flex: 1; min-width: 0; margin: 0 6px; height: 26px; border-radius: 7px; background: color-mix(in oklab, var(--fg) 6%, transparent); display: flex; align-items: center; gap: 7px; padding: 0 9px; font-size: 12.5px; color: var(--fg); white-space: nowrap; overflow: hidden; }
.sm-bbar .addr i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex: none; }
.sm-bline { flex: none; height: 1px; background: var(--outline-var); }
.sm-pstrip { flex: none; height: 0; overflow: hidden; display: flex; align-items: center; padding: 0 12px; background: color-mix(in oklab, var(--primary) 12%, transparent); font-size: 12px; color: var(--fg); transition: height .18s; }
.sm-pstrip.on { height: 28px; }
.sm-viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #fff; }
/* the page: the demo store from the recording, after the change (src/App.jsx) */
.sm-page { position: absolute; inset: 0; padding: 26px 30px; color: #1b1b1b; font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
.sm-page h1 { font-size: 30px; margin: 0 0 14px; font-weight: 700; }
.sm-page .srch { display: block; width: 220px; height: 30px; border: 1px solid #8f8f8f; border-radius: 2px; padding: 0 6px; font-size: 13.5px; color: #767676; line-height: 28px; margin-bottom: 14px; transition: width .5s; }
.sm-page .grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.sm-page .grid span { border: 1px solid #767676; background: #efefef; border-radius: 3px; padding: 2px 8px; font-size: 13.5px; }
.sm-page h2 { font-size: 21px; margin: 0 0 6px; }
.sm-page p { margin: 0; font-size: 14px; }
.sm-hover { position: absolute; box-sizing: border-box; border: 2px solid var(--primary); border-radius: 2px; background: color-mix(in oklab, var(--primary) 10%, transparent); pointer-events: none; opacity: 0; transition: left .18s, top .18s, width .18s, height .18s, opacity .12s; }
.sm-hover.on { opacity: 1; }
.sm-hover b { position: absolute; left: -2px; top: -22px; background: var(--primary); color: #06110E; font: 400 11px/15px var(--sans); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.sm-cpanel { position: absolute; box-sizing: border-box; width: 280px; background: var(--sc); border: 1px solid var(--outline); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.45); opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; pointer-events: none; }
.sm-cpanel.on { opacity: 1; transform: none; }
.sm-cpanel .hd { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--fg-var); }
.sm-cpanel .hd .n { background: var(--primary); color: #06110E; border-radius: 9px; font-size: 11px; padding: 0 6px; line-height: 16px; }
.sm-cpanel .hd .sp { flex: 1; }
.sm-cpanel .hd svg.kg { width: 14px; height: 14px; fill: none; stroke: var(--fg-var); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sm-cpanel .f { min-height: 44px; border-radius: 6px; background: color-mix(in oklab, var(--fg) 6%, transparent); padding: 8px; font-size: 13px; color: var(--fg); }
.sm-cpanel .f .ph { color: color-mix(in oklab, var(--fg-var) 70%, transparent); }
.sm-cpanel .f .caret { display: inline-block; width: 1.5px; height: 14px; background: var(--primary); vertical-align: -2px; margin-left: 1px; }
.sm-pin { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #06110E; font: 500 11px/18px var(--sans); text-align: center; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.sm-pin.on { opacity: 1; transform: none; }
.sm-sendbar { flex: none; height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--sc); transition: height .18s; }
.sm-sendbar.on { height: 37px; }
.sm-sendbar .row { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: var(--fg); border-top: 1px solid var(--outline-var); }
.sm-sendbar .row .t { flex: 1; white-space: nowrap; overflow: hidden; }
.sm-sendbar .row .a { color: var(--primary); font-size: 13px; }
.sm-sendbar .row .send { height: 26px; border-radius: 6px; background: var(--primary); color: #06110E; padding: 0 12px; display: grid; place-items: center; transition: filter .15s; }
.sm-sendbar .row .send.press { filter: brightness(1.15); }
/* the comments as the chat gets them: the cropped picture, then the message */
.sm-user .sm-shot { display: block; width: 180px; height: 70px; border-radius: 8px; margin: 0 0 6px auto; background: #fff; border: 1px solid var(--outline-var); position: relative; overflow: hidden; }
.sm-user .sm-shot i { position: absolute; left: 14px; top: 22px; width: 150px; height: 26px; border: 1.5px solid var(--primary); border-radius: 1px; }
.sm-user .sm-shot u { position: absolute; left: 8px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.sm-user .sm-shot em { position: absolute; left: 18px; top: 26px; font: 12px/18px -apple-system, system-ui, sans-serif; color: #767676; font-style: normal; }

@media (prefers-reduced-motion: reduce) { .sm-hover, .sm-cpanel, .sm-pin, .sm-pstrip, .sm-sendbar { transition: none !important; } }

</style>
<style>/* app/device-scene.css */
/* The Browser tab's device mode (#122 phase 2), rebuilt from ui/browser/BrowserDevice.kt in the kit's tokens, over
   app/browser-scene.css's bar and page: the device bar (34dp row, 8dp sides, 6dp gaps, its hairline), the device as a
   12.5sp label with a 13dp chevron, the sizes as 54dp fields (5dp corners, wash), the 12sp choices with 12dp chevrons,
   a 1×16 divider; the stage (the pane's background, the page in a hairline with 1dp inside); the device menu as
   widgets/Menus.kt MenuStyle draws a menu (10dp corners, surfaceContainerHigh, hairline, 28dp rows inset 5dp, 13sp,
   the hovered row in the accent). Used by app/device-scene.js. */
[data-scene="device"] { position: relative; overflow: hidden; }
.sm-device .sm-bbar .gb.dev.on { color: var(--primary); background: color-mix(in oklab, var(--fg) 6%, transparent); }
.sm-device svg.kg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* the device bar, under the toolbar's hairline */
.sm-dbar { flex: none; display: none; }
.sm-dbar.on { display: block; }
.sm-dbar .row { overflow: hidden; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--outline-var); white-space: nowrap; }
.sm-dbar .dp, .sm-dbar .dc { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; flex: none; }
.sm-dbar .dp b { font-weight: 400; font-size: 12.5px; line-height: 17px; color: var(--fg); }
.sm-dbar .dp svg { width: 13px; height: 13px; color: var(--fg-var); }
.sm-dbar .dc b { font-weight: 400; font-size: 12px; line-height: 16px; color: var(--fg-var); }
.sm-dbar .dc svg { width: 12px; height: 12px; color: color-mix(in oklab, var(--fg-var) 70%, transparent); }
.sm-dbar .sf { box-sizing: border-box; width: 54px; min-height: 22px; padding: 3px 4px; border-radius: 5px; flex: none; background: color-mix(in oklab, var(--fg) 6%, transparent); border: 1px solid transparent; font-size: 12px; line-height: 14px; color: var(--fg); text-align: center; }
.sm-dbar .x { font-size: 12px; color: color-mix(in oklab, var(--fg-var) 70%, transparent); flex: none; }
.sm-dbar .gb { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--fg-var); flex: none; }
.sm-dbar .gb svg { width: 16px; height: 16px; }
.sm-dbar .dv { width: 1px; height: 16px; margin: 0 2px; background: var(--outline-var); flex: none; }
.sm-dbar .sp { flex: 1; min-width: 0; }

/* the stage: the page at the device's size, fitted and centred on the pane's background */
.sm-device .sm-viewport.dev { background: var(--bg); }
.sm-dframe { position: absolute; inset: 0; overflow: hidden; }
.sm-viewport.dev .sm-dframe { inset: auto; box-sizing: border-box; border: 1px solid var(--outline-var); }
.sm-device .sm-page { background: #fff; }
.sm-viewport.dev .sm-page { inset: auto; left: 1px; top: 1px; box-sizing: border-box; transform-origin: 0 0; }

/* the device menu */
.sm-dmenu { position: absolute; z-index: 20; min-width: 112px; padding: 8px 0; box-sizing: border-box; border-radius: 10px; background: var(--sc-high); border: 1px solid var(--outline-var); box-shadow: 0 10px 32px rgba(0,0,0,.5); display: none; }
.sm-dmenu.on { display: block; }
.sm-dmenu .mr { margin: 1px 5px; height: 28px; padding: 0 9px; border-radius: 6px; display: flex; align-items: center; font-size: 13px; color: var(--fg); white-space: nowrap; }
.sm-dmenu .mr .ck { width: 15px; height: 15px; margin-right: 8px; flex: none; visibility: hidden; }
.sm-dmenu .mr.chosen .ck { visibility: visible; }
.sm-dmenu .mr .ck svg { display: block; width: 15px; height: 15px; }
.sm-dmenu .mr .nm { flex: 1; }
.sm-dmenu .mr .sz { margin-left: 16px; font-size: 11.5px; color: color-mix(in oklab, var(--fg-var) 70%, transparent); }
.sm-dmenu .mr.hov { background: var(--primary); color: #06110E; }
.sm-dmenu .mg { padding: 8px 0 2px 14px; font-size: 11px; line-height: 15px; color: color-mix(in oklab, var(--fg-var) 70%, transparent); }
/* a pane too narrow for the whole row: the spacer gives way, then close is squeezed inside the padding, as a Row does */
.sm-dbar .gb.cl { flex: 0 1 28px; min-width: 0; overflow: hidden; }

</style>
<style>/* app/cards-scene.css */
/* An agent's HTML card in the chat (ui/chat/HtmlCard.kt HtmlCardView), for app/cards-scene.js: the card's title in
   labelLarge (14 sp medium) in onSurfaceVariant, 4 dp above its page; the page sits on the chat with no frame of its
   own and takes the app's theme as --sm-* variables (here the kit's tokens). The page itself is the agent's own HTML. */
.sm-hcard { padding: 8px 0 4px; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
.sm-hcard.in { opacity: 1; transform: none; }
.sm-hcard .ht { font: 500 14px/20px var(--sans); color: var(--fg-var); margin-bottom: 4px; }
.sm-hcard .pg { font-size: 13px; line-height: 19px; color: var(--fg); }
.sm-hcard .sum { margin-bottom: 8px; color: var(--fg-var); }
.sm-hcard .sum b { color: var(--fg); font-weight: 600; }
.sm-hcard .rw { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--outline-var); }
.sm-hcard .rw i { font-style: normal; color: var(--success); width: 12px; flex: none; }
.sm-hcard .bt { display: flex; gap: 8px; margin-top: 10px; }
.sm-hcard .bt span { height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline); display: grid; place-items: center; font-weight: 500; transition: filter .15s; }
.sm-hcard .bt .pr { background: var(--primary); border-color: transparent; color: #06110E; }
.sm-hcard .bt .press { filter: brightness(1.15); }
.sm-user .from { display: block; font: 500 11px/16px var(--sans); color: var(--fg-var); margin-bottom: 2px; }
@media (prefers-reduced-motion: reduce) { .sm-hcard { transition: none !important; } }

</style>
<style>/* app/offline-scene.css */
/* Chats open at once, even offline (#121), for app/offline-scene.js. The connection strip is shell/ConnectionStrip.kt:
   12.5sp onSurfaceVariant on bodyLarge's 20dp line, an 8dp gap after a 7dp warning dot (offline) or an 11dp spinner
   (1.5dp, onSurfaceVariant; connecting). Above the list: surfaceVariant, 6×12dp padding, Retry in primary at the end,
   a 1dp outline hairline under it. Above the composer: no fill, a 1dp outline hairline over it, 4×12dp, centred.
   The line is chat/ChatPanel.kt NewMessagesLine: 8dp above and below, 1dp rules in primary at 45%, "N new messages"
   12sp SemiBold primary with 12dp either side; it leaves with fadeOut + shrinkVertically. */
[data-scene="offline"] { position: relative; overflow: hidden; }
.sm-conn { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--sc-highest); border-bottom: 1px solid var(--outline); font-size: 12.5px; line-height: 20px; color: var(--fg-var); white-space: nowrap; }
.sm-conn.in { justify-content: center; padding: 4px 12px; background: none; border-bottom: 0; border-top: 1px solid var(--outline); }
.sm-conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); flex: none; }
.sm-conn .spin { display: none; width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--fg-var); border-right-color: var(--fg-var); animation: sm-turn .9s linear infinite; flex: none; }
.sm-conn .tx { overflow: hidden; text-overflow: ellipsis; }
.sm-conn .retry { margin-left: auto; color: var(--primary); }
.sm-conn.connecting .dot, .sm-conn.connecting .retry { display: none; }
.sm-conn.connecting .spin { display: block; }
/* connected: the strip draws nothing (no exit animation in the app) */
.sm-conn.none { display: none; }
.sm-newline { display: flex; align-items: center; height: 36px; padding: 8px 0; box-sizing: border-box; overflow: hidden; transition: opacity .3s, height .35s .05s, padding .35s .05s; }
.sm-newline i { flex: 1; height: 1px; background: color-mix(in oklab, var(--primary) 45%, transparent); }
.sm-newline span { padding: 0 12px; font-size: 12px; line-height: 20px; font-weight: 600; color: var(--primary); white-space: nowrap; }
.sm-newline.seen { opacity: 0; height: 0; padding: 0; }
/* a chat opens from its saved copy in place: no row fades in */
.sm-offline .sm-chat-in > * { animation: none; }
@media (prefers-reduced-motion: reduce) { .sm-newline { transition: none !important; } }

</style>
<style>/* app/resume-scene.css */
/* A usage limit, waited out (#92), for app/resume-scene.js. The strip is ui/accounts/LimitWait.kt LimitWaitStrip in
   the kit's tokens: 8dp under it, 12dp corners (Radii.md), warning at 7% over a hairline of outlineVariant at 70%;
   12/4/8/8dp padding, 12dp gaps; the 17dp HourglassBottom in warning; the title 13sp medium onSurface over the detail
   12sp onSurfaceVariant (1dp apart, the type scale's 20dp lines); Cancel (onSurfaceVariant) and Resume now
   (onSurface) at 12.5sp in 48dp targets with 8dp sides. The Agent row's wait line is warning (AgentsBlock.kt). */
.sm-lwait { display: none; padding-bottom: 8px; }
.sm-lwait.on { display: block; animation: sm-in .26s ease-out both; }
.sm-lwait .in { display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 12px; border-radius: 12px; background: color-mix(in oklab, var(--warning) 7%, transparent); border: 1px solid color-mix(in oklab, var(--outline-var) 70%, transparent); }
.sm-lwait .hg { color: var(--warning); }
.sm-lwait .hg svg { width: 17px; height: 17px; }
.sm-lwait .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sm-lwait .t { font: 500 13px/20px var(--sans); color: var(--fg); }
.sm-lwait .d { font-size: 12px; line-height: 20px; color: var(--fg-var); }
.sm-lwait .a { min-width: 48px; height: 48px; box-sizing: border-box; padding: 0 8px; border-radius: 8px; display: grid; place-items: center; font-size: 12.5px; line-height: 20px; color: var(--fg-var); white-space: nowrap; }
.sm-lwait .a.now { color: var(--fg); }
.sm-agent.lwait .pv { color: var(--warning); }
/* the scene's own clock (not the app's), in the keycaps' dress, in the empty end of the tab strip: the host's time
   running on to the reset */
.sm-rclock { position: absolute; right: 10px; top: 4px; transform: translateY(-4px); z-index: 31; height: 24px; padding: 0 8px; border-radius: 5px; background: var(--sc-highest, #1E201C); border: 1px solid var(--outline, #272A25); border-bottom-width: 2px; color: var(--fg, #EAECE6); font: 500 12px/21px var(--mono, "Geist Mono", ui-monospace, monospace); font-variant-numeric: tabular-nums; box-shadow: 0 3px 10px rgba(0,0,0,.35); opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none; }
.sm-rclock.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .sm-lwait.on { animation: none; } .sm-rclock { transition: none !important; } }

</style>
<style>/* app/restart-scene.css */
/* Restart to update (#113), for app/restart-scene.js, in the kit's tokens at 1 dp = 1 px.
   The sidebar's update card (ui/update/AppUpdate.kt UpdateCardBody) and What's new's card after the update
   (ui/whatsnew/WhatsNewCard.kt WhatsNewCardBody), one shape: Space.sm around it, Radii.md corners, surfaceContainer
   with a hairline of onSurface 8%, padding 16 / 8 / 12 / 16 (start, end, top, bottom); the Redeem icon (18) and a
   15 sp medium title, a 32 dp dismiss with an 18 dp ✕ in onSurfaceVariant; 13/18 sp lines; 36 dp buttons with
   Radii.sm corners: an outlined "What's new" (hairline, onSurface 16%) and the inverse-ink one (onSurface on surface).
   It comes in as the card does: expandVertically from the bottom, with a fade. The notice is the desktop's snackbar
   (ui/platform/FlowNotices.kt NoticeOverlay, M3 Snackbar): inverseSurface, 4 dp corners, 48 dp, 16 dp in from the
   window's bottom edge, bodyMedium. */
[data-scene="restart"] { position: relative; overflow: hidden; }
.sm-restart.sm-app { background: var(--bg); }
/* the window, which quits and opens again */
.sm-rwin { flex: 1; min-width: 0; display: flex; background: var(--sc-high); transition: opacity .35s ease; }
.sm-rwin.off { opacity: 0; transition-duration: .3s; }
.sm-rwin .sm-work { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.sm-restart .sm-cursor.off { opacity: 0; transition: transform .6s cubic-bezier(.45,.05,.2,1), opacity .2s; }
.sm-restart .sm-cursor { transition: transform .6s cubic-bezier(.45,.05,.2,1), opacity .3s; }

/* the footer rail's card slot */
.sm-uslot { flex: none; display: flex; flex-direction: column; }
.sm-ucard { display: grid; grid-template-rows: 0fr; opacity: 0; overflow: hidden; transition: grid-template-rows .3s cubic-bezier(.2,0,0,1), opacity .3s; }
.sm-ucard.in { grid-template-rows: 1fr; opacity: 1; }
.sm-ucard .bx { min-height: 0; margin: 8px; padding: 12px 8px 16px 16px; border-radius: 12px; background: var(--sc); border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); }
.sm-ucard .hd { display: flex; align-items: center; }
.sm-ucard .hd > svg { width: 18px; height: 18px; color: var(--fg); }
.sm-ucard .hd .t { flex: 1; min-width: 0; margin-left: 10px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-ucard .hd .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--fg-var); }
.sm-ucard .hd .x svg { width: 18px; height: 18px; }
.sm-ucard .bd { margin-top: 8px; padding-right: 8px; }
.sm-ucard .v { font-size: 13px; line-height: 18px; color: var(--fg); }
.sm-ucard .c, .sm-ucard .n { margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--fg-var); }
.sm-ucard .n { padding-right: 8px; }
.sm-ucard .bt { margin-top: 16px; display: flex; gap: 8px; }
.sm-ucard .bt.one { padding-right: 8px; }
.sm-ucard .bt span { flex: 1; min-width: 0; height: 36px; box-sizing: border-box; padding: 0 8px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 500; white-space: nowrap; transition: filter .15s, background .15s; }
.sm-ucard .bt .ol { border: 1px solid color-mix(in srgb, var(--fg) 16%, transparent); color: var(--fg); }
.sm-ucard .bt .go { background: var(--fg); color: var(--sc); }
.sm-ucard .bt .go.press { filter: brightness(.85); }

/* the notice: one line, centred on the window's bottom edge */
.sm-notice { position: absolute; left: 50%; bottom: 16px; z-index: 20; min-height: 48px; box-sizing: border-box; max-width: 600px; padding: 0 16px; display: flex; align-items: center; border-radius: 4px; background: var(--fg); color: var(--bg); font: 400 14px/20px var(--sans); white-space: nowrap; box-shadow: 0 3px 5px rgba(0,0,0,.3), 0 6px 14px rgba(0,0,0,.28); opacity: 0; transform: translateX(-50%) scale(.8); transition: opacity 75ms linear, transform 0s 75ms; pointer-events: none; }
.sm-notice.on { opacity: 1; transform: translateX(-50%); transition: opacity .15s linear, transform .15s cubic-bezier(0,0,.2,1); }

@media (prefers-reduced-motion: reduce) { .sm-rwin, .sm-ucard, .sm-notice { transition: none !important; } }

</style>
<style>/* app/settings-scene.css */
/* Settings, rebuilt (#97), for app/settings-scene.js: the wide hub (settings/SettingsHub.kt) in the Settings kit's
   tones (settings/kit/KitTheme.kt kitColors(): roles of Theme.kt's palette, washes of onSurface, primary for the
   flash) and sizes at 1× (dp = px, sp = px; a Text that sets only a size keeps bodyLarge's 20 dp line). Rail 252 dp
   6 dp in from the window; the detail pane 6 dp in, 8 dp corners, on the pane tone. Rows from KitRows.kt, controls
   from KitControls.kt, the search field from KitFields.kt, the worktrees from pages/WorktreesPage.kt. */
[data-scene="settings"] { position: relative; overflow: hidden; }
.sm-app.sm-set {
  /* dark (desktop's default): onSurface, onSurfaceVariant (and at 70 %), outlineVariant, primary, onPrimary, washes */

    if (e.k === 'think') {
      p.think(e);
    } else if (e.k === 'user') {
      p.user(e);
      p.setWorking(true);
      if (side) { side.kid(s.key, true); side.primary(null, true); }
    } else if (e.k === 'tool') {
      p.tool(e);
    } else if (e.k === 'asst') {
      p.asst(e);
    } else if (e.k === 'git') {
      p.git(e);
    } else if (e.k === 'rename') {
      p.setTitle(e.title);
      if (side) { side.kid(s.key, null, e.title); if (s.key === 'claude') side.primary(e.title); }

    }

    while (this.i < this.queue.length && this.queue[this.i].at <= t) this.apply(this.queue[this.i++]);

    this.build();

  var BATTERY = '<svg class="bat" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" opacity=".45"/></svg>';
  function phoneFrame() {
    var p = el('div', 'sm-phone', '<div class="scr"><div class="sb"><b>9:41</b><span class="isl"></span><i>' + BARS + BATTERY + '</i></div><div class="app sm-app phone"></div><span class="home"></span></div>');
    return { el: p, app: p.querySelector('.app') };
  }

  window.SupermuxReplay = { Player: Player };
  window.SupermuxUI = { ic: ic, ib: ib, tabs: tabs, fitTabs: fitTabs, el: el, esc: esc, md: md, LOGO: LOGO, GAUGE: GAUGE, Pane: Pane, Sidebar: Sidebar, agentsBlock: agentsBlock, wsRow: wsRow, mark: mark, ToolGroup: ToolGroup, schedule: schedule, fold: fold, tileColor: tileColor, plain: plain, phoneFrame: phoneFrame };

<script>// app/scene-kit.js
// The scene runner the feature scenes share (#90): a pointer, keycaps, a camera and one timeline over the kit
// (app/app.js). A scene subclasses Scene with compose() (fill the surface) and steps() ([ms after the previous step,
// fn] ...), and registers a name; <div data-scene="<name>"> then mounts it, scaled to its host, playing while on
// screen, its finished state for reduced motion. Used by the site and by the app's What's new.
(function () {
  'use strict';
  var UI = window.SupermuxUI, REPLAY = window.SUPERMUX_REPLAY;
  if (!UI || !REPLAY) return;
  var el = UI.el, esc = UI.esc;
  var W = 1120, H = 760;
  // how far the camera leans in: enough to point at a beat, the window still around it (Ahmet: "a little less")
  var MAX_ZOOM = 1.45;

  /* settings/kit/KitGlyphs.kt: one 1.5 stroke on a 24 grid, round ends, no fills */
  function circle(cx, cy, r) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>'; }
  function kg() { return '<svg class="kg" viewBox="0 0 24 24" aria-hidden="true">' + [].map.call(arguments, function (d) { return d[0] === '<' ? d : '<path d="' + d + '"/>'; }).join('') + '</svg>'; }
  var POINTER = '<svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.6L9.5 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>';

  function session(key) { return JSON.parse(JSON.stringify(REPLAY.sessions.filter(function (s) { return s.key === key; })[0])); }
  // a chat pane in the state its recording ended in
  function finishedChat(s, mode) {
    var p = new UI.Pane(s, mode || 'desktop');
    p.instant = true;
    s.events.forEach(function (e) {
      if (e.k === 'user') p.user(e);
      else if (e.k === 'tool') { p.tool(e); p.toolEnd(e); }
      else if (e.k === 'asst') p.asst(e);
      else if (e.k === 'think') p.think(e);
      else if (e.k === 'git') p.git(e);
      else if (e.k === 'rename') p.setTitle(e.title);
    });
    p.setWorking(false);
    return p;
  }
  // a user message as the app's bubble draws it (ui/chat/Timeline.kt UserMessage, mdAnnotated): bold and code inline
  function inlineMd(t) { return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>'); }

  function Scene(surface, opts) {
    this.surface = surface;
    this.opts = opts || {};
    this.timers = [];
    this.build();
  }
  Scene.prototype.compose = function () {};
  Scene.prototype.steps = function () { return []; };
  Scene.prototype.build = function () {
    this.stop();
    var s = this.surface;
    s.innerHTML = '';
    this.compose();
    this.cursor = s.appendChild(el('div', 'sm-cursor', POINTER));
    // the keycaps sit on the camera's frame, so they keep their size while the surface zooms
    var frame = s.parentNode && s.parentNode.classList.contains('sm-cam') ? s.parentNode : s;
    if (this.keys && this.keys.parentNode) this.keys.parentNode.removeChild(this.keys);
    this.keys = frame.appendChild(el('div', 'sm-keys'));
    this.cam(null, true);
    UI.fitTabs(s);
    if (this.ready) this.ready();

    this.place(start[0], start[1], true);
  };
  // geometry in the surface's own 1120×760 space, whatever it is scaled or zoomed to
  Scene.prototype.box = function (node) {
    var r = node.getBoundingClientRect(), o = this.surface.getBoundingClientRect(), k = o.width / W;
    return { x: (r.left - o.left) / k, y: (r.top - o.top) / k, w: r.width / k, h: r.height / k };
  };
  // [node]'s box relative to [within]
  Scene.prototype.boxIn = function (node, within) {
    var b = this.box(node), v = this.box(within);
    return { x: b.x - v.x, y: b.y - v.y, w: b.w, h: b.h };
  };
  Scene.prototype.place = function (x, y, now) {
    var c = this.cursor;
    if (now) { c.style.transition = 'none'; c.offsetWidth; }
    c.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    if (now) { c.offsetWidth; c.style.transition = ''; }
  };
  Scene.prototype.pointAt = function (node, fx, fy) {
    var b = this.box(node);
    this.place(b.x + b.w * (fx == null ? 0.5 : fx), b.y + b.h * (fy == null ? 0.55 : fy), this.instant);
  };
  Scene.prototype.click = function () {
    if (this.instant) return;
    var c = this.cursor; c.classList.remove('click'); c.offsetWidth; c.classList.add('click');
  };
  Scene.prototype.press = function (names) {
    this.keys.innerHTML = names.map(function (n) { return '<kbd>' + n + '</kbd>'; }).join('');
    this.keys.classList.toggle('on', !this.instant);
  };
  Scene.prototype.release = function () { this.keys.classList.remove('on'); };
  // [text] typed into [node] with a caret, ~38 ms a character
  Scene.prototype.type = function (node, text, done) {
    var self = this, i = 0;
    if (this.instant) { node.innerHTML = esc(text); if (done) done(); return; }
    (function tick() {
      node.innerHTML = esc(text.slice(0, ++i)) + '<span class="caret"></span>';
      if (i < text.length) self.later(38, tick); else if (done) done();
    })();
  };
  // The camera (#90, Ahmet: "we also need some zoom"): eases in on where the action is and back out to the window,
  // by scaling the live DOM (sharp at any zoom, never a bitmap). [r] is a box in the surface's own space, or null for
  // the whole window. Reduced motion and finish() never zoom.
  Scene.prototype.cam = function (r, now) {
    var st = this.surface.style;
    if (now || this.instant) { st.transition = 'none'; this.surface.offsetWidth; }
    if (!r || this.instant) st.transform = '';
    else {
      var z = Math.min(MAX_ZOOM, W / r.w, H / r.h), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      var tx = Math.min(0, Math.max(W - W * z, W / 2 - cx * z)), ty = Math.min(0, Math.max(H - H * z, H / 2 - cy * z));
      st.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + z.toFixed(3) + ')';
    }

  Scene.prototype.play = function (loop) {
    var self = this, t = 0;
    this.build();
    this.playing = true;
    this.steps().forEach(function (st) { t += st[0]; self.timers.push(setTimeout(st[1], t)); });

  };
  // the end state at once: reduced motion, and the still frame a poster is made from
  Scene.prototype.finish = function () {
    this.build();
    this.instant = true;
    this.steps().forEach(function (st) { st[1](); });
    this.instant = false;
    this.release();
  };
  function extend(compose, steps, extra) {
    function S(surface, opts) { Scene.call(this, surface, opts); }

    S.prototype.steps = steps;

  }

  // <div data-scene="<name>"> mounts itself: scaled to its host, playing while on screen
  var REGISTRY = {};
  function mount(host, Ctor) {
    if (host.__smScene) return;
    // the kit's .sm-scene is absolutely placed: its host must be its containing block
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    host.style.overflow = 'hidden';
    var frame = host.appendChild(el('div', 'sm-cam'));
    var surface = frame.appendChild(el('div', 'sm-app sm-scene'));
    surface.style.width = W + 'px'; surface.style.height = H + 'px';
    function fit() {
      var k = Math.min(1, host.clientWidth / W);
      frame.style.transform = 'scale(' + k + ')';
      host.style.height = Math.round(H * k) + 'px';
    }
    fit();
    // what the host says about itself: the keys to show, and the release it is shown for (data-version, data-chapters)
    var scene = host.__smScene = new Ctor(surface, {
      mac: host.getAttribute('data-keys') !== 'other',
      version: host.getAttribute('data-version') || '',
      chapters: Number(host.getAttribute('data-chapters')) || 0
    });
    window.addEventListener('resize', fit);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { scene.finish(); return; }
    new IntersectionObserver(function (en) {
      if (en[0].isIntersecting) { if (!scene.playing) scene.play(); } else if (scene.playing) { scene.stop(); scene.finish(); }
    }, { threshold: 0.35 }).observe(host);
  }
  function define(name, Ctor) {
    REGISTRY[name] = Ctor;
    function init() { document.querySelectorAll('[data-scene="' + name + '"]').forEach(function (h) { mount(h, Ctor); }); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else setTimeout(init, 0);
  }

  window.SupermuxSceneKit = {
    W: W, H: H, kg: kg, circle: circle, session: session, finishedChat: finishedChat, inlineMd: inlineMd,
    Scene: Scene, extend: extend, define: define, mount: mount, scenes: REGISTRY
  };
})();

</script>
<script>// app/browser-scene.js
// The Browser tab's pick and comment (#105/#122), played over the kit: the recorded Claude Code chat from
// app/replay-data.js beside a Browser tab showing the store it just changed. A pointer picks the search box (⌘⇧C,
// hover, click), writes a comment and sends it; the chat gets the comment the way the app words it
// (ui/browser/BrowserComments.kt commentsMessage). Used by the site and by the app's What's new (#90).
//   <div data-scene="browser"></div>, or new SupermuxBrowserScene(surface, { mac: true }).play()
(function () {
  'use strict';
  var UI = window.SupermuxUI, K = window.SupermuxSceneKit;
  if (!UI || !K) return;
  var el = UI.el, esc = UI.esc, kg = K.kg, circle = K.circle, H = K.H;
  var G = {
    back: kg('M19 12H5', 'M11 18l-6-6 6-6'),
    fwd: kg('M5 12h14', 'M13 6l6 6-6 6'),
    restart: kg('M19.5 12a7.5 7.5 0 1 1-2.2-5.3', 'M19.5 4.5v4h-4'),
    target: kg(circle(12, 12, 7), circle(12, 12, 2.5), 'M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3'),
    phone: kg('<rect x="7" y="3" width="10" height="18" rx="2"/>', 'M11 17.5h2'),
    ext: kg('M14 4h6v6', 'M20 4l-8.5 8.5', 'M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10'),
    more: kg(circle(6, 12, 1), circle(12, 12, 1), circle(18, 12, 1)),
    trash: kg('M5 7h14M10 7V5h4v2', 'M7 7l1 12.5h8L17 7'),
    globe: kg(circle(12, 12, 8.5), 'M3.5 12h17', 'M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.1-3.6-8.5s1.2-6.2 3.6-8.5z')
  };
  var inlineMd = K.inlineMd;
  var COMMENT = 'Make the search box full width';
  function message(url, selector, comment) {
    return '**1 browser comment** · ' + url + '\n\n### ① "' + comment + '"\n- element: `' + selector + '`\n- picture: comment-1.png';
  }

  function compose() {
    var s = this.surface, mac = this.opts.mac !== false;
    s.classList.add('sm-row2');
    this.chatSession = K.session('claude');
    this.chat = K.finishedChat(this.chatSession);
    s.appendChild(this.chat.el);
    var pane = el('section', 'sm-pane sm-browser');
    pane.appendChild(el('div', 'sm-tabs', UI.tabs(G.globe, 'Acme Outdoor')));
    var sheet = pane.appendChild(el('div', 'sm-sheet'));
    sheet.appendChild(el('div', 'sm-bbar',
      '<span class="gb">' + G.back + '</span><span class="gb off">' + G.fwd + '</span><span class="gb">' + G.restart + '</span>' +
      '<span class="addr"><i></i>localhost:5173</span>' +
      '<span class="gb pick">' + G.target + '</span><span class="gb">' + G.phone + '</span><span class="gb">' + G.ext + '</span><span class="gb">' + G.more + '</span>'));
    sheet.appendChild(el('div', 'sm-bline'));
    this.strip = sheet.appendChild(el('div', 'sm-pstrip', 'Pick an element · ↑↓ parent / child · Esc to finish'));
    var vp = this.vp = sheet.appendChild(el('div', 'sm-viewport'));
    vp.appendChild(el('div', 'sm-page',
      '<h1>Acme Outdoor</h1><span class="srch">Search products</span>' +
      '<div class="grid"><span>Merino socks</span><span>Trail running shoes</span><span>Rain shell</span><span>Down vest</span></div>' +
      '<h2>Cart</h2><p>Your cart is empty.</p>'));
    this.hover = vp.appendChild(el('div', 'sm-hover', '<b></b>'));
    this.panel = vp.appendChild(el('div', 'sm-cpanel', '<div class="hd"><span class="n">1</span><span class="lb"></span><span class="sp"></span>' + G.trash + '</div><div class="f"><span class="ph">What should change here?</span></div>'));
    this.pin = vp.appendChild(el('div', 'sm-pin', '1'));
    this.bar = sheet.appendChild(el('div', 'sm-sendbar',
      '<div class="row"><span class="t">1 comment → ' + esc(this.chatSession.title) + '</span><span class="a">Clear</span><span class="a">Add to message</span><span class="send">Send</span></div>'));
    s.appendChild(pane);
    this.pane = pane;

  }
  function ready() { this.chat.stick(); }
  function vbox(node) { return this.boxIn(node, this.vp); }
  function outline(node, label) {
    var b = this.vbox(node), h = this.hover;
    h.style.left = b.x + 'px'; h.style.top = b.y + 'px'; h.style.width = b.w + 'px'; h.style.height = b.h + 'px';
    h.querySelector('b').textContent = label;
    h.classList.add('on');
  }
  function steps() {
    var self = this, q = function (sel) { return self.surface.querySelector(sel); };
    var input = function () { return q('.sm-page .srch'); };
    // Regions are measured once, unzoomed, before the run (the camera never measures mid-move).
    var R = {};
    function measure() {
      var pane = self.pane, br = self.box(pane);
      R.bar = { x: br.x + br.w * 0.35, y: 0, w: br.w * 0.65, h: 130 };
      R.page = { x: br.x, y: 60, w: br.w, h: 330 };

      [10, function () { measure(); }],
      [500, function () { self.cam(R.bar); }],
      [800, function () { self.pointAt(q('.sm-bbar .pick')); }],
      [800, function () { self.press(self.keyNames); q('.sm-bbar .pick').classList.add('on'); self.strip.classList.add('on'); }],
      // first over a product button (an h1 is a full-width block: its box would span the page), then the search box
      [1100, function () { self.release(); self.cam(R.page); self.pointAt(q('.sm-page .grid span'), 0.5); }],
      [900, function () { self.outline(q('.sm-page .grid span'), 'button "Merino socks"'); }],
      [700, function () { self.pointAt(input(), 0.35); }],
      [500, function () { self.outline(input(), 'input[type="search"]'); }],
      [700, function () {

        var b = self.vbox(input());

        self.panel.querySelector('.lb').textContent = 'input[type="search"]';
        self.panel.classList.add('on');
      }],
      [350, function () { self.type(self.panel.querySelector('.f'), COMMENT); }],
      [1800, function () {
        self.press(['↵']);

        var b = self.vbox(input());
        self.pin.style.left = (b.x - 9) + 'px'; self.pin.style.top = (b.y - 9) + 'px';
        self.pin.classList.add('on');
      }],
      [900, function () { self.release(); self.cam(null); }],
      [1000, function () { self.bar.classList.add('on'); self.cam(R.send); }],
      [1000, function () { self.pointAt(q('.sm-sendbar .send')); }],
      [800, function () {
        self.click();
        var send = q('.sm-sendbar .send'); send.classList.add('press');

      }],
      [300, function () {
        self.bar.classList.remove('on'); self.strip.classList.remove('on'); self.hover.classList.remove('on'); self.pin.classList.remove('on');
        q('.sm-bbar .pick').classList.remove('on');

        self.chat.anchor = null;
        self.chat.add(node);
        self.chat.stick();
        self.pointAt(self.chat.el.querySelector('.sm-composer'), 0.3);
      }],
      [2600, function () { self.cam(null); }]

})();

<script>// app/device-scene.js
// The Browser tab's device mode (#122 phase 2), played over the kit: the recorded Claude Code chat from
// app/replay-data.js beside a Browser tab on the store it changed. The pointer turns Device mode on (the bar's phone
// lights), the page lays out at an iPhone 16's size on the pane's stage, then the device menu switches it to an
// iPhone SE. Drawn as ui/browser/BrowserDevice.kt draws it on a Mac (DeviceBar with the fit and Mobile/◐ choices,
// no DPR or Touch; DeviceStage fitting the device in the pane), presets from shared browser/DeviceMode.kt. Used by the
// site and by the app's What's new (#90).
//   <div data-scene="device"></div>, or new SupermuxDeviceScene(surface, { mac: true }).play()
(function () {
  'use strict';
  var UI = window.SupermuxUI, K = window.SupermuxSceneKit;
  if (!UI || !K) return;
  var el = UI.el, esc = UI.esc, kg = K.kg, circle = K.circle;
  /* settings/kit/KitGlyphs.kt */
  var G = {
    back: kg('M19 12H5', 'M11 18l-6-6 6-6'),
    fwd: kg('M5 12h14', 'M13 6l6 6-6 6'),
    restart: kg('M19.5 12a7.5 7.5 0 1 1-2.2-5.3', 'M19.5 4.5v4h-4'),
    target: kg(circle(12, 12, 7), circle(12, 12, 2.5), 'M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3'),
    phone: kg('<rect x="7" y="3" width="10" height="18" rx="2"/>', 'M11 17.5h2'),
    ext: kg('M14 4h6v6', 'M20 4l-8.5 8.5', 'M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10'),
    more: kg(circle(6, 12, 1), circle(12, 12, 1), circle(18, 12, 1)),
    globe: kg(circle(12, 12, 8.5), 'M3.5 12h17', 'M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.1-3.6-8.5s1.2-6.2 3.6-8.5z'),
    rotate: kg('<rect x="3.5" y="11.5" width="14" height="8" rx="1.5"/>', 'M8 7.5a8 8 0 0 1 11.5 2.5', 'M19.5 6v4h-4'),
    chevD: kg('M6.5 9.5l5.5 5.5 5.5-5.5'),
    close: kg('M6.5 6.5l11 11M17.5 6.5l-11 11'),
    check: kg('M5.5 12.5l4 4 9-9')
  };
  /* shared browser/DeviceMode.kt DevicePresets.all, in its groups */
  var PRESETS = [
    ['iphone-se', 'iPhone SE', 375, 667, 'Phones'], ['iphone-16', 'iPhone 16', 393, 852, 'Phones'],
    ['iphone-16-pro-max', 'iPhone 16 Pro Max', 440, 956, 'Phones'], ['pixel-9', 'Pixel 9', 412, 924, 'Phones'],
    ['galaxy-a55', 'Galaxy A55', 360, 800, 'Phones'], ['galaxy-z-fold-6', 'Galaxy Z Fold 6', 412, 968, 'Phones'],
    ['ipad-mini', 'iPad Mini', 768, 1024, 'Tablets'], ['ipad-pro-13', 'iPad Pro 13"', 1032, 1376, 'Tablets'],
    ['surface-pro-10', 'Surface Pro 10', 960, 1440, 'Tablets'],
    ['laptop', 'Laptop', 1280, 800, 'Desktops'], ['laptop-hidpi', 'Laptop HiDPI', 1440, 900, 'Desktops'],
    ['desktop', 'Desktop', 1920, 1080, 'Desktops']
  ];
  function preset(id) { return PRESETS.filter(function (p) { return p[0] === id; })[0]; }
  var FIRST = 'iphone-16', NEXT = 'iphone-se'; // DeviceMode.Default, then one pick

  // BrowserDevice.kt DeviceBar's row: the device, its size, rotate, the fit, | Mobile, ◐ System, and close
  function deviceBar() {
    var choice = function (cls, label) { return '<span class="dc ' + cls + '"><b>' + esc(label) + '</b>' + G.chevD + '</span>'; };
    return '<div class="row">' +
      '<span class="dp"><b></b>' + G.chevD + '</span>' +
      '<span class="sf w"></span><span class="x">×</span><span class="sf h"></span>' +
      '<span class="gb">' + G.rotate + '</span>' +
