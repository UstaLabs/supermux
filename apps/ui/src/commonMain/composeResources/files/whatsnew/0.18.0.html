<style>

  --card: var(--sm-card, oklch(0.18 0.008 130)); --border: var(--sm-border, oklch(0.28 0.01 130));
  --muted: var(--sm-muted, oklch(0.24 0.008 130)); --primary: var(--sm-primary, oklch(0.72 0.105 180));
  --onPrimary: oklch(0.13 0.018 170); --warning: oklch(0.78 0.12 75); --danger: oklch(0.72 0.18 24);
  --bg: color-mix(in oklch, var(--card) 70%, black); --chat: color-mix(in oklch, var(--card) 85%, black);
  --list: color-mix(in oklch, var(--card) 60%, var(--muted)); --rail: var(--card); --header: color-mix(in oklch, var(--card) 90%, black);
  --work: transparent; --bubble: var(--muted);

}

  --bg: color-mix(in oklch, var(--card) 94%, black); --chat: color-mix(in oklch, var(--card) 97%, black);
  --header: var(--card);
}
* { box-sizing: border-box; }

kbd { font-family: inherit; font-size: 0.92em; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--fg); background: var(--card); white-space: nowrap; }
#root { height: 100%; }
/* ── the what's-new experience ── */

.wn-index a svg { transition: color 200ms; }

.wn-index .sp { flex: 1; }

.ch h2 svg { color: var(--primary); width: 18px; height: 18px; }

.also { border-top: 1px solid var(--hair); padding-top: 22px; }
.also h3 { font-size: 13px; font-weight: 500; color: var(--mutedFg); margin: 0 0 10px; }
.also .ar { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.also .ar svg { color: var(--mutedFg); }
.also .ar span { color: var(--mutedFg); margin-left: auto; font-size: 12.5px; text-align: right; }
.wn-end { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mutedFg); flex-wrap: wrap; gap: 10px; }
.wn-end a { color: var(--mutedFg); display: inline-flex; gap: 6px; align-items: center; }
.wn-end .done { border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 7px 14px; cursor: pointer; color: var(--fg); }
.wn.narrow .wn-index { display: none; }
.wn.narrow .wn-col { padding: 20px 18px 40px; }
.wn.narrow .wn-head h1 { font-size: 26px; }

/* stage: the product in motion, rebuilt in HTML, scaled from a fixed 420×300 scene */
.stagebox.kit { aspect-ratio: auto; background: transparent; }
.stagebox { position: relative; width: 100%; aspect-ratio: 420 / 300; border-radius: 10px; overflow: hidden; border: 1px solid var(--hair); background: var(--bg); }
.scene { position: absolute; left: 0; top: 0; width: 420px; height: 300px; transform-origin: 0 0; font-size: 11px; line-height: 1.4; }
.play { position: absolute; right: 10px; bottom: 10px; display: none; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--fg); }

html.rm .stagebox:not(.playing) .scene *, html.rm .stagebox:not(.playing) .scene { transition: none !important; animation: none !important; }

/* scene kit */
.scene .mw { position: absolute; inset: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--chat); overflow: hidden; display: flex; flex-direction: column; transition: opacity 250ms, transform 250ms; }

.scene .mtab.new.in { max-width: 140px; padding: 0 10px; border-right-width: 1px; }
.scene .mbody { flex: 1; position: relative; min-height: 0; overflow: hidden; }
.scene .pn, .scene .mc, .scene .cp { overflow: hidden; }
.scene .pn { position: absolute; inset: 0; display: none; flex-direction: column; }
.scene .pn.on { display: flex; }
.scene .cp { justify-content: flex-end; gap: 7px; padding: 10px 12px; }
.scene .b { max-width: 78%; padding: 6px 9px; border-radius: 9px; transition: opacity 220ms, transform 220ms; }
.scene .b.me { align-self: flex-end; background: var(--primary); color: var(--onPrimary); border-bottom-right-radius: 3px; }
.scene .b.ag { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 3px; }
.scene .b small { display: block; opacity: .75; font-size: 9.5px; }
.scene .hide { display: none !important; }
.scene .fade { opacity: 0; transform: translateY(6px); }
.scene .lnk { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
.scene .b.me .lnk { color: inherit; }
.scene .cur { position: absolute; left: 330px; top: 250px; width: 14px; height: 14px; z-index: 50; transition: left 520ms cubic-bezier(.4,.1,.2,1), top 520ms cubic-bezier(.4,.1,.2,1); pointer-events: none; }
.scene .cur svg { width: 14px; height: 14px; display: block; filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / .45)); }
.scene .cur::after { content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); opacity: 0; transform: scale(.4); }
.scene .cur.tap::after { animation: tap 380ms ease-out; }
@keyframes tap { 0% { opacity: .55; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }
html[data-family="phone"] .scene .cur svg { display: none; }
html[data-family="phone"] .scene .cur::before { content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in oklch, var(--fg) 30%, transparent); border: 1px solid color-mix(in oklch, var(--fg) 55%, transparent); }
.scene .press { filter: brightness(1.15); }
.scene .ic { width: 20px; height: 20px; display: grid; place-items: center; color: var(--mutedFg); border-radius: 5px; }
.scene .ic svg { width: 12px; height: 12px; }
.scene .ic.on { background: var(--muted); color: var(--primary); }
.scene .composer { padding: 0 10px 9px; }
.scene .composer div { border: 1px solid var(--border); background: var(--card); border-radius: 9px; padding: 6px 9px; color: var(--mutedFg); }
.scene .split { flex: 1; display: flex; min-height: 0; }
.scene .ml { width: 138px; flex: none; background: var(--list); border-right: 1px solid var(--border); padding-top: 4px; }

.scene .mr .t { flex: 1; min-width: 0; } .scene .mr .n { font-weight: 500; }
.scene .mr .s { color: var(--mutedFg); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 3px; align-items: center; }

.scene .badge { background: var(--primary); color: var(--onPrimary); border-radius: 8px; font-size: 9px; padding: 0 5px; font-weight: 600; transition: opacity 200ms; }
.scene .mc { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* phone scenes (300×400) */
.scene .ps { position: absolute; inset: 0; background: var(--chat); display: flex; flex-direction: column; overflow: hidden; font-size: 12px; transition: opacity 250ms; }
.scene .pa { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--header); border-bottom: 1px solid var(--border); }
.scene .pa svg { width: 15px; height: 15px; color: var(--mutedFg); }
.scene .pa .tt { font-weight: 600; font-size: 13px; flex: 1; } .scene .pa .tt small { display: block; font-size: 9.5px; color: var(--mutedFg); font-weight: 400; }

.scene .pv { flex: 1; display: none; flex-direction: column; min-height: 0; position: relative; overflow: hidden; } .scene .pv.on { display: flex; }
.scene .ps .cp { display: flex; flex-direction: column; flex: 1; justify-content: flex-end; gap: 7px; padding: 10px; }
.scene .ps .mr { padding: 8px 12px; gap: 10px; } .scene .ps .mr .a { width: 30px; height: 30px; font-size: 12px; } .scene .ps .mr .n { font-size: 12.5px; } .scene .ps .mr .s { font-size: 10.5px; }

.scene .kbd { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); background: var(--card); border: 1px solid var(--border); border-bottom-width: 3px; border-radius: 9px; padding: 8px 16px; font-size: 19px; font-weight: 500; box-shadow: 0 8px 24px rgb(0 0 0 / .3); z-index: 60; letter-spacing: 0.04em; }

/* device mode */

.scene .dp { width: 100%; transition: width 520ms cubic-bezier(.3,.7,.2,1), margin 520ms, border-radius 520ms; border: 1px solid transparent; overflow: hidden; }

.scene .dstage.mob .dp .gridc { grid-template-columns: 1fr; } .scene .dstage.mob .dp h3 { font-size: 15px; } .scene .dstage.mob .dp .gridc i { height: 22px; }

.scene .page .ln { height: 6px; border-radius: 3px; background: oklch(0.88 0.006 120); width: 70%; margin: 0 0 6px; } .scene .page .ln.s { width: 48%; margin-bottom: 14px; }

.scene .newl::before, .scene .newl::after { content: ""; flex: 1; height: 1px; background: color-mix(in oklch, var(--primary) 50%, transparent); }
.scene .blank { flex: 1; display: grid; place-items: center; color: var(--mutedFg); }

// ── a tiny timeline player per stage ──
class Player {
  constructor(box, id) {
    this.box = box; const d = SCENES[id]; this.def = typeof d === 'function' ? d() : d; this.w = this.def.w || 420; this.h = this.def.h || 300; this.scene = box.querySelector('.scene'); this.timers = []; this.playing = false;
    const api = this.api = {
      $: s => this.scene.querySelector(s), $$: s => [...this.scene.querySelectorAll(s)],
      later: (ms, fn) => { if (this.instant) fn(); else this.timers.push(setTimeout(fn, ms)); },
      show: s => api.$(s).classList.remove('hide'), hide: s => api.$(s).classList.add('hide'),
      reveal: s => { api.show(s); api.later(20, () => api.$(s).classList.remove('fade')); },
      pos: el => { let x = 0, y = 0; while (el && el !== this.scene) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return [x, y]; },
      point: (s, fx = 0.5, fy = 0.55) => { const el = api.$(s), [x, y] = api.pos(el), c = api.$('.cur'); c.style.left = (x + el.offsetWidth * fx) + 'px'; c.style.top = (y + el.offsetHeight * fy) + 'px'; },
      tap: s => { const c = api.$('.cur'), el = api.$(s); if (this.instant) return; c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap'); el.classList.add('press'); api.later(180, () => el.classList.remove('press')); },
      view: v => api.$$('.pv').forEach(e => e.classList.toggle('on', e.dataset.p === v)),
      tabTo: t => { api.$$('.mtab').forEach(e => e.classList.toggle('on', e.dataset.t === t)); api.$$('.pn').forEach(e => e.classList.toggle('on', e.dataset.p === t)); },
      page: p => { api.$$('.pg').forEach(e => e.classList.toggle('on', e.dataset.p === p)); api.$$('.si').forEach(e => e.classList.toggle('on', e.dataset.s === p)); },
      cover: (s, over) => { const o = api.$(over), el = api.$(s); el.style.left = (o.offsetLeft - 4) + 'px'; el.style.top = (o.offsetTop - 4) + 'px'; el.style.width = (o.offsetWidth + 8) + 'px'; el.style.height = (o.offsetHeight + 8) + 'px'; api.show(s); },
      place: (s, at, dx, dy) => { const o = api.$(at), el = api.$(s); el.style.left = (o.offsetLeft + dx) + 'px'; el.style.top = (o.offsetTop + dy) + 'px'; },
      type: (s, text, ms, done) => { const el = api.$(s); if (this.instant) { el.textContent = text; done && done(); return; } let i = 0; el.textContent = ''; const tick = () => { el.textContent = text.slice(0, ++i); if (i < text.length) this.timers.push(setTimeout(tick, ms)); else done && done(); }; tick(); },
    };
  }
  reset() { this.stop(); this.scene.style.width = this.w + 'px'; this.scene.style.height = this.h + 'px'; this.scene.innerHTML = this.def.html; }
  stop() { this.timers.forEach(clearTimeout); this.timers = []; this.playing = false; }
  end() { this.reset(); this.instant = true; this.def.steps.forEach(([, fn]) => fn(this.api)); this.instant = false; const c = this.api.$('.cur'); if (c) c.style.opacity = 0; }
  play(loop = true) {
    this.reset(); this.playing = true; let t = 0;
    for (const [d, fn] of this.def.steps) { t += d; this.timers.push(setTimeout(() => fn(this.api), t)); }
    // every ending gets a settle before it starts over
    this.timers.push(setTimeout(() => { if (loop) this.play(); else { this.playing = false; this.box.classList.remove('playing'); } }, t + 2600));
  }
}

  host.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
}
