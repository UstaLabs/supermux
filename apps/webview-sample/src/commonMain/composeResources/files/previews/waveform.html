<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Voice note</title>
<link rel="stylesheet" href="lib/kit.css">
<script src="lib/kit.js"></script>
<script>
  // The variant's tint before the first paint.
  document.documentElement.classList.add(Kit.variant('note') === 'live' ? 'v-live' : 'v-note');
</script>
<style>
  :root {
    --accent: #16a34a; --accent2: #22c55e; --rest: rgba(22, 44, 30, .2); --tint1: #f3fbf6; --tint2: #e7f5ec;
    --rec: #ef4444; --rec2: #fb7a59;
  }
  html.v-live { --tint1: #fbf8f8; --tint2: #f4eeef; }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #22c55e; --accent2: #4ade80; --rest: rgba(255, 255, 255, .22); --tint1: #17211b; --tint2: #111915;
      --rec: #f87171; --rec2: #fb923c;
    }
    html.v-live { --tint1: #1f1a1c; --tint2: #171416; }
  }
  /* The tint is the page's: the gradient over the content, its end colour below it (never repeated). */
  html { background: var(--tint2) linear-gradient(180deg, var(--tint1), var(--tint2)) no-repeat; }
  body.wrap { background: transparent; }
  main { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .play {
    flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff;
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(34, 197, 94, .32);
    transition: transform .15s ease;
  }
  .play:active { transform: scale(.93); }
  .play svg { width: 20px; height: 20px; }
  .grow { flex: 1; min-width: 0; }
  /* The waveform takes taps and sideways drags (a seek); an up or down drag still scrolls the chat. */
  .wavebox { padding: 4px 0; margin: -4px 0; touch-action: pan-y; cursor: pointer; }
  canvas.wave { width: 100%; height: 36px; }
  .meta {
    display: flex; justify-content: space-between; align-items: center; margin-top: 5px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .speed {
    position: relative; border: 0; border-radius: 999px; padding: 3px 9px; background: var(--chip); color: var(--fg);
    font-weight: 700; font-size: 11px; line-height: 16px; cursor: pointer; min-width: 38px;
  }
  .speed::after { content: ''; position: absolute; inset: -10px -6px; } /* a 40 px target */
  .avatar {
    flex: none; position: relative; width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #ffb35c, #ff6a88); color: #fff; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; letter-spacing: .02em;
  }
  .avatar .mic {
    position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--tint1); display: grid; place-items: center;
  }
  .avatar .mic svg { width: 9px; height: 9px; }

  /* The recording card. */
  .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); flex: none; animation: pulse 1.2s ease-in-out infinite; }
  .paused .dot { animation: none; opacity: .35; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.7); opacity: .45; } }
  .label { font-weight: 650; font-size: 14px; white-space: nowrap; }
  .clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .spacer { flex: 1; }
  .pill {
    position: relative; height: 30px; border: 1px solid var(--line); border-radius: 999px; padding: 0 12px;
    background: transparent; font-size: 12px; font-weight: 650; cursor: pointer; flex: none;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .12s ease;
  }
  .pill::after { content: ''; position: absolute; inset: -6px -3px; } /* a 42 px target */
  .pill:active { transform: scale(.95); }
  .pill.stop { border: 0; color: #fff; background: linear-gradient(135deg, var(--rec), var(--rec2)); }
  .pill.stop i { width: 8px; height: 8px; border-radius: 2px; background: #fff; display: inline-block; }
  .paused .pill.stop i { border-radius: 50%; }
  canvas.scope { width: 100%; height: 44px; margin-top: 10px; }
</style>
</head>
<body class="wrap nosel">
<main id="root"></main>
<script>
(function () {
  'use strict';
  var V = Kit.variant('note');
  var root = document.getElementById('root');
  var PLAY = '<svg viewBox="0 0 20 20"><path d="M6 3.8v12.4c0 .8.9 1.3 1.6.9l9.6-6.2c.6-.4.6-1.3 0-1.7L7.6 2.9C6.9 2.5 6 3 6 3.8z" fill="currentColor"/></svg>';
  var PAUSE = '<svg viewBox="0 0 20 20"><rect x="4.5" y="3.5" width="4" height="13" rx="1.3" fill="currentColor"/><rect x="11.5" y="3.5" width="4" height="13" rx="1.3" fill="currentColor"/></svg>';
  var MIC = '<svg viewBox="0 0 10 10"><rect x="3.3" y="1" width="3.4" height="5.4" rx="1.7" fill="#fff"/><path d="M2 5.2a3 3 0 0 0 6 0M5 8.2V9.4" stroke="#fff" stroke-width="1" fill="none" stroke-linecap="round"/></svg>';
  var colours = {};
  var redraw = null;
  Kit.onTheme(function () {
    var s = getComputedStyle(document.documentElement);
    ['--accent', '--accent2', '--rest', '--rec', '--rec2', '--line'].forEach(function (k) { colours[k] = s.getPropertyValue(k).trim(); });
    if (redraw) redraw();
  });

  function fmt(seconds) {
    var s = Math.max(0, Math.floor(seconds));
    return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }
  // Writes text only when it changes: nothing to lay out on the frames it doesn't.
  function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

  if (V === 'live') live(); else note();

  // A voice message: it waits for a tap on play, its waveform fills in as it plays, and a tap or a sideways drag on
  // the waveform seeks.
  function note() {
    var DURATION = 42;
    root.innerHTML =
      '<div class="row">' +
      '<button class="play" id="play" type="button" aria-label="Play">' + PLAY + '</button>' +
      '<div class="grow"><div class="wavebox" id="wavebox"><canvas class="wave" id="wave"></canvas></div>' +
      '<div class="meta"><span id="time"></span><button class="speed" id="speed" type="button">1x</button></div></div>' +
      '<div class="avatar">AD<span class="mic">' + MIC + '</span></div>' +
      '</div>';
    var canvas = document.getElementById('wave'), ctx = canvas.getContext('2d'), box = document.getElementById('wavebox');
    var play = document.getElementById('play'), time = document.getElementById('time'), speedChip = document.getElementById('speed');
    var BARS = 48, amp = new Float32Array(BARS);
    for (var i = 0; i < BARS; i++) {
      // Words and the short silences between them.
      var word = 0.55 + 0.45 * Math.sin(i * 0.55 + 1.3) * Math.sin(i * 0.23);
      var grain = Math.abs(Kit.fbm2(i * 0.31, 4.2, 3)) * 1.7;
      amp[i] = Kit.clamp(0.14 + 0.86 * Math.pow(Kit.clamp(grain * (0.45 + word), 0, 1), 0.85), 0.12, 1);
    }
    var progress = 0, playing = false, speed = 1, hold = 0, t = 0, W = 1, H = 1, seeking = false;
    var speeds = [1, 1.5, 2];

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // Bars fill the width exactly: at least 2 px wide, the gaps giving way on a narrow card.
      var gap = 2.2, barW = (W - gap * (BARS - 1)) / BARS;
      if (barW < 2) { barW = 2; gap = Math.max(0.8, (W - barW * BARS) / (BARS - 1)); }
      var head = progress * BARS;
      ctx.lineCap = 'round';
      ctx.lineWidth = barW;
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        for (var i = 0; i < BARS; i++) {
          var played = i < head;
          if ((pass === 0) === played) continue;
          var near = playing ? Math.max(0, 1 - Math.abs(i - head) / 3.5) : 0;
          var bounce = 1 + near * 0.28 * (0.5 + 0.5 * Math.sin(t * 14 + i * 1.7));
          var h = Math.min(H - barW, Math.max(barW, amp[i] * (H - barW) * bounce));
          var x = i * (barW + gap) + barW / 2;
          ctx.moveTo(x, H / 2 - h / 2 + barW / 2);
          ctx.lineTo(x, H / 2 + h / 2 - barW / 2);
        }
        if (pass === 0) {
          ctx.strokeStyle = colours['--rest'] || 'rgba(0,0,0,.2)';
        } else {
          var grad = ctx.createLinearGradient(0, 0, W, 0);
          grad.addColorStop(0, colours['--accent'] || '#16a34a');
          grad.addColorStop(1, colours['--accent2'] || '#22c55e');
          ctx.strokeStyle = grad;
        }
        ctx.stroke();
      }
      // At rest at the start, a voice message shows its length; once started, where it is.
      setText(time, progress === 0 && !playing ? fmt(DURATION) : fmt(progress * DURATION) + ' / ' + fmt(DURATION));
    }
    redraw = draw;

    Kit.watch(canvas, function () {
      var f = Kit.fit(canvas);
      W = f.cw;
      H = f.ch;
      ctx.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
      draw();
    });

    function setPlaying(on) {
      playing = on;
      hold = 0;
      play.innerHTML = on ? PAUSE : PLAY;
      play.setAttribute('aria-label', on ? 'Pause' : 'Play');
      draw();
    }
    play.addEventListener('click', function () {
      if (!playing && progress >= 0.999) progress = 0;
      setPlaying(!playing);
    });
    speedChip.addEventListener('click', function () {
      speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
      speedChip.textContent = speed + 'x';
    });
    function seek(e) {
      var rect = canvas.getBoundingClientRect();
      progress = Kit.clamp((e.clientX - rect.left) / rect.width, 0, 0.999);
      hold = 0;
      draw();
    }
    // A mouse seeks as it presses; a finger as it lifts or drags sideways, so a scroll that starts here doesn't seek.
    box.addEventListener('pointerdown', function (e) {
      seeking = true;
      try { box.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
      if (e.pointerType === 'mouse') seek(e);
    });
    box.addEventListener('pointermove', function (e) { if (seeking) seek(e); });
    box.addEventListener('pointerup', function (e) { if (seeking) seek(e); seeking = false; });
    box.addEventListener('pointercancel', function () { seeking = false; });

    Kit.loop(function (dt) {
      t += dt;
      if (!playing) return;
      if (hold > 0) {
        // The end: a breath on the last bar, then back to the start, stopped.
        hold -= dt;
        if (hold <= 0) { progress = 0; setPlaying(false); return; }
      } else if (!seeking) {
        progress += dt * speed / DURATION;
        if (progress >= 1) { progress = 1; hold = 0.6; }
      }
      draw();
    });
  }

  // A recording in progress: the newest sound comes in at the right and scrolls away to the left.
  function live() {
    root.innerHTML =
      '<div id="card"><div class="top">' +
      '<span class="dot"></span><span class="label" id="label">Recording…</span><span class="clock" id="clock">0:00</span>' +
      '<span class="spacer"></span>' +
      '<button class="pill" id="cancel" type="button">Cancel</button>' +
      '<button class="pill stop" id="stop" type="button"><i></i><span>Stop</span></button>' +
      '</div><canvas class="scope" id="scope"></canvas></div>';
    var card = document.getElementById('card');
    var canvas = document.getElementById('scope'), ctx = canvas.getContext('2d');
    var clock = document.getElementById('clock'), label = document.getElementById('label');
    var stopButton = document.getElementById('stop');
    var rand = Kit.rng(5);
    var SAMPLE = 0.075, BAR = 3, GAP = 2.4;
    var samples = [], acc = 0, t = 3 + rand() * 4, elapsed = 4 + rand() * 6, recording = true, W = 1, H = 1;

    function sample() {
      // Syllables, words and pauses: noise at three speeds.
      var word = Kit.noise2(t * 0.55, 9.1) > -0.42 ? 1 : 0.1;
      var syllable = 0.5 + 0.5 * Kit.noise2(t * 2.6, 1.7);
      return Kit.clamp(word * (0.18 + 0.82 * Math.pow(syllable, 1.4)) + rand() * 0.07, 0.05, 1);
    }
    function capacity() { return Math.ceil(W / (BAR + GAP)) + 2; }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = colours['--line'] || 'rgba(0,0,0,.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H / 2);
      ctx.lineTo(W, H / 2);
      ctx.stroke();
      // Scrolls smoothly between samples: the newest bar slides in from the right edge.
      var shift = recording ? (acc / SAMPLE) * (BAR + GAP) : 0;
      ctx.lineCap = 'round';
      ctx.lineWidth = BAR;
      ctx.strokeStyle = colours['--rec'] || '#ef4444';
      var bands = 4;
      for (var b = 0; b < bands; b++) {
        ctx.beginPath();
        for (var i = 0; i < samples.length; i++) {
          var x = W - (samples.length - i) * (BAR + GAP) + BAR / 2 - shift + (BAR + GAP);
          // Older sound fades out toward the left edge.
          var band = Math.min(bands - 1, Math.floor(Kit.clamp(x / (W * 0.45), 0, 1) * bands));
          if (band !== b) continue;
          var h = Math.max(BAR, samples[i] * (H - BAR));
          ctx.moveTo(x, H / 2 - h / 2 + BAR / 2);
          ctx.lineTo(x, H / 2 + h / 2 - BAR / 2);
        }
        ctx.globalAlpha = 0.25 + 0.75 * (b + 1) / bands;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    redraw = draw;

    Kit.watch(canvas, function () {
      var f = Kit.fit(canvas);
      W = f.cw;
      H = f.ch;
      ctx.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
      // A recording already under way: the strip starts full.
      while (samples.length < capacity()) { t += SAMPLE; samples.push(sample()); }
      while (samples.length > capacity()) samples.shift();
      draw();
    });

    stopButton.addEventListener('click', function () {
      recording = !recording;
      card.classList.toggle('paused', !recording);
      label.textContent = recording ? 'Recording…' : 'Saved';
      stopButton.querySelector('span').textContent = recording ? 'Stop' : 'Record';
      draw();
    });
    document.getElementById('cancel').addEventListener('click', function () {
      elapsed = 0;
      for (var i = 0; i < samples.length; i++) samples[i] = 0.05;
      setText(clock, fmt(elapsed));
      draw();
    });

    Kit.loop(function (dt) {
      if (!recording) return;
      elapsed += dt;
      acc += dt;
      while (acc >= SAMPLE) {
        acc -= SAMPLE;
        t += SAMPLE;
        samples.push(sample());
        if (samples.length > capacity()) samples.shift();
      }
      setText(clock, fmt(elapsed));
      draw();
    });
  }
})();
</script>
</body>
</html>
