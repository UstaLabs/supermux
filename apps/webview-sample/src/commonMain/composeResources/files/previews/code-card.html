<script type="text/plain" id="kotlin-src">
package dev.supermux.webview.demo

import androidx.compose.foundation.layout.*
import androidx.compose.foundation.lazy.LazyColumn
import androidx.compose.foundation.lazy.items
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.draw.clip
import androidx.compose.ui.unit.dp
import dev.supermux.webview.*
import kotlinx.serialization.json.JsonPrimitive

private val ORIGIN = WebOrigin("previews")

/**
 * A chat of live previews: each agent
 * message may carry a web page, shown
 * in a rounded card as the list scrolls.
 */
@Composable
fun WebViewDemo(
    messages: List<Message>,
    files: PreviewFiles,
) {
    var count by remember { mutableIntStateOf(0) }
    LazyColumn(
        modifier = Modifier.fillMaxSize(),
        reverseLayout = true,
        contentPadding = PaddingValues(16.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp),
    ) {
        items(messages, key = { it.id }) { message ->
            Bubble(message) {
                message.preview?.let { preview ->
                    PreviewCard(preview, files) { delta ->
                        count += delta
                        count
                    }
                }
            }
        }
    }
}

@Composable
private fun PreviewCard(
    preview: Preview,
    files: PreviewFiles,
    onCount: (Int) -> Int,
) {
    val state = rememberWebViewState(
        WebContent.Bundle(ORIGIN, files, "${preview.slug}.html"),
    )
    // The page asks over the bridge; the app answers.
    DisposableEffect(state) {
        val undo = state.bridge.handle("counter.add") { params ->
            JsonPrimitive(onCount(params.int("delta") ?: 1))
        }
        onDispose { undo() }
    }
    WebView(
        state = state,
        modifier = Modifier
            .fillMaxWidth()
            .clip(RoundedCornerShape(20.dp)),
        sizing = WebSizing.WrapContentHeight(max = 560.dp),
        activation = Activation.WhenVisible(settleMillis = 150),
    )
}
</script>

<script type="text/plain" id="markdown-src">
# WebView 1.4 release notes

_October 31, 2026_ · **12 contributors** · 48 pull requests

Pages in lazy lists now stay live while they show, park when they scroll away, and come back exactly as they were.

## Highlights

- **Engine pool**: up to four live pages share warm engines
- **Snapshots** cover a page until it paints: no white flash
- `WrapContentHeight` sizes a view to its page, capped
- Bridge calls time out after `10 s` instead of hanging

## Upgrade checklist

- [x] Bump `dev.supermux:webview` to `1.4.0`
- [x] Serve pages as a `WebContent.Bundle`
- [ ] Register handlers with `bridge.handle`
- [ ] Re-run the perf lab on a real phone

## Breaking changes

> `WebSettings.cacheMode` is gone. Bundles are served from your own resources, so there is nothing left to cache.

```kotlin
val state = rememberWebViewState(
    WebContent.Bundle(origin, files, "index.html"),
)
WebView(state, sizing = WebSizing.WrapContentHeight(560.dp))
```

## Platforms

| Platform | Engine | Status |
| --- | --- | :---: |
| Android | System WebView | Stable |
| iOS, macOS | WKWebView | Stable |
| Windows | WebView2 | New |
| Linux | WPE WebKit | New |

## Fixed

- A crashed engine no longer leaves a frozen page (#812)
- ~~Flicker on rotation~~: the last frame stays up (#790)
- Dark mode follows the app's theme, not the system's (#774)

Thanks to everyone who filed issues and tried the betas.

  var KW = {};

    'lateinit companion typealias try catch finally throw').split(' ').forEach(function (k) { KW[k] = 1; });

    "('(?:\\\\.|[^'\\\\\\n])+')",                               // 3 char

    '([A-Za-z_]\\w*)',                                          // 6 word
    '(\\n)',                                                    // 7 line break
    '([ \\t]+)',                                                // 8 blanks

      html += piece;
      col += s.length;
    });
    if (caretAt !== undefined) html += '<span class="caret"></span>';
    return html;
  }

  function renderKotlin() {
    var lines = toLines(tokenize(SOURCE));
    var numbers = [], code = [], row = 0, hlRow = -1;
    for (var n = 1; n <= lines.length; n++) {
      var line = lines[n - 1];
      if (P.fold && n > P.fold[0] && n <= P.fold[1]) continue;
      var html;
      if (P.fold && n === P.fold[0]) {
        html = '<span class="t-kw">import</span> <span class="fold">...</span>';
      } else {
        html = lineHtml(line, P.caret && P.caret[0] === n ? P.caret[1] : undefined);
      }
      if (P.caret && P.caret[0] === n) { hlRow = row; numbers.push('<b>' + n + '</b>'); } else numbers.push(String(n));
      code.push(html);
      row++;
    }
    content.innerHTML = '<div class="sheet">' +
      (hlRow >= 0 ? '<div class="row-hl" style="top:' + (10 + hlRow * 18) + 'px"></div>' : '') +
      '<div class="gutter" aria-hidden="true">' + numbers.join('\n') + '</div>' +
      '<pre class="src">' + code.join('\n') + '</pre></div>';
  }

  // A tiny Markdown converter: headings, paragraphs, bullet and task lists, inline code, fenced code, quotes, tables.
  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?!\w)/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span class="link">$1</span>')
      .replace(/(^|[\s(])#(\d+)\b/g, '$1<span class="issue">#$2</span>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + esc(codes[+i]) + '</code>'; });
  }

  function cell(text, align, tag) {
    var body = /^(Stable|New|Beta)$/.test(text)
      ? '<span class="pill ' + text.toLowerCase() + '">' + text + '</span>' : inline(text);
    return '<' + tag + (align ? ' class="' + align + '"' : '') + '>' + body + '</' + tag + '>';
  }

  function markdown(src) {
    var lines = src.split('\n'), out = [], i = 0, m;
    var LIST = /^\s*([-*+]|\d+\.)\s+/, BREAK = /^(#{1,4}\s|```|>|\s*([-*+]|\d+\.)\s|\s*\|)/;
    var cells = function (l) { return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); };
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^```(\w*)/))) {
        var lang = m[1], code = [];
        for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
        i++;
        var body = lang === 'kotlin' ? toLines(tokenize(code.join('\n'))).map(function (l) { return lineHtml(l); }).join('\n')
          : esc(code.join('\n'));
        out.push('<pre class="block"><code>' + body + '</code></pre>');
      } else if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        var level = Math.min(3, m[1].length);
        out.push('<h' + level + '>' + inline(m[2]) + '</h' + level + '>');
        i++;
      } else if (/^>/.test(line)) {
        var quote = [];
        while (i < lines.length && /^>/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
        out.push('<blockquote>' + inline(quote.join(' ')) + '</blockquote>');
      } else if (/^\s*\|/.test(line) && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || '')) {
        var head = cells(line), aligns = cells(lines[i + 1]).map(function (c) {
          return /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : '';
        });
        var rows = [];
        for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
        out.push('<table><thead><tr>' + head.map(function (c, k) { return cell(c, aligns[k], 'th'); }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) {
            return '<tr>' + r.map(function (c, k) { return cell(c, aligns[k], 'td'); }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
      } else if (/^(-{3,}|\*{3,})\s*$/.test(line)) {
        out.push('<hr>');
        i++;
      } else if (LIST.test(line)) {
        var ordered = /^\s*\d/.test(line), items = [];
        while (i < lines.length && LIST.test(lines[i])) items.push(lines[i++].replace(LIST, ''));
        var tasks = items.every(function (it) { return /^\[[ xX]\]\s/.test(it); });
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + (tasks ? ' class="tasks"' : '') + '>' + items.map(function (it) {
          var t = it.match(/^\[([ xX])\]\s+(.*)$/);
          if (!t) return '<li>' + inline(it) + '</li>';
          var done = t[1] !== ' ';
          return '<li class="task' + (done ? ' done' : '') + '"><span class="box" role="img" aria-label="' +
            (done ? 'done' : 'to do') + '"></span>' + inline(t[2]) + '</li>';
        }).join('') + '</' + tag + '>');
      } else {
        var para = [line.trim()];
        for (i++; i < lines.length && lines[i].trim() && !BREAK.test(lines[i]); i++) para.push(lines[i].trim());
        var text = para.join(' ');
        // A line of only emphasis right under the title is the document's byline.
        var meta = out.length === 1 && /^_/.test(text);
        out.push('<p' + (meta ? ' class="meta"' : '') + '>' + inline(text) + '</p>');
      }
    }
    return out.join('');
  }

  if (P.name === 'markdown') content.innerHTML = '<article class="md">' + markdown(SOURCE) + '</article>';
  else renderKotlin();

  // The fade at the bottom says there is more; it goes once the end is in view.
  function edge() {
    var end = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 4;
    view.classList.toggle('at-end', end);
  }
  scroll.addEventListener('scroll', edge, { passive: true });
  Kit.watch(scroll, edge);

  // Copy: tells the app how many lines, and puts the text on the clipboard where the engine allows it.
  var copyButton = document.getElementById('copy'), copyLabel = document.getElementById('copy-label'), resetTimer = 0;
  function copyText(text) {
    return new Promise(function (resolve) {
      function fallback() {
        try {
          var area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;' +
            '-webkit-user-select:text;user-select:text;';
          document.body.appendChild(area);
          area.select();
          area.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(area);
          resolve(!!ok);
        } catch (e) {
          resolve(false);
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, fallback);
      } else {
        fallback();
      }
    });
  }
  copyButton.addEventListener('click', function () {
    var posted = Kit.post('code.copy', { lines: SOURCE.split('\n').length });
    copyText(SOURCE).then(function (copied) {
      copyButton.classList.toggle('ok', copied || posted);
      copyLabel.textContent = copied || posted ? 'Copied' : 'Not allowed';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        copyButton.classList.remove('ok');
        copyLabel.textContent = 'Copy';
      }, 1600);
    });
  });

  // Where the reader was, kept while the engine shows another preview.
  Kit.keep(function () { return { top: scroll.scrollTop, left: scroll.scrollLeft }; }, function (saved) {
    if (typeof saved.top === 'number') scroll.scrollTop = saved.top;
    if (typeof saved.left === 'number') scroll.scrollLeft = saved.left;
    edge();
  });
})();
</script>
</body>
</html>
