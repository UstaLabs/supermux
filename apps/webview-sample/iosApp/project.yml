# The iOS host of :webview-sample: the perf lab on real WKWebView engines, and (launched with -engine-checks) the
# engine's conformance checks. `xcodegen generate`, then device-checks/ios-engine-checks.sh or device-checks/ios-sim.sh,
# on the Mac. Simulator builds only: no team, no signing (CODE_SIGNING_ALLOWED=NO).
name: WebViewSample
options:
  bundleIdPrefix: dev.supermux.webview
  deploymentTarget: { iOS: "15.0" }
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  # Not "WebViewSample": the app's own Swift module would shadow the framework's in `import WebViewSample`.
  WebViewSampleApp:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: webview-sample
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Compose's PlistSanityCheck aborts at launch without it.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.supermux.webview.sample
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, WebViewSample]
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@executable_path/Frameworks"]
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_DEBUG_DYLIB: NO
        # The framework is rebuilt by the pre-build script; an explicit-module scan can cache the previous build's.
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
    preBuildScripts:
      - name: Build WebViewSample.framework (embed and sign)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ -f "$HOME/ios-build-env.sh" ]; then . "$HOME/ios-build-env.sh"; fi
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)}"
          cd "$SRCROOT/../.."
          # --no-daemon: a daemon started over SSH loses the session's keychain (and the Mac's Gradle is shared).
          ./gradlew --no-daemon :webview-sample:embedAndSignAppleFrameworkForXcode
